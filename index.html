<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trainer DrillDown — Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;font-size:13px}

/* ── Header ── */
.header{background:linear-gradient(135deg,#1a1f2e,#16213e);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2d3748;position:sticky;top:0;z-index:300}
.header h1{font-size:17px;font-weight:700;color:#fff}
.header-sub{font-size:11px;color:#718096;margin-top:2px}
.sync-bar{display:flex;align-items:center;gap:14px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#48bb78;animation:pulse 1.5s infinite}
.sync-dot.error{background:#fc5353;animation:none}
.sync-dot.loading{background:#ecc94b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-label{font-size:11px;color:#718096}
.countdown{font-size:11px;color:#4299e1;font-weight:600;width:20px;text-align:right}
.last-sync{font-size:10px;color:#4a5568}
.gstats{display:flex;gap:16px}
.gs{text-align:center}.gs .v{font-size:18px;font-weight:700}.gs .l{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.4px}

/* ── Tabs ── */
.tabs{display:flex;background:#1a1f2e;border-bottom:2px solid #2d3748;padding:0 24px;position:sticky;top:57px;z-index:200;overflow-x:auto}
.tab{padding:11px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#718096;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:#e2e8f0}.tab.active{color:#fff;border-bottom-color:#4299e1}
.tab .cnt{background:#2d3748;border-radius:10px;padding:1px 7px;font-size:11px;color:#a0aec0}
.tab.active .cnt{background:#4299e1;color:#fff}

/* ── Controls ── */
.controls{padding:10px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #1a2033;background:#12161f;position:sticky;top:103px;z-index:190}
.pf-btn{padding:4px 11px;border-radius:20px;border:1px solid #2d3748;background:transparent;color:#a0aec0;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pf-btn:hover{color:#fff;border-color:#4a5568}
.pf-btn.active[data-p="ALL"]{background:#4299e1;border-color:#4299e1;color:#fff}
.pf-btn.active[data-p="CRITICAL"]{background:#fc5353;border-color:#fc5353;color:#fff}
.pf-btn.active[data-p="HIGH"]{background:#ed8936;border-color:#ed8936;color:#fff}
.pf-btn.active[data-p="MEDIUM"]{background:#ecc94b;border-color:#ecc94b;color:#1a1a1a}
.pf-btn.active[data-p="LOW"]{background:#4299e1;border-color:#4299e1;color:#fff}
.pf-btn.active[data-p="STABLE_DROP"]{background:#ff6b6b;border-color:#ff6b6b;color:#fff}
.pf-btn.active[data-p="STABLE"]{background:#48bb78;border-color:#48bb78;color:#1a1a1a}
.pf-btn.active[data-p="INACTIVE"]{background:#718096;border-color:#718096;color:#fff}
.search-wrap{margin-left:auto;position:relative}
.search-wrap::before{content:"🔍";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.search-wrap input{background:#1a1f2e;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:5px 10px 5px 28px;font-size:12px;width:200px;outline:none}
.search-wrap input:focus{border-color:#4299e1}

/* ── Summary cards ── */
.sumcards{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px 24px;background:#12161f;border-bottom:1px solid #1a2033}
.sc{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:8px 12px;text-align:center}
.sc .sv{font-size:20px;font-weight:700}.sc .sl{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.sc.crit{border-color:#fc5353;background:#1e0c0c}.sc.crit .sv{color:#fc5353}
.sc.high{border-color:#ed8936;background:#1e1208}.sc.high .sv{color:#ed8936}
.sc.med{border-color:#ecc94b;background:#1c1900}.sc.med .sv{color:#ecc94b}
.sc.low{border-color:#4299e1;background:#0a1420}.sc.low .sv{color:#4299e1}
.sc.stbdrop{border-color:#ff6b6b;background:#1e0a0a}.sc.stbdrop .sv{color:#ff6b6b}
.sc.stb{border-color:#48bb78;background:#0a1e12}.sc.stb .sv{color:#48bb78}
.sc.inact .sv{color:#718096}

/* ── Tree table ── */
.tree-wrap{overflow-x:auto}
.tree-table{width:100%;border-collapse:collapse;min-width:900px}
.tree-table th{padding:8px 10px;text-align:left;color:#4a5568;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1a2033;background:#10141c;white-space:nowrap}
.tree-table th.r{text-align:right}

/* section */
.row-section td{background:#0d1218;color:#3a5070;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;padding:6px 12px;border-bottom:1px solid #1a2033}
.row-section.sd td{background:#1e0c0c;color:#ff6b6b;border-left:3px solid #ff6b6b}

/* account */
.row-account{border-bottom:1px solid #1e2535;cursor:pointer;transition:background .1s}
.row-account:hover{background:#1a2030}
.row-account td{padding:8px 10px;vertical-align:middle}
.row-account.hidden{display:none}
.tog{border:none;border-radius:3px;color:#a0aec0;cursor:pointer;font-size:10px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.acc-tog{width:18px;height:18px;background:#252d3d;margin-right:5px}.acc-tog:hover{background:#4299e1;color:#fff}
.acc-name{font-weight:600;color:#e2e8f0}
.acc-sub{font-size:10px;color:#4a5568;margin-left:5px}

/* project */
.row-project{display:none;border-bottom:1px solid #161d2a;cursor:pointer;transition:background .1s}
.row-project:hover{background:#161d28}.row-project.vis{display:table-row}
.row-project td{padding:6px 10px 6px 32px;vertical-align:middle;background:#0f1420}
.row-project.sdp td{background:#1a0c0c}.row-project.sdp:hover td{background:#200e0e}
.proj-tog{width:16px;height:16px;background:#1e2535;margin-right:4px}.proj-tog:hover{background:#2d6a9f;color:#fff}
.proj-name{color:#c0cfe0;font-size:12px}
.bdrop{background:#2d0f0f;color:#fc5353;border:1px solid #fc535355;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:600}
.bstable{background:#0d2018;color:#48bb78;border:1px solid #48bb7855;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px}
.bstabledrop{background:#2d0f0f;color:#ff6b6b;border:1px solid #ff6b6b;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:700}

/* module */
.row-module{display:none;border-bottom:1px solid #131822}.row-module.vis{display:table-row}
.row-module td{padding:5px 10px 5px 56px;vertical-align:middle;background:#0b1018}
.mod-tog{width:14px;height:14px;background:#1a2030;margin-right:4px}.mod-tog:hover{background:#1a3a5a;color:#fff}
.mod-name{color:#7a9ab0;font-size:11px}

/* event/user */
.row-event{display:none;border-bottom:1px solid #10151f}.row-event.vis{display:table-row}
.row-event td{padding:5px 10px 5px 78px;vertical-align:middle;background:#080c14}
.evt-name{color:#5a7090;font-size:11px;font-family:monospace}
.ubox{margin-top:3px;display:inline-flex;align-items:center;gap:8px;background:#0f1828;border:1px solid #1e3050;border-radius:5px;padding:3px 8px}
.uname{color:#7eb8e0;font-size:12px;font-weight:600}
.uphone{color:#4a9edd;font-size:12px;font-weight:700;letter-spacing:.4px}

/* priority badge */
.pb{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.pb.CRITICAL{background:#2d0f0f;color:#fc5353;border:1px solid #fc5353}
.pb.HIGH{background:#2d1a0a;color:#ed8936;border:1px solid #ed8936}
.pb.MEDIUM{background:#2d2800;color:#ecc94b;border:1px solid #ecc94b}
.pb.LOW{background:#0a1a2d;color:#4299e1;border:1px solid #4299e1}
.pb.STABLE{background:#0d2d18;color:#48bb78;border:1px solid #48bb78}
.pb.STABLE_DROP{background:#2d0f0f;color:#ff6b6b;border:1px solid #ff6b6b}
.pb.INACTIVE{background:#1a1a1a;color:#718096;border:1px solid #718096}

/* numbers */
.nr{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.neg{color:#fc5353}.pos{color:#48bb78}.neu{color:#4a5568}.zred{color:#fc535355}
.sm{font-size:11px}

/* trend */
.trend{display:flex;align-items:flex-end;gap:2px;height:18px;min-width:40px}
.tbar{flex:1;border-radius:1px 1px 0 0;min-height:2px;min-width:5px}

/* loading overlay */
.overlay{position:fixed;inset:0;background:#0f1117ee;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.spinner{width:40px;height:40px;border:3px solid #2d3748;border-top-color:#4299e1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:#1e0c0c;border:1px solid #fc5353;border-radius:10px;padding:20px 28px;max-width:480px;text-align:center}
.err-box h3{color:#fc5353;margin-bottom:8px}
.err-box p{color:#a0aec0;font-size:12px;line-height:1.6}
.panel{display:none}.panel.active{display:block}
.last-disp{font-size:10px;color:#4a6080;white-space:nowrap}
.dispo{font-size:10px;color:#556070;font-style:italic;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Snap Button (in account row) ── */
.sg-snap-btn{background:#1a2a4a;border:1px solid #2d4a7a;color:#7eb8e0;padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.sg-snap-btn:hover{background:#2563eb;border-color:#2563eb;color:#fff}

/* ── Snap Modal ── */
.sg-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.72);display:none;align-items:flex-start;justify-content:center;z-index:1000;padding:30px 20px;overflow-y:auto}
.sg-modal-bg.show{display:flex}
.sg-modal{background:#fff;border-radius:16px;padding:24px;max-width:700px;width:100%;color:#1F2937}
.sg-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sg-modal-head h2{font-size:17px;font-weight:600;color:#1F2937}
.sg-close-btn{background:none;border:none;font-size:26px;cursor:pointer;color:#6B7280;line-height:1}
.sg-detail-row{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:12px;gap:8px}
.sg-detail-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#4B5563;cursor:pointer;padding:6px 10px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:999px;user-select:none}
.sg-detail-toggle input{margin:0;cursor:pointer}
.sg-size-hint{display:none;font-size:11px;color:#92400E;background:#FEF3C7;padding:4px 10px;border-radius:999px}
.sg-size-hint.ok{color:#14532D;background:#DCFCE7}

/* Snap card */
.sg-snap-card{background:#fff;border-radius:16px;padding:22px;max-width:580px;margin:0 auto;border:0.5px solid #E5E7EB;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.sg-snap-header{text-align:center;padding-bottom:14px;border-bottom:0.5px solid #ECECE6}
.sg-snap-brand{font-size:11px;color:#2563EB;letter-spacing:1.5px;font-weight:600}
.sg-snap-acct{font-size:18px;font-weight:600;margin-top:6px;color:#1F2937}
.sg-snap-meta{font-size:12px;color:#6B6B68;margin-top:2px}

.sg-hero-vs{padding:18px 0 16px}
.sg-hero-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.sg-hero-side{text-align:center}
.sg-hero-side-label{font-size:11px;letter-spacing:.5px;font-weight:500}
.sg-hero-side-num{font-size:44px;font-weight:700;line-height:1.1}
.sg-yest-label{color:#6B7280}.sg-yest-num{color:#6B7280}
.sg-today-label{color:#16A34A;font-weight:600}.sg-today-num{color:#16A34A}
.sg-today-label.down{color:#DC2626}.sg-today-num.down{color:#DC2626}
.sg-hero-arrow{font-size:32px;color:#16A34A}
.sg-hero-arrow.down{color:#DC2626}
.sg-hero-strip{margin-top:12px;padding:8px;border-radius:8px;text-align:center;font-size:13px;font-weight:600}
.sg-hero-strip.up{background:#DCFCE7;color:#14532D}
.sg-hero-strip.down{background:#FEE2E2;color:#7F1D1D}
.sg-hero-strip.flat{background:#F3F4F6;color:#374151}

.sg-watchlist{margin:14px 0 4px;padding:12px 14px;border-radius:10px;border-left:3px solid #F59E0B;background:#FEF3C7}
.sg-watchlist.danger{border-left-color:#DC2626;background:#FEE2E2}
.sg-watchlist.clear{border-left-color:#16A34A;background:#DCFCE7}
.sg-wl-title{font-size:11px;font-weight:700;color:#7C2D12;letter-spacing:.6px;margin-bottom:6px}
.sg-watchlist.danger .sg-wl-title{color:#7F1D1D}
.sg-watchlist.clear .sg-wl-title{color:#14532D}
.sg-wl-item{font-size:12px;line-height:1.6;color:#1F2937}
.sg-wl-item+.sg-wl-item{margin-top:2px}
.sg-wl-item b{font-weight:700}
.sg-wl-item .lbl{font-weight:700;color:#7C2D12;margin-right:4px}
.sg-watchlist.danger .sg-wl-item .lbl{color:#7F1D1D}

.sg-legend-wrap{padding-top:14px;border-top:0.5px solid #ECECE6}
.sg-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:14px;font-size:11px;color:#1F2937}
.sg-legend-box{display:inline-block;width:12px;height:9px;border-radius:3px;vertical-align:middle;margin-right:5px}

.sg-project-row{margin-bottom:14px;padding-bottom:12px;border-bottom:0.5px dashed #ECECE6}
.sg-project-row:last-child{border-bottom:none;padding-bottom:0}
.sg-project-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sg-project-name{font-size:13px;font-weight:600;color:#1F2937}
.sg-project-name.warn{color:#991B1B}
.sg-project-delta{font-size:12px}
.sg-delta-from{color:#6B7280}
.sg-delta-pill{font-weight:700;padding:2px 8px;border-radius:999px;font-size:11px;margin-left:4px}
.sg-delta-pill.up{background:#DCFCE7;color:#14532D}
.sg-delta-pill.down{background:#FEE2E2;color:#991B1B}
.sg-delta-pill.flat{background:#F3F4F6;color:#4B5563}

.sg-stack-bar{display:flex;height:22px;border-radius:6px;overflow:hidden}
.sg-stopped-line{font-size:10px;color:#991B1B;margin-top:6px;line-height:1.4}
.sg-stopped-line strong{font-weight:600}
.sg-stopped-pill{display:inline-block;background:#FEE2E2;color:#991B1B;padding:1px 7px;border-radius:999px;margin-right:4px;margin-top:2px;font-weight:500}
.sg-breakdown{margin-top:8px;font-size:11.5px;line-height:1.65;display:grid;gap:4px}
.sg-bd-line{display:grid;grid-template-columns:10px 1fr;gap:7px;align-items:baseline}
.sg-bd-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-top:4px}
.sg-bd-text{color:#1F2937}
.sg-bd-mod{font-weight:700;color:#111827}
.sg-bd-cnt-big{font-weight:700;color:#111827;font-variant-numeric:tabular-nums;margin-left:2px}
.sg-bd-em-dash{color:#D1D5DB;margin:0 2px}
.sg-bd-sep{color:#D1D5DB;margin:0 5px}
.sg-user-name{color:#1F2937;font-weight:500}
.sg-user-name.drop{color:#991B1B;font-weight:700}
.sg-user-cnt{color:#111827;font-weight:700;font-variant-numeric:tabular-nums;margin-left:2px}
.sg-user-badge{font-size:9.5px;padding:1px 5px;border-radius:999px;font-weight:700;margin-left:3px;vertical-align:1px}
.sg-user-badge.up{background:#DCFCE7;color:#15803D}
.sg-user-badge.down{background:#FEE2E2;color:#991B1B}
.sg-user-badge.new{background:#DBEAFE;color:#1D4ED8}
.sg-mod-badge{font-size:10px;padding:1px 6px;border-radius:999px;font-weight:700;margin-left:5px;vertical-align:1px}
.sg-mod-badge.up{background:#DCFCE7;color:#15803D}
.sg-mod-badge.down{background:#FEE2E2;color:#991B1B}
.sg-bd-unassigned{color:#9CA3AF;font-style:italic}
.sg-mod-seg{display:flex;border-right:2px solid #fff;min-width:0;overflow:hidden}
.sg-mod-seg:last-child{border-right:none}
.sg-user-cell{text-align:center;line-height:28px;color:#fff;font-size:10px;font-weight:600;border-right:1px solid rgba(255,255,255,0.4);min-width:0;overflow:hidden;white-space:nowrap;padding:0 4px;text-overflow:clip}
.sg-collapsed-summary{font-size:11.5px;color:#4B5563;margin-top:6px;line-height:1.5}
.sg-collapsed-summary b{color:#1F2937;font-weight:600}

.sg-highlights{margin-top:16px;padding-top:14px;border-top:0.5px solid #ECECE6}
.sg-highlights-title{font-size:11px;font-weight:600;color:#6B6B68;letter-spacing:1px;margin-bottom:10px}
.sg-highlights-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sg-highlight-card{border-radius:10px;padding:10px 12px}
.sg-highlight-card.good{background:#DCFCE7}
.sg-highlight-card.warn{background:#FEF2F2}
.sg-h-label{font-size:10px;font-weight:700;letter-spacing:.5px}
.sg-highlight-card.good .sg-h-label{color:#15803D}
.sg-highlight-card.warn .sg-h-label{color:#991B1B}
.sg-h-name{font-size:14px;font-weight:700;margin-top:4px}
.sg-highlight-card.good .sg-h-name{color:#14532D}
.sg-highlight-card.warn .sg-h-name{color:#7F1D1D}
.sg-h-sub{font-size:11px}
.sg-highlight-card.good .sg-h-sub{color:#15803D}
.sg-highlight-card.warn .sg-h-sub{color:#991B1B}

.sg-caption-strip{margin-top:14px;padding:12px 14px;border-radius:0 8px 8px 0}
.sg-caption-strip.healthy{background:#DCFCE7;border-left:3px solid #16A34A;color:#14532D}
.sg-caption-strip.risk{background:#FEF3C7;border-left:3px solid #F59E0B;color:#78350F}
.sg-caption-strip.declining{background:#FEE2E2;border-left:3px solid #DC2626;color:#7F1D1D}
.sg-caption-strip .ct{font-size:13px;line-height:1.5}

/* Caption editor */
.sg-caption-editor{margin-top:16px;padding:12px 14px;border:1px dashed #B5B5AE;border-radius:10px;background:#FAFAF7}
.sg-caption-editor-label{font-size:11px;font-weight:600;color:#4B5563;margin-bottom:6px;letter-spacing:.4px}
.sg-caption-textarea{width:100%;border:none;background:transparent;resize:vertical;min-height:60px;font-family:inherit;font-size:13px;line-height:1.6;outline:none;color:#1F2937}

/* Actions */
.sg-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sg-btn{flex:1;min-width:140px;padding:12px 8px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sg-btn-primary{background:#2563EB;color:#fff}
.sg-btn-primary:hover{background:#1D4ED8}
.sg-btn-secondary{background:#fff;color:#1F2937;border:1px solid #E5E7EB}
.sg-btn-secondary:hover{background:#F9FAFB}

.sg-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:2000}
.sg-toast.show{opacity:1}
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div style="color:#718096;font-size:13px">Connecting to Redash...</div>
</div>

<!-- Header -->
<div class="header">
  <div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:22px">📊</span>
      <div>
        <h1>Trainer DrillDown — Live Dashboard</h1>
        <div class="header-sub">Auto-syncing via Vercel · Query #1468 · Account → Project → Module → Event → User</div>
      </div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:20px">
    <div class="sync-bar">
      <div class="sync-dot" id="sync-dot"></div>
      <span class="sync-label">Next sync in</span>
      <span class="countdown" id="countdown">5</span>

<script>
// ── Config ────────────────────────────────────────────────────
const REDASH_URL  = "https://redashv3.getpowerplay.in";
const API_KEY     = "yxqnSo7sT97kxbSPTFKDI0OvjRnMGroE1NGyySTc";
const QUERY_ID    = "1468";
const PARAMS      = {"p_renewal_start": "2026-04-01", "p_renewal_end": "2030-04-30"};
const REFRESH_SEC = 5;

// ── Column name detection ─────────────────────────────────────
function detectCols(columns) {
  const names = columns.map(c => c.name.toLowerCase());
  const find = (...opts) => {
    for (const o of opts) {
      const i = names.findIndex(n => n === o || n.includes(o));
      if (i >= 0) return columns[i].name;
    }
    return null;
  };
  return {
    trainer    : find('trainer_email','trainer','trainer_name'),
    org        : find('org_name','organisation_name','organization_name','account_name','org'),
    project    : find('project_name','project'),
    module     : find('module_name','module'),
    event      : find('event_name','event','event_type'),
    user       : find('user_name','username','user'),
    mobile     : find('mobile_number','mobile','phone','phone_number'),
    renewal    : find('renewal_date','renewal'),
    last_disp  : find('last_disposition_date','last_disposition','last_disp'),
    disposition: find('disposition','notes'),
    wk0        : find('wk_0','wk0','week_0'),
    wk1        : find('wk_1','wk1','week_1'),
    wk2        : find('wk_2','wk2','week_2'),
    wk3        : find('wk_3','wk3','week_3'),
  };
}

const TRAINER_NAMES = {
  'digvijay'  : 'Digvijay',
  'farid'     : 'S Farid',
  'sfarid'    : 'S Farid',
  's farid'   : 'S Farid',
  'divya'     : 'Divya',
};
function trainerDisplay(email) {
  if (!email) return email;
  const low = email.toLowerCase();
  const prefix = low.split('@')[0];
  for (const [k,v] of Object.entries(TRAINER_NAMES)) {
    if (prefix.includes(k) || low.includes(k)) return v;
  }
  return email.split('@')[0];
}

function processRows(rows, cols) {
  const trainers = {};
  rows.forEach(row => {
    const trainer  = trainerDisplay(row[cols.trainer] || '');
    const org      = row[cols.org]     || 'Unknown';
    const project  = row[cols.project] || 'Unknown';
    const module   = row[cols.module]  || 'Unknown';
    const event    = row[cols.event]   || '';
    const user     = row[cols.user]    || '';
    const mobile   = row[cols.mobile]  || '';
    const renewal  = row[cols.renewal] || '';
    const lastDisp = row[cols.last_disp] || '';
    const dispo    = row[cols.disposition] || '';
    const wk0 = parseInt(row[cols.wk0] || 0);
    const wk1 = parseInt(row[cols.wk1] || 0);
    const wk2 = parseInt(row[cols.wk2] || 0);
    const wk3 = parseInt(row[cols.wk3] || 0);
    if (!trainers[trainer]) trainers[trainer] = {};
    const tMap = trainers[trainer];
    if (!tMap[org]) tMap[org] = { renewal, projects: {} };
    const orgObj = tMap[org];
    if (!orgObj.projects[project]) orgObj.projects[project] = { modules: {} };
    const projObj = orgObj.projects[project];
    if (!projObj.modules[module]) projObj.modules[module] = { events: [] };
    projObj.modules[module].events.push({ event, user, mobile, wk0, wk1, wk2, wk3, lastDisp, dispo });
  });

  const PRIO_ORDER = ['CRITICAL','HIGH','MEDIUM','LOW','STABLE_DROP','STABLE','INACTIVE'];
  const result = {};
  Object.entries(trainers).forEach(([tName, tMap]) => {
    const accounts = [];
    Object.entries(tMap).forEach(([orgName, orgData], ai) => {
      const projects = [];
      let accWk0=0, accWk1=0, accWk2=0, accWk3=0;
      Object.entries(orgData.projects).forEach(([projName, projData]) => {
        const modules = [];
        let pWk0=0, pWk1=0, pWk2=0, pWk3=0;
        Object.entries(projData.modules).forEach(([modName, modData]) => {
          let mWk0=0, mWk1=0, mWk2=0, mWk3=0;
          const events = modData.events.map(e => {
            mWk0+=e.wk0; mWk1+=e.wk1; mWk2+=e.wk2; mWk3+=e.wk3;
            return e;
          });
          const mDiff = mWk0 - mWk1;
          const mPct  = mWk1 > 0 ? ((mDiff/mWk1)*100).toFixed(1)+'%' : '';
          pWk0+=mWk0; pWk1+=mWk1; pWk2+=mWk2; pWk3+=mWk3;
          modules.push({ name:modName, wk0:mWk0, wk1:mWk1, wk2:mWk2, wk3:mWk3, diff:mDiff, pct:mPct, events });
        });
        const pDiff = pWk0 - pWk1;
        const pPct  = pWk1 > 0 ? ((pDiff/pWk1)*100).toFixed(1)+'%' : '';
        const isDrop = pWk0 < pWk1;
        accWk0+=pWk0; accWk1+=pWk1; accWk2+=pWk2; accWk3+=pWk3;
        projects.push({ name:projName, wk0:pWk0, wk1:pWk1, wk2:pWk2, wk3:pWk3, diff:pDiff, pct:pPct, isDrop, modules });
      });
      const diff = accWk0 - accWk1;
      const pct  = accWk1 > 0 ? (diff/accWk1)*100 : 0;
      const pctStr = accWk1 > 0 ? pct.toFixed(1)+'%' : '';
      let priority;
      if (accWk0 === 0 && accWk1 > 0) priority = 'CRITICAL';
      else if (pct <= -75)             priority = 'HIGH';
      else if (pct <= -25)             priority = 'MEDIUM';
      else if (pct < 0)                priority = 'LOW';
      else if (accWk0 === 0)           priority = 'INACTIVE';
      else                             priority = 'STABLE';
      const effP = (priority === 'STABLE' && accWk0 === 0) ? 'STABLE_DROP' : priority;
      accounts.push({
        num: ai+1, name:orgName, renewal:orgData.renewal,
        wk0:accWk0, wk1:accWk1, wk2:accWk2, wk3:accWk3,
        diff, pct:pctStr, priority: effP, projects
      });
    });
    result[tName] = { accounts };
  });
  return result;
}

// ── Rendering helpers ─────────────────────────────────────────
const PRIO_ORDER = ['CRITICAL','HIGH','MEDIUM','LOW','STABLE_DROP','STABLE','INACTIVE'];
function pb(p){ return `<span class="pb ${p}">${p.replace('_',' ')}</span>`; }
function trend(w0,w1,w2,w3){
  const v=[w3,w2,w1,w0], mx=Math.max(...v,1);
  const c=['#3a4a5a','#4a5a6a','#8899aa',w0===0?'#fc5353':(w0>=w1?'#48bb78':'#ed8936')];
  return `<div class="trend">${v.map((n,i)=>`<div class="tbar" style="height:${Math.max(2,Math.round(n/mx*18))}px;background:${c[i]}"></div>`).join('')}</div>`;
}
function nTD(v, zr=false){
  if(v===null||v===undefined) return `<td class="nr neu">—</td>`;
  return `<td class="nr ${zr&&v===0?'zred':''}">${v}</td>`;
}
function dTD(v){
  if(!v&&v!==0) return `<td class="nr neu">—</td>`;
  return `<td class="nr ${v<0?'neg':v>0?'pos':'neu'}">${v>0?'+':''}${v}</td>`;
}
function pTD(v){
  if(!v) return `<td class="nr neu sm">—</td>`;
  return `<td class="nr ${v.startsWith('-')?'neg':'pos'} sm">${v}</td>`;
}

// ── Render a single trainer panel ─────────────────────────────
function renderPanel(tName, tData, tid){
  const accs = tData.accounts;
  const cnt={};
  PRIO_ORDER.forEach(p=>cnt[p]=0);
  accs.forEach(a=>cnt[a.priority]=(cnt[a.priority]||0)+1);

  let html = `<div class="sumcards">
    <div class="sc crit"><div class="sv">${cnt.CRITICAL||0}</div><div class="sl">🔴 Critical</div></div>
    <div class="sc high"><div class="sv">${cnt.HIGH||0}</div><div class="sl">🟠 High</div></div>
    <div class="sc med"><div class="sv">${cnt.MEDIUM||0}</div><div class="sl">🟡 Medium</div></div>
    <div class="sc low"><div class="sv">${cnt.LOW||0}</div><div class="sl">🔵 Low</div></div>
    <div class="sc stbdrop"><div class="sv">${cnt.STABLE_DROP||0}</div><div class="sl">🔴 Stable Drop</div></div>
    <div class="sc stb"><div class="sv">${cnt.STABLE||0}</div><div class="sl">✅ Stable</div></div>
    <div class="sc inact"><div class="sv">${cnt.INACTIVE||0}</div><div class="sl">⚫ Inactive</div></div>
  </div>
  <div class="controls" id="ctrl-${tid}">
    <button class="pf-btn active" data-t="${tid}" data-p="ALL">All (${accs.length})</button>
    <button class="pf-btn" data-t="${tid}" data-p="CRITICAL">🔴 Critical</button>
    <button class="pf-btn" data-t="${tid}" data-p="HIGH">🟠 High</button>
    <button class="pf-btn" data-t="${tid}" data-p="MEDIUM">🟡 Medium</button>
    <button class="pf-btn" data-t="${tid}" data-p="LOW">🔵 Low</button>
    <button class="pf-btn" data-t="${tid}" data-p="STABLE_DROP">🔴 Stable Drop</button>
    <button class="pf-btn" data-t="${tid}" data-p="STABLE">✅ Stable</button>
    <button class="pf-btn" data-t="${tid}" data-p="INACTIVE">⚫ Inactive</button>
    <div class="search-wrap"><input type="text" placeholder="Search account…" data-t="${tid}" class="acc-search"></div>
  </div>
  <div class="tree-wrap"><table class="tree-table">
    <thead><tr>
      <th style="width:22px"></th><th>#</th>
      <th>Account / Project / Module / Event</th>
      <th class="r">Wk 0</th><th class="r">Wk 1</th><th class="r">Wk 2</th><th class="r">Wk 3</th>
      <th class="r">Diff</th><th class="r">%</th><th>Trend</th>
      <th>Priority</th><th>Last Dispos.</th><th>Snap</th>
    </tr></thead><tbody id="tbody-${tid}">`;

  const SECT = {
    CRITICAL:'🔴 CRITICAL — Immediate Action Required',
    HIGH:'🟠 HIGH — Act This Week',
    MEDIUM:'🟡 MEDIUM — Monitor Closely',
    LOW:'🔵 LOW DROP — Watch',
    STABLE_DROP:'🔴 STABLE — Zero Activity This Week',
    STABLE:'✅ STABLE — Active This Week',
    INACTIVE:'⚫ INACTIVE ACCOUNTS'
  };

  const sorted = [...accs].sort((a,b)=>PRIO_ORDER.indexOf(a.priority)-PRIO_ORDER.indexOf(b.priority));

  // Store sorted accounts for snap access
  window._sgSorted = window._sgSorted || {};
  window._sgSorted[tid] = sorted;

  let lastSect = null;
  sorted.forEach((acc, ai) => {
    const aId = `${tid}-a${ai}`;
    const ep = acc.priority;
    if (ep !== lastSect) {
      html += `<tr class="row-section${ep==='STABLE_DROP'?' sd':''}" data-sect="${ep}"><td colspan="13">${SECT[ep]||ep}</td></tr>`;
      lastSect = ep;
    }
    const hasProj = acc.projects.length > 0;
    html += `<tr class="row-account" data-p="${ep}" data-name="${acc.name.toLowerCase()}" data-aid="${aId}" onclick="toggleAcc('${aId}',event)">
      <td><button class="tog acc-tog" id="btn-${aId}">${hasProj?'+':'·'}</button></td>
      <td style="color:#4a5568;font-size:11px">${acc.num}</td>
      <td><span class="acc-name">${acc.name}</span><span class="acc-sub">${acc.projects.length}p</span>
        ${acc.renewal?`<span style="font-size:10px;color:#4a5568;margin-left:5px">🗓 ${acc.renewal}</span>`:''}</td>
      ${nTD(acc.wk0,true)}${nTD(acc.wk1)}${nTD(acc.wk2)}${nTD(acc.wk3)}
      ${dTD(acc.diff)}${pTD(acc.pct)}
      <td>${trend(acc.wk0,acc.wk1,acc.wk2,acc.wk3)}</td>
      <td>${pb(ep)}</td>
      <td></td>
      <td><button class="sg-snap-btn" onclick="event.stopPropagation();openDashboardSnap('${tid}',${ai})" title="Generate Snap">📸 Snap</button></td>
    </tr>`;

    acc.projects.forEach((proj, pi) => {
      const pId = `${aId}-p${pi}`;
      const isSD = !proj.isDrop && proj.wk0 === 0;
      const sym  = proj.isDrop ? `<span style="color:#fc5353;margin-right:3px">⚠</span>` : isSD ? `<span style="color:#ff6b6b;margin-right:3px">⚠</span>` : `<span style="color:#48bb78;margin-right:3px">▲</span>`;
      const bdg  = proj.isDrop ? `<span class="bdrop">DROP</span>` : isSD ? `<span class="bstabledrop">STABLE DROP</span>` : `<span class="bstable">STABLE</span>`;
      const hasMod = proj.modules.length > 0;
      html += `<tr class="row-project${isSD?' sdp':''}" data-acc="${aId}" id="proj-${pId}" onclick="toggleProj('${pId}',event)">
        <td><button class="tog proj-tog" id="btn-${pId}">${hasMod?'+':'·'}</button></td>
        <td></td>
        <td><div style="display:flex;align-items:center">${sym}<span class="proj-name">${proj.name}</span>${bdg}</div></td>
        ${nTD(proj.wk0,true)}${nTD(proj.wk1)}${nTD(proj.wk2)}${nTD(proj.wk3)}
        ${dTD(proj.diff)}${pTD(proj.pct)}
        <td>${trend(proj.wk0,proj.wk1,proj.wk2,proj.wk3)}</td>
        <td></td><td></td><td></td>
      </tr>`;

      proj.modules.forEach((mod, mi) => {
        const mId = `${pId}-m${mi}`;
        const hasEvt = mod.events.length > 0;
        html += `<tr class="row-module" data-proj="${pId}" id="mod-${mId}" onclick="toggleMod('${mId}',event)">
          <td><button class="tog mod-tog" id="btn-${mId}">${hasEvt?'+':'·'}</button></td>
          <td></td>
          <td><span class="mod-name">📦 ${mod.name}</span></td>
          ${nTD(mod.wk0,true)}${nTD(mod.wk1)}${nTD(mod.wk2)}${nTD(mod.wk3)}
          ${dTD(mod.diff)}${pTD(mod.pct)}
          <td></td><td></td><td></td><td></td>
        </tr>`;

        mod.events.forEach(evt => {
          html += `<tr class="row-event" data-mod="${mId}">
            <td></td><td></td>
            <td>
              <div class="evt-name">⚡ ${evt.event}</div>
              <div class="ubox">
                <span>👤</span><span class="uname">${evt.user||'—'}</span>
                ${evt.mobile?`<span style="color:#2d3f50">|</span><span>📞</span><span class="uphone">${evt.mobile}</span>`:''}
              </div>
            </td>
            ${nTD(evt.wk0,true)}${nTD(evt.wk1)}${nTD(evt.wk2)}${nTD(evt.wk3)}
            ${dTD(evt.wk0-evt.wk1)}
            <td></td><td></td>
            <td class="last-disp">${(evt.lastDisp||'—').slice(0,10)}</td>
            <td class="dispo" title="${(evt.dispo||'').replace(/"/g,"'")}">${evt.dispo||'—'}</td>
          </tr>`;
        });
      });
    });
  });

  html += `</tbody></table></div>`;
  return html;
}

// ── State ─────────────────────────────────────────────────────
let countdown = REFRESH_SEC;
let currentTab = null;
let initialized = false;

// ── Fetch + render ────────────────────────────────────────────
async function fetchAndRender() {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot loading';
  try {
    const paramStr = Object.entries(PARAMS).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
    const url = `/api/redash?${paramStr}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    const json = await res.json();
    const qr = json.query_result || json;
    const data = qr.data || qr;
    const columns = data.columns || [];
    const rows    = data.rows    || [];
    if (!columns.length) throw new Error('No columns returned from Redash');
    const cols = detectCols(columns);
    const trainers = processRows(rows, cols);
    if (!initialized) {
      buildUI(trainers);
      initialized = true;
      document.getElementById('overlay').style.display = 'none';
    } else {
      updateUI(trainers);
    }
    dot.className = 'sync-dot';
    document.getElementById('last-sync').textContent = 'Last synced: ' + new Date().toLocaleTimeString();
  } catch (err) {
    dot.className = 'sync-dot error';
    if (!initialized) showError(err);
    console.error('Redash fetch error:', err);
  }
  countdown = REFRESH_SEC;
}

function showError(err) {
  document.getElementById('overlay').innerHTML = `
    <div class="err-box">
      <h3>⚠ Cannot connect to Redash</h3>
      <p>${err.message}</p>
      <p style="margin-top:10px">This usually means <strong>CORS is blocked</strong>.<br>
      Deploy to Vercel — the dashboard is already configured for it.</p>
    </div>`;
}

function buildUI(trainers) {
  window._sgSorted = {}; // reset snap store
  const tabs = document.getElementById('tabs');
  const app  = document.getElementById('app');
  tabs.innerHTML = ''; app.innerHTML = '';
  currentTab = null;
  Object.entries(trainers).forEach(([tName, tData], i) => {
    const tid = tName.replace(/[^a-z0-9]/gi,'_');
    const crit = tData.accounts.filter(a=>a.priority==='CRITICAL').length;
    const high = tData.accounts.filter(a=>a.priority==='HIGH').length;
    const sd   = tData.accounts.filter(a=>a.priority==='STABLE_DROP').length;
    const urg  = crit>0?`<span style="color:#fc5353;font-weight:700"> ${crit}🔴</span>`:
                 high>0?`<span style="color:#ed8936"> ${high}🟠</span>`:'';
    const sdBadge = sd>0?`<span style="color:#ff6b6b;font-size:10px"> ${sd}⚠</span>`:'';
    const tab = document.createElement('div');
    tab.className = 'tab' + (i===0?' active':'');
    tab.dataset.tid = tid;
    tab.innerHTML = `${tName} <span class="cnt">${tData.accounts.length}</span>${urg}${sdBadge}`;
    tab.addEventListener('click', () => switchTab(tid));
    tabs.appendChild(tab);
    const panel = document.createElement('div');
    panel.className = 'panel' + (i===0?' active':'');
    panel.id = 'panel-' + tid;
    panel.innerHTML = renderPanel(tName, tData, tid);
    app.appendChild(panel);
    if (i===0) currentTab = tid;
  });
  updateGlobalStats(trainers);
}

function updateUI(trainers) {
  const prevTab = currentTab;
  buildUI(trainers);
  if (prevTab) {
    const el = document.querySelector(`[data-tid="${prevTab}"]`);
    if (el) { switchTab(prevTab); }
  }
}

function updateGlobalStats(trainers) {
  const gc={};
  Object.values(trainers).forEach(t=>t.accounts.forEach(a=>gc[a.priority]=(gc[a.priority]||0)+1));
  const total = Object.values(gc).reduce((s,v)=>s+v,0);
  document.getElementById('gstats').innerHTML = `
    <div class="gs"><div class="v" style="color:#fc5353">${gc.CRITICAL||0}</div><div class="l">Critical</div></div>
    <div class="gs"><div class="v" style="color:#ed8936">${gc.HIGH||0}</div><div class="l">High</div></div>
    <div class="gs"><div class="v" style="color:#ff6b6b">${gc.STABLE_DROP||0}</div><div class="l">Stable Drop</div></div>
    <div class="gs"><div class="v" style="color:#48bb78">${gc.STABLE||0}</div><div class="l">Stable</div></div>
    <div class="gs"><div class="v" style="color:#a0aec0">${total}</div><div class="l">Total</div></div>`;
}

function switchTab(tid) {
  currentTab = tid;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tid===tid));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tid));
}

// ── Tree toggle functions ─────────────────────────────────────
function toggleAcc(aId,e) {
  e.stopPropagation();
  const btn=document.getElementById('btn-'+aId);
  if(!btn||btn.textContent==='·') return;
  const open=btn.textContent==='+'; btn.textContent=open?'−':'+';
  document.querySelectorAll(`[data-acc="${aId}"]`).forEach(r=>{
    r.classList.toggle('vis',open);
    if(!open){const pb=r.querySelector('.proj-tog');if(pb&&pb.textContent!=='·')pb.textContent='+';}
  });
  if(!open){
    document.querySelectorAll(`[data-acc="${aId}"]`).forEach(r=>{
      const pid=r.id?.replace('proj-','');
      if(pid){
        document.querySelectorAll(`[data-proj="${pid}"]`).forEach(m=>{
          m.classList.remove('vis');

const SG_MODULE_COLORS = {

  'staff':'#9333EA','staff attendance':'#9333EA','tasks':'#2563EB','task':'#2563EB',

  'po':'#3B82F6','purchase order':'#3B82F6'
};
const SG_FALLBACK = ['#2563EB','#F97316','#16A34A','#9333EA','#0891B2','#EC4899','#F59E0B','#10B981','#6366F1','#84CC16','#DC2626','#7C3AED'];

function sgGetColor(name, colorMap) {
  if (colorMap[name]) return colorMap[name];
  const key = (name||'').toLowerCase().trim();
  if (SG_MODULE_COLORS[key]) { colorMap[name]=SG_MODULE_COLORS[key]; return SG_MODULE_COLORS[key]; }
  const used = Object.values(colorMap);
  for (const c of SG_FALLBACK) { if (!used.includes(c)) { colorMap[name]=c; return c; } }
  colorMap[name] = SG_FALLBACK[Object.keys(colorMap).length % SG_FALLBACK.length];
  return colorMap[name];
}

// Transform dashboard account object → snap generator format
function transformAccForSnap(acc) {
  const userSet = new Set();
  const activeUserSet = new Set();
  const silentProjects = [];
  const stoppedModulesFlat = [];
  const allUserDrops = [];

  const projects = acc.projects.map(proj => {
    const modUserMap = {}; // module -> user -> {thisWk, lastWk}
    const stoppedMods = [];

    proj.modules.forEach(mod => {
      const userMap = {};
      mod.events.forEach(evt => {
        if (!evt.user) return;
        userSet.add(evt.user);
        if (!userMap[evt.user]) userMap[evt.user] = {name:evt.user, thisWk:0, lastWk:0};
        userMap[evt.user].thisWk += evt.wk0;
        userMap[evt.user].lastWk += evt.wk1;
      });
      const users = Object.values(userMap).sort((a,b)=>b.thisWk-a.thisWk);
      users.forEach(u => {
        if (u.thisWk > 0) activeUserSet.add(u.name);
        const delta = u.thisWk - u.lastWk;
        if (delta <= -5 && u.lastWk > 0) {
          allUserDrops.push({name:u.name, project:proj.name, module:mod.name, delta, thisWk:u.thisWk, lastWk:u.lastWk});
        }
      });
      if (mod.wk0 === 0 && mod.wk1 > 0) {
        const lastWkUsers = users.filter(u=>u.lastWk>0).slice(0,3);
        stoppedMods.push({name:mod.name, lastWk:mod.wk1, lastWkUsers});
        stoppedModulesFlat.push({project:proj.name, module:mod.name, lastWk:mod.wk1, lastWkUsers});
      }
      modUserMap[mod.name] = {today:mod.wk0, yest:mod.wk1, users};
    });

    const modList = Object.entries(modUserMap).map(([name,v])=>({name, today:v.today, yest:v.yest, users:v.users}));
    const sortedMods = [...modList].sort((a,b)=>b.today-a.today);
    const allUsers = modList.flatMap(m=>m.users);
    const topUser = [...allUsers].sort((a,b)=>b.thisWk-a.thisWk)[0];
    const topModule = sortedMods[0];

    const pPct = proj.wk1>0 ? Math.round(((proj.wk0-proj.wk1)/proj.wk1)*100) : 0;
    const warn = proj.isDrop || (proj.wk0===0 && proj.wk1>0);
    const significant = proj.wk0===0 || Math.abs(pPct)>=10 || stoppedMods.length>0;
    if (proj.wk0===0 && proj.wk1>0) silentProjects.push({name:proj.name, lastWk:proj.wk1});

    return {
      name:proj.name, today:proj.wk0, yest:proj.wk1, warn, pct:pPct, significant,
      stoppedModules:stoppedMods, modules:modList,
      topModuleName:topModule?.name, topUserName:topUser?.name, topUserCount:topUser?.thisWk
    };
  });

  stoppedModulesFlat.sort((a,b)=>b.lastWk-a.lastWk);
  allUserDrops.sort((a,b)=>a.delta-b.delta);

  // Top mover
  const allUsersList = acc.projects.flatMap(p => p.modules.flatMap(m => {
    const um = {};
    m.events.forEach(e => {
      if (!e.user) return;
      if (!um[e.user]) um[e.user]={name:e.user,thisWk:0,lastWk:0,project:p.name,module:m.name};
      um[e.user].thisWk+=e.wk0; um[e.user].lastWk+=e.wk1;
    });
    return Object.values(um);
  }));
  const topMoverCandidate = allUsersList
    .filter(u=>u.lastWk>0&&u.thisWk>u.lastWk)
    .sort((a,b)=>(b.thisWk-b.lastWk)/b.lastWk-(a.thisWk-a.lastWk)/a.lastWk)[0];
  const topMover = topMoverCandidate ? {
    name:topMoverCandidate.name, project:topMoverCandidate.project, module:topMoverCandidate.module,
    pct:Math.round(((topMoverCandidate.thisWk-topMoverCandidate.lastWk)/topMoverCandidate.lastWk)*100)
  } : null;

  // Watch out
  const worstProj = [...projects].sort((a,b)=>{
    const pa=a.yest>0?(a.today-a.yest)/a.yest:0;
    const pb=b.yest>0?(b.today-b.yest)/b.yest:0;
    return pa-pb;
  })[0];
  const watchOut = worstProj&&worstProj.today<worstProj.yest ? {project:worstProj.name, issue:`Down ${Math.abs(worstProj.pct)}% this week`} : null;

  return {
    name:acc.name, totalToday:acc.wk0, totalYest:acc.wk1,
    totalUsers:userSet.size, activeUsersToday:activeUserSet.size,
    moduleColors:{}, projects, silentProjects, stoppedModulesFlat,
    topDrops:allUserDrops.slice(0,4), topMover, watchOut
  };
}

  up:["Hi {customer_name} Sir, sharing this week's snap — team logged {today} activities, up {pct}% vs last week. {top_user} leading on {top_project}. Great momentum 🚀",
      "{customer_name} Sir, this week's update — {today} activities, up {pct}% from last week. {top_user} & team going strong on {top_project}."],
  flat:["Hi {customer_name} Sir, sharing this week's snap — {today} activities, roughly steady vs last week. {top_user} leading on {top_project}. Let's keep building on this.",
        "{customer_name} Sir, this week's update — {today} activities logged. Adoption is steady. {top_user} continues to drive on {top_project}."],
  slight_dip:["Hi {customer_name} Sir, sharing this week's snap — {today} activities logged, slight dip of {pct}% vs last week. {top_user} still active on {top_project}. Want me to do a quick check-in?",
              "{customer_name} Sir, this week's snap — small dip of {pct}% vs last week. Nothing alarming yet, but {watch_project} could use a nudge."],

function sgPctChange(today, yest) {
  if (yest===0) return today>0?100:0;
  return Math.round(((today-yest)/yest)*100);
}
function sgClassifyHealth(a) {
  if (a.totalToday===0) return 'declining';
  const pct=sgPctChange(a.totalToday,a.totalYest);
  if (pct<-30) return 'risk';
  return 'healthy';
}
function sgPickTier(pct, health) {
  if (health==='declining') return 'declining';
  if (health==='risk') return 'risk';
  if (pct>=5) return 'up';
  if (pct>=-5) return 'flat';
  return 'slight_dip';
}
function sgWeekRange() {
  const today=new Date();
  return `Week ending ${today.toLocaleDateString('en-IN',{day:'numeric',month:'short'})} · vs prior week`;
}

let sgCurrentAcct = null;
let sgShowFull = false;

function sgBuildWatchList(a) {
  const hasSilent = a.silentProjects&&a.silentProjects.length>0;
  const hasStopped = a.stoppedModulesFlat&&a.stoppedModulesFlat.length>0;
  const hasDrops = a.topDrops&&a.topDrops.length>0;
  if (!hasSilent&&!hasStopped&&!hasDrops) {
    return `<div class="sg-watchlist clear"><div class="sg-wl-title">✅ ALL CLEAR THIS WEEK</div><div class="sg-wl-item">No silent projects, no stopped modules, no significant drops. Team firing on all cylinders.</div></div>`;
  }
  const danger = hasSilent||a.stoppedModulesFlat.length>=5;
  const items=[];
  if (hasSilent) {
    const txt=a.silentProjects.slice(0,3).map(p=>`<b>${p.name}</b> (was ${p.lastWk})`).join(', ');
    const more=a.silentProjects.length>3?` +${a.silentProjects.length-3} more`:'';
    items.push(`<div class="sg-wl-item"><span class="lbl">Silent projects:</span>${txt}${more}</div>`);
  }
  if (hasStopped) {
    const txt=a.stoppedModulesFlat.slice(0,3).map(s=>{
      const by=s.lastWkUsers&&s.lastWkUsers[0]?` by <b>${s.lastWkUsers[0].name}</b>`:'';
      return `<b>${s.module}</b> on ${s.project} (was ${s.lastWk}${by})`;
    }).join(' · ');
    const more=a.stoppedModulesFlat.length>3?` +${a.stoppedModulesFlat.length-3} more`:'';
    items.push(`<div class="sg-wl-item"><span class="lbl">Modules stopped:</span>${txt}${more}</div>`);
  }
  if (hasDrops) {
    const txt=a.topDrops.slice(0,3).map(d=>`<b>${d.name}</b> ↓${Math.abs(d.delta)} (${d.module} on ${d.project})`).join(' · ');
    items.push(`<div class="sg-wl-item"><span class="lbl">Biggest drops:</span>${txt}</div>`);
  }
  return `<div class="sg-watchlist ${danger?'danger':''}"><div class="sg-wl-title">⚠ NEEDS ATTENTION</div>${items.join('')}</div>`;
}

function sgBuildStackBar(project, maxToday, colorMap) {
  if (!project.modules||project.modules.length===0) {
    return `<div style="height:22px;background:#FEE2E2;border-radius:6px;width:8%;display:flex;align-items:center;justify-content:center;color:#991B1B;font-size:11px;font-weight:600;padding:0 6px">0</div>`;
  }
  const projWidthPct = Math.max((project.today/maxToday)*100,6);
  const barPx = 536*(projWidthPct/100);
  const segs = project.modules.map(m=>{
    const mWPct = project.today>0?(m.today/project.today)*100:0;
    const mPx = barPx*(mWPct/100);
    const color = sgGetColor(m.name,colorMap);
    const label = mPx>22?`${m.today}`:'';
    return `<div class="sg-mod-seg" style="width:${mWPct}%;background:${color};"><div class="sg-user-cell">${label}</div></div>`;
  }).join('');
  return `<div class="sg-stack-bar" style="width:${projWidthPct}%">${segs}</div>`;
}

function sgBuildBreakdown(project, colorMap) {
  if (!project.modules||project.modules.length===0) return '';
  const lines = project.modules.map(m=>{
    const color = sgGetColor(m.name,colorMap);
    const modDelta = m.today-(m.yest||0);
    const modPct = m.yest===0?(m.today>0?100:0):Math.round((modDelta/m.yest)*100);
    const mbClass = modDelta>0?'up':modDelta<0?'down':'';
    const modBadge = modDelta!==0&&m.yest>0
      ?`<span class="sg-mod-badge ${mbClass}">${modDelta>0?'↑':'↓'}${Math.abs(modPct)}%</span>`
      :(m.yest===0?`<span class="sg-mod-badge" style="background:#DBEAFE;color:#1D4ED8">new</span>`:'');
    let usersText = '';
    if (m.users&&m.users.length>0) {
      usersText = m.users.map(u=>{
        const delta=u.thisWk-u.lastWk;
        let badge='', nc='sg-user-name';
        if (u.lastWk===0&&u.thisWk>0) badge=`<span class="sg-user-badge new">new</span>`;
        else if (delta<0) { badge=`<span class="sg-user-badge down">↓${Math.abs(delta)}</span>`; nc='sg-user-name drop'; }
        else if (delta>0) badge=`<span class="sg-user-badge up">↑${delta}</span>`;
        return `<span class="${nc}">${u.name}</span> <span class="sg-user-cnt">${u.thisWk}</span>${badge}`;
      }).join('<span class="sg-bd-sep">·</span>');
    } else usersText=`<span class="sg-bd-unassigned">unassigned</span>`;
    return `<div class="sg-bd-line"><span class="sg-bd-dot" style="background:${color}"></span><span class="sg-bd-text"><span class="sg-bd-mod">${m.name}</span> <span class="sg-bd-cnt-big">${m.today}</span>${modBadge} <span class="sg-bd-em-dash">—</span> ${usersText}</span></div>`;
  }).join('');
  return `<div class="sg-breakdown">${lines}</div>`;
}

function sgBuildCollapsed(p) {
  const topInfo = p.topUserName
    ? `<b>${p.topUserName}</b> ${p.topUserCount} leading on ${p.topModuleName}`
    : `${p.modules?p.modules.length:0} modules`;
  const stoppedHint = (p.stoppedModules&&p.stoppedModules.length>0) ? ` · <span style="color:#991B1B">${p.stoppedModules.length} stopped</span>` : '';
  return `<div class="sg-collapsed-summary">${p.modules.length} modules · ${topInfo}${stoppedHint}</div>`;
}

function sgRenderCard(a) {
  const health = sgClassifyHealth(a);
  const pct = sgPctChange(a.totalToday, a.totalYest);
  const isDown = pct<0, isFlat = pct===0;
  a.moduleColors = {};
  const maxToday = Math.max(...a.projects.map(p=>p.today),1);

  const projectsHtml = a.projects.map(p=>{
    const pPctClass = p.pct>0?'up':p.pct<0?'down':'flat';
    const arrow = p.pct>0?'↑':p.pct<0?'↓':'–';
    const nameClass = p.warn?'sg-project-name warn':'sg-project-name';
    const warnPfx = p.warn?'⚠ ':'';
    let stoppedHtml='';
    if (p.stoppedModules&&p.stoppedModules.length>0) {
      const pills = p.stoppedModules.map(s=>{
        let by='';
        if (s.lastWkUsers&&s.lastWkUsers.length>0) by=' by '+s.lastWkUsers.map(u=>`<b>${u.name}</b> ${u.lastWk}`).join(', ');
        return `<span class="sg-stopped-pill">${s.name} (was ${s.lastWk}${by})</span>`;
      }).join('');
      stoppedHtml=`<div class="sg-stopped-line"><strong>⚠ Stopped this week:</strong> ${pills}</div>`;
    }
    const expanded = sgShowFull||p.significant;
    const headerHtml = `<div class="sg-project-head"><div class="${nameClass}">${warnPfx}${p.name}</div><div class="sg-project-delta"><span class="sg-delta-from">${p.yest} →</span> <strong style="color:${p.warn?'#991B1B':'#1F2937'}">${p.today}</strong><span class="sg-delta-pill ${pPctClass}">${arrow} ${Math.abs(p.pct)}%</span></div></div>`;
    if (expanded) {
      return `<div class="sg-project-row">${headerHtml}${sgBuildStackBar(p,maxToday,a.moduleColors)}${sgBuildBreakdown(p,a.moduleColors)}${stoppedHtml}</div>`;
    } else {
      return `<div class="sg-project-row">${headerHtml}${sgBuildStackBar(p,maxToday,a.moduleColors)}${sgBuildCollapsed(p)}</div>`;
    }
  }).join('');

  // Legend
  const modSet={};
  a.projects.forEach(p=>{
    (p.modules||[]).forEach(m=>{modSet[m.name]=(modSet[m.name]||0)+m.today;});
    (p.stoppedModules||[]).forEach(m=>{if(!modSet[m.name])modSet[m.name]=0;});
  });
  const legendHtml = Object.entries(modSet).sort((x,y)=>y[1]-x[1]).map(([name])=>{
    const c=sgGetColor(name,a.moduleColors);
    return `<span><span class="sg-legend-box" style="background:${c}"></span>${name}</span>`;
  }).join('');

  // Caption
  const tier = sgPickTier(pct,health);
  const pool = SG_CAPTIONS[tier];
  let caption = pool[Math.floor(Math.random()*pool.length)]
    .replace('{customer_name}',a.name.split(' ')[0])
    .replace('{today}',a.totalToday)
    .replace('{yest}',a.totalYest)
    .replace(/{pct}/g,Math.abs(pct))
    .replace('{top_user}',a.topMover?.name||'the team')
    .replace('{top_project}',a.topMover?.project||'site')
    .replace('{watch_project}',a.watchOut?.project||'')
    .replace('{watch_issue}',a.watchOut?.issue||'');
  if (a.silentProjects.length>0) caption+=` Note: ${a.silentProjects[0].name} went silent (was ${a.silentProjects[0].lastWk}).`;
  else if (a.topDrops.length>0) { const d=a.topDrops[0]; caption+=` Note: ${d.name} dropped ${Math.abs(d.delta)} on ${d.module} (${d.project}).`; }
  else if (a.stoppedModulesFlat.length>0) { const s=a.stoppedModulesFlat[0]; caption+=` Note: ${s.module} on ${s.project} stopped this week.`; }
  document.getElementById('sgCaptionText').value = caption;

  const highlightsHtml = `<div class="sg-highlights-grid">
    ${a.topMover?`<div class="sg-highlight-card good"><div class="sg-h-label">🏆 TOP MOVER</div><div class="sg-h-name">${a.topMover.name}</div><div class="sg-h-sub">${a.topMover.project} · ${a.topMover.module} ↑${a.topMover.pct}%</div></div>`:
    `<div class="sg-highlight-card warn"><div class="sg-h-label">⚠ NO MOVERS</div><div class="sg-h-name">Team silent</div><div class="sg-h-sub">No activity to highlight</div></div>`}
    ${a.watchOut?`<div class="sg-highlight-card warn"><div class="sg-h-label">⚠ WATCH OUT</div><div class="sg-h-name">${a.watchOut.project}</div><div class="sg-h-sub">${a.watchOut.issue}</div></div>`:
    `<div class="sg-highlight-card good"><div class="sg-h-label">✅ ALL GOOD</div><div class="sg-h-name">No red flags</div><div class="sg-h-sub">Team firing across projects</div></div>`}
  </div>`;

  const capIcon = health==='healthy'?'💡':health==='risk'?'⚠️':'🚨';
  document.getElementById('sgCardContainer').innerHTML = `
    <div id="sgSnapCard" class="sg-snap-card">
      <div class="sg-snap-header">
        <div class="sg-snap-brand">POWERPLAY · WEEKLY SNAP</div>
        <div class="sg-snap-acct">${a.name}</div>
        <div class="sg-snap-meta">${sgWeekRange()} · ${a.activeUsersToday} users active this week</div>
      </div>
      <div class="sg-hero-vs">
        <div class="sg-hero-grid">
          <div class="sg-hero-side"><div class="sg-hero-side-label sg-yest-label">LAST WEEK</div><div class="sg-hero-side-num sg-yest-num">${a.totalYest}</div></div>
          <div class="sg-hero-arrow ${isDown?'down':''}">→</div>
          <div class="sg-hero-side"><div class="sg-hero-side-label sg-today-label ${isDown?'down':''}">THIS WEEK</div><div class="sg-hero-side-num sg-today-num ${isDown?'down':''}">${a.totalToday}</div></div>
        </div>
        <div class="sg-hero-strip ${isDown?'down':isFlat?'flat':'up'}">${isDown?'↓':isFlat?'–':'↑'} ${Math.abs(pct)}% activity</div>
      </div>
      ${sgBuildWatchList(a)}
      <div class="sg-legend-wrap">
        <div class="sg-legend">${legendHtml}</div>
        ${projectsHtml}
      </div>
      <div class="sg-highlights">
        <div class="sg-highlights-title">THIS WEEK'S HIGHLIGHTS</div>
        ${highlightsHtml}
      </div>
      <div class="sg-caption-strip ${health}"><div class="ct">${capIcon} ${caption}</div></div>
    </div>`;

  // Size hint
  setTimeout(()=>{
    const card=document.getElementById('sgSnapCard');
    const hint=document.getElementById('sgSizeHint');
    if(!card||!hint) return;
    const h=card.scrollHeight;
    let scale=2.5;
    if(h>1800)scale=2; if(h>3000)scale=1.6; if(h>4500)scale=1.3; if(h>6000)scale=1.0;
    const outH=h*scale;
    const MAX=5500;
    if(outH<=MAX){hint.className='sg-size-hint ok';hint.style.display='inline-block';hint.textContent=`✓ 1 image (${Math.round(outH)}px)`;}
    else{const parts=Math.ceil(outH/MAX);hint.className='sg-size-hint';hint.style.display='inline-block';hint.textContent=`ℹ Will split into ${parts} images`;}
  },50);
}

function openDashboardSnap(tid, ai) {
  const sorted = window._sgSorted && window._sgSorted[tid];
  if (!sorted || !sorted[ai]) { sgShowToast('Account data not available'); return; }
  const acc = sorted[ai];
  sgCurrentAcct = transformAccForSnap(acc);
  sgShowFull = false;
  const tg = document.getElementById('sgFullDetail');
  if (tg) tg.checked = false;
  document.getElementById('sgModalTitle').textContent = acc.name;
  sgRenderCard(sgCurrentAcct);
  document.getElementById('sgModal').classList.add('show');
  document.getElementById('sgModal').scrollTop = 0;
}

function sgToggleFullDetail() {
  sgShowFull = document.getElementById('sgFullDetail').checked;
  if (sgCurrentAcct) sgRenderCard(sgCurrentAcct);
}
function closeSgModal() { document.getElementById('sgModal').classList.remove('show'); }
document.getElementById('sgModal').addEventListener('click', e=>{ if(e.target.id==='sgModal') closeSgModal(); });

function sgShowToast(msg) {
  const t=document.getElementById('sgToast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function sgCopyCaption() {
  const txt=document.getElementById('sgCaptionText').value;
  navigator.clipboard.writeText(txt).then(()=>sgShowToast('Caption copied!'));
}

function sgSaveCanvas(canvas, filename) {
  const link=document.createElement('a');
  link.download=filename; link.href=canvas.toDataURL('image/png'); link.click();
}

async function sgDownloadSnap() {
  const card=document.getElementById('sgSnapCard');
  if(!card) return;
  const safeName=sgCurrentAcct.name.replace(/[^a-zA-Z0-9]+/g,'_');
  const dateStamp=new Date().toISOString().split('T')[0];
  const FIXED_WIDTH=620;
  const orig={width:card.style.width,maxWidth:card.style.maxWidth,margin:card.style.margin};
  card.style.width=FIXED_WIDTH+'px'; card.style.maxWidth=FIXED_WIDTH+'px'; card.style.margin='0 auto';
  await new Promise(r=>requestAnimationFrame(r));
  await new Promise(r=>setTimeout(r,30));
  const cardHeight=card.scrollHeight;
  let scale=2.5;
  if(cardHeight>1800)scale=2; if(cardHeight>3000)scale=1.6; if(cardHeight>4500)scale=1.3; if(cardHeight>6000)scale=1.0;
  sgShowToast('Generating image…');
  const restore=()=>{card.style.width=orig.width;card.style.maxWidth=orig.maxWidth;card.style.margin=orig.margin;};
  let fullCanvas;
  try {
    fullCanvas=await html2canvas(card,{backgroundColor:'#ffffff',scale,useCORS:true,width:FIXED_WIDTH,windowWidth:1200,height:cardHeight,windowHeight:cardHeight+100});
  } catch(err) { console.error(err); sgShowToast('Render failed'); restore(); return; }
  restore();
  const MAX_PART=5500;
  if(fullCanvas.height<=MAX_PART){sgSaveCanvas(fullCanvas,`${safeName}_weekly_snap_${dateStamp}.png`);sgShowToast('Image downloaded');return;}
  const parts=Math.ceil(fullCanvas.height/MAX_PART);
  const partH=Math.ceil(fullCanvas.height/parts);
  for(let i=0;i<parts;i++){
    const startY=i*partH, thisH=Math.min(partH,fullCanvas.height-startY);
    const part=document.createElement('canvas');
    part.width=fullCanvas.width; part.height=thisH;
    const ctx=part.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,part.width,part.height);
    ctx.drawImage(fullCanvas,0,startY,fullCanvas.width,thisH,0,0,fullCanvas.width,thisH);
    sgSaveCanvas(part,`${safeName}_weekly_snap_${dateStamp}_part_${i+1}_of_${parts}.png`);
    await new Promise(r=>setTimeout(r,350));
  }
  sgShowToast(`Split into ${parts} parts for WhatsApp`);
}

async function sgDownloadPDF() {
  const card=document.getElementById('sgSnapCard');
  if(!card) return;
  if(!window.jspdf){sgShowToast('PDF library loading — try again');return;}
  const safeName=sgCurrentAcct.name.replace(/[^a-zA-Z0-9]+/g,'_');
  const dateStamp=new Date().toISOString().split('T')[0];
  const FIXED_WIDTH=620;
  const orig={width:card.style.width,maxWidth:card.style.maxWidth,margin:card.style.margin};
  card.style.width=FIXED_WIDTH+'px'; card.style.maxWidth=FIXED_WIDTH+'px'; card.style.margin='0 auto';
  await new Promise(r=>requestAnimationFrame(r));
  await new Promise(r=>setTimeout(r,30));
  const cardHeight=card.scrollHeight;
  let scale=2;
  if(cardHeight>4000)scale=1.5; if(cardHeight>7000)scale=1.2;
  sgShowToast('Generating PDF…');
  const restore=()=>{card.style.width=orig.width;card.style.maxWidth=orig.maxWidth;card.style.margin=orig.margin;};
  let canvas;
  try {
    canvas=await html2canvas(card,{backgroundColor:'#ffffff',scale,useCORS:true,width:FIXED_WIDTH,windowWidth:1200,height:cardHeight,windowHeight:cardHeight+100});
  } catch(err){console.error(err);sgShowToast('PDF render failed');restore();return;}
  restore();
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const pdfW=pdf.internal.pageSize.getWidth(), pdfH=pdf.internal.pageSize.getHeight();
  const margin=8, useW=pdfW-margin*2, useH=pdfH-margin*2;
  const mmToPx=canvas.width/useW, sliceHPx=Math.floor(useH*mmToPx);
  const totalPages=Math.max(1,Math.ceil(canvas.height/sliceHPx));
  for(let i=0;i<totalPages;i++){
    if(i>0)pdf.addPage();
    const startY=i*sliceHPx, thisHPx=Math.min(sliceHPx,canvas.height-startY);
    const slice=document.createElement('canvas');
    slice.width=canvas.width; slice.height=thisHPx;
    const ctx=slice.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas,0,startY,canvas.width,thisHPx,0,0,canvas.width,thisHPx);
    const imgData=slice.toDataURL('image/jpeg',0.92);
    const imgH=thisHPx/mmToPx;
    pdf.addImage(imgData,'JPEG',margin,margin,useW,imgH);
    pdf.setFontSize(8); pdf.setTextColor(150);
    pdf.text(`${sgCurrentAcct.name} · Weekly Snap · ${dateStamp} · Page ${i+1} of ${totalPages}`,pdfW/2,pdfH-4,{align:'center'});
  }
  pdf.save(`${safeName}_weekly_snap_${dateStamp}.pdf`);
  sgShowToast(`PDF saved (${totalPages} page${totalPages>1?'s':''})`);
}
</script>
