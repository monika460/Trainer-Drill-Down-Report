<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trainer DrillDown — Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;font-size:13px}
.header{background:linear-gradient(135deg,#1a1f2e,#16213e);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2d3748;position:sticky;top:0;z-index:300}
.header h1{font-size:17px;font-weight:700;color:#fff}
.header-sub{font-size:11px;color:#718096;margin-top:2px}
.sync-bar{display:flex;align-items:center;gap:14px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#48bb78;animation:pulse 1.5s infinite}
.sync-dot.error{background:#fc5353;animation:none}
.sync-dot.loading{background:#ecc94b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-label{font-size:11px;color:#718096}
.countdown{font-size:11px;color:#4299e1;font-weight:600;width:20px;text-align:right}
.last-sync{font-size:10px;color:#4a5568}
.gstats{display:flex;gap:16px}
.gs{text-align:center}.gs .v{font-size:18px;font-weight:700}.gs .l{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.4px}
.tabs{display:flex;background:#1a1f2e;border-bottom:2px solid #2d3748;padding:0 24px;position:sticky;top:57px;z-index:200;overflow-x:auto}
.tab{padding:11px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#718096;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:#e2e8f0}.tab.active{color:#fff;border-bottom-color:#4299e1}
.tab .cnt{background:#2d3748;border-radius:10px;padding:1px 7px;font-size:11px;color:#a0aec0}
.tab.active .cnt{background:#4299e1;color:#fff}
.controls{padding:10px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #1a2033;background:#12161f;position:sticky;top:103px;z-index:190}
.pf-btn{padding:4px 11px;border-radius:20px;border:1px solid #2d3748;background:transparent;color:#a0aec0;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pf-btn:hover{color:#fff;border-color:#4a5568}
.pf-btn.active[data-p="ALL"]{background:#4299e1;border-color:#4299e1;color:#fff}
.pf-btn.active[data-p="CRITICAL"]{background:#fc5353;border-color:#fc5353;color:#fff}
.pf-btn.active[data-p="HIGH"]{background:#ed8936;border-color:#ed8936;color:#fff}
.pf-btn.active[data-p="MEDIUM"]{background:#ecc94b;border-color:#ecc94b;color:#1a1a1a}
.pf-btn.active[data-p="LOW"]{background:#4299e1;border-color:#4299e1;color:#fff}
.pf-btn.active[data-p="STABLE_DROP"]{background:#ff6b6b;border-color:#ff6b6b;color:#fff}
.pf-btn.active[data-p="STABLE"]{background:#48bb78;border-color:#48bb78;color:#1a1a1a}
.pf-btn.active[data-p="INACTIVE"]{background:#718096;border-color:#718096;color:#fff}
.search-wrap{margin-left:auto;position:relative}
.search-wrap::before{content:"\1F50D";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.search-wrap input{background:#1a1f2e;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:5px 10px 5px 28px;font-size:12px;width:200px;outline:none}
.search-wrap input:focus{border-color:#4299e1}
.sumcards{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px 24px;background:#12161f;border-bottom:1px solid #1a2033}
.sc{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:8px 12px;text-align:center}
.sc .sv{font-size:20px;font-weight:700}.sc .sl{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.sc.crit{border-color:#fc5353;background:#1e0c0c}.sc.crit .sv{color:#fc5353}
.sc.high{border-color:#ed8936;background:#1e1208}.sc.high .sv{color:#ed8936}
.sc.med{border-color:#ecc94b;background:#1c1900}.sc.med .sv{color:#ecc94b}
.sc.low{border-color:#4299e1;background:#0a1420}.sc.low .sv{color:#4299e1}
.sc.stbdrop{border-color:#ff6b6b;background:#1e0a0a}.sc.stbdrop .sv{color:#ff6b6b}
.sc.stb{border-color:#48bb78;background:#0a1e12}.sc.stb .sv{color:#48bb78}
.sc.inact .sv{color:#718096}
.tree-wrap{overflow-x:auto}
.tree-table{width:100%;border-collapse:collapse;min-width:900px}
.tree-table th{padding:8px 10px;text-align:left;color:#4a5568;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1a2033;background:#10141c;white-space:nowrap}
.tree-table th.r{text-align:right}
.row-section td{background:#0d1218;color:#3a5070;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;padding:6px 12px;border-bottom:1px solid #1a2033}
.row-section.sd td{background:#1e0c0c;color:#ff6b6b;border-left:3px solid #ff6b6b}
.row-account{border-bottom:1px solid #1e2535;cursor:pointer;transition:background .1s}
.row-account:hover{background:#1a2030}
.row-account td{padding:8px 10px;vertical-align:middle}
.row-account.hidden{display:none}
.tog{border:none;border-radius:3px;color:#a0aec0;cursor:pointer;font-size:10px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.acc-tog{width:18px;height:18px;background:#252d3d;margin-right:5px}.acc-tog:hover{background:#4299e1;color:#fff}
.acc-name{font-weight:600;color:#e2e8f0}
.acc-sub{font-size:10px;color:#4a5568;margin-left:5px}
.snap-row-btn{background:#4299e1;color:#fff;border:none;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background .15s}
.snap-row-btn:hover{background:#2b6cb0}
.row-project{display:none;border-bottom:1px solid #161d2a;cursor:pointer;transition:background .1s}
.row-project:hover{background:#161d28}.row-project.vis{display:table-row}
.row-project td{padding:6px 10px 6px 32px;vertical-align:middle;background:#0f1420}
.row-project.sdp td{background:#1a0c0c}.row-project.sdp:hover td{background:#200e0e}
.proj-tog{width:16px;height:16px;background:#1e2535;margin-right:4px}.proj-tog:hover{background:#2d6a9f;color:#fff}
.proj-name{color:#c0cfe0;font-size:12px}
.bdrop{background:#2d0f0f;color:#fc5353;border:1px solid #fc535355;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:600}
.bstable{background:#0d2018;color:#48bb78;border:1px solid #48bb7855;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px}
.bstabledrop{background:#2d0f0f;color:#ff6b6b;border:1px solid #ff6b6b;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:700}
.row-module{display:none;border-bottom:1px solid #131822}.row-module.vis{display:table-row}
.row-module td{padding:5px 10px 5px 56px;vertical-align:middle;background:#0b1018}
.mod-tog{width:14px;height:14px;background:#1a2030;margin-right:4px}.mod-tog:hover{background:#1a3a5a;color:#fff}
.mod-name{color:#7a9ab0;font-size:11px}
.row-event{display:none;border-bottom:1px solid #10151f}.row-event.vis{display:table-row}
.row-event td{padding:5px 10px 5px 78px;vertical-align:middle;background:#080c14}
.evt-name{color:#5a7090;font-size:11px;font-family:monospace}
.ubox{margin-top:3px;display:inline-flex;align-items:center;gap:8px;background:#0f1828;border:1px solid #1e3050;border-radius:5px;padding:3px 8px}
.uname{color:#7eb8e0;font-size:12px;font-weight:600}
.uphone{color:#4a9edd;font-size:12px;font-weight:700;letter-spacing:.4px}
.pb{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.pb.CRITICAL{background:#2d0f0f;color:#fc5353;border:1px solid #fc5353}
.pb.HIGH{background:#2d1a0a;color:#ed8936;border:1px solid #ed8936}
.pb.MEDIUM{background:#2d2800;color:#ecc94b;border:1px solid #ecc94b}
.pb.LOW{background:#0a1a2d;color:#4299e1;border:1px solid #4299e1}
.pb.STABLE{background:#0d2d18;color:#48bb78;border:1px solid #48bb78}
.pb.STABLE_DROP{background:#2d0f0f;color:#ff6b6b;border:1px solid #ff6b6b}
.pb.INACTIVE{background:#1a1a1a;color:#718096;border:1px solid #718096}
.nr{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.neg{color:#fc5353}.pos{color:#48bb78}.neu{color:#4a5568}.zred{color:#fc535355}
.sm{font-size:11px}
.trend{display:flex;align-items:flex-end;gap:2px;height:18px;min-width:40px}
.tbar{flex:1;border-radius:1px 1px 0 0;min-height:2px;min-width:5px}
.overlay{position:fixed;inset:0;background:#0f1117ee;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.spinner{width:40px;height:40px;border:3px solid #2d3748;border-top-color:#4299e1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:#1e0c0c;border:1px solid #fc5353;border-radius:10px;padding:20px 28px;max-width:480px;text-align:center}
.err-box h3{color:#fc5353;margin-bottom:8px}
.err-box p{color:#a0aec0;font-size:12px;line-height:1.6}
.panel{display:none}.panel.active{display:block}
.last-disp{font-size:10px;color:#4a6080;white-space:nowrap}
.dispo{font-size:10px;color:#556070;font-style:italic;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snap-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:flex-start;justify-content:center;z-index:1000;padding:30px 20px;overflow-y:auto}
.snap-modal-bg.show{display:flex}
.snap-modal{background:#fff;color:#1F2937;border-radius:16px;padding:24px;max-width:680px;width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.snap-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.snap-modal-head h2{font-size:17px;font-weight:600;color:#1F2937}
.snap-close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:#6B7280;line-height:1}
.snap-card{background:#fff;border-radius:16px;padding:22px;max-width:580px;margin:0 auto;border:0.5px solid #E5E7EB}
.snap-header{text-align:center;padding-bottom:14px;border-bottom:0.5px solid #ECECE6}
.snap-brand{font-size:11px;color:#2563EB;letter-spacing:1.5px;font-weight:600}
.snap-acct{font-size:18px;font-weight:600;margin-top:6px;color:#1F2937}
.snap-meta{font-size:12px;color:#6B6B68;margin-top:2px}
.hero-vs{padding:18px 0 16px}
.hero-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.hero-side{text-align:center}
.hero-side-label{font-size:11px;letter-spacing:0.5px;font-weight:500}
.hero-side-num{font-size:44px;font-weight:700;line-height:1.1}
.yest-label{color:#6B7280}.yest-num{color:#6B7280}
.today-label{color:#16A34A;font-weight:600}.today-num{color:#16A34A}
.today-label.down{color:#DC2626}.today-num.down{color:#DC2626}
.hero-arrow{font-size:32px;color:#16A34A}
.hero-arrow.down{color:#DC2626}
.hero-strip{margin-top:12px;padding:8px;border-radius:8px;text-align:center;font-size:13px;font-weight:600}
.hero-strip.up{background:#DCFCE7;color:#14532D}
.hero-strip.down{background:#FEE2E2;color:#7F1D1D}
.hero-strip.flat{background:#F3F4F6;color:#374151}
.watchlist{margin:14px 0 4px;padding:12px 14px;border-radius:10px;border-left:3px solid #F59E0B;background:#FEF3C7}
.watchlist.danger{border-left-color:#DC2626;background:#FEE2E2}
.watchlist.clear{border-left-color:#16A34A;background:#DCFCE7}
.wl-title{font-size:11px;font-weight:700;color:#7C2D12;letter-spacing:0.6px;margin-bottom:6px}
.watchlist.danger .wl-title{color:#7F1D1D}
.watchlist.clear .wl-title{color:#14532D}
.wl-item{font-size:12px;line-height:1.6;color:#1F2937}
.wl-item+.wl-item{margin-top:2px}
.wl-item b{font-weight:700}
.wl-item .lbl{font-weight:700;color:#7C2D12;margin-right:4px}
.watchlist.danger .wl-item .lbl{color:#7F1D1D}
.collapsed-summary{font-size:11.5px;color:#4B5563;margin-top:6px;line-height:1.5}
.collapsed-summary b{color:#1F2937;font-weight:600}
.collapsed-summary .cs-mod{color:#4B5563}
.detail-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#4B5563;cursor:pointer;padding:6px 10px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:999px;margin-bottom:14px;user-select:none}
.detail-toggle input{margin:0;cursor:pointer}
.size-hint{display:inline-block;margin-left:10px;font-size:11px;color:#92400E;background:#FEF3C7;padding:4px 10px;border-radius:999px}
.size-hint.ok{color:#14532D;background:#DCFCE7}
.legend-wrap{padding-top:14px;border-top:0.5px solid #ECECE6}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:14px;font-size:11px;color:#1F2937}
.legend-box{display:inline-block;width:12px;height:9px;border-radius:3px;vertical-align:middle;margin-right:5px}
.project-row{margin-bottom:14px;padding-bottom:12px;border-bottom:0.5px dashed #ECECE6}
.project-row:last-child{border-bottom:none;padding-bottom:0}
.project-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.project-name{font-size:13px;font-weight:600;color:#1F2937}
.project-name.warn{color:#991B1B}
.project-delta{font-size:12px}
.delta-from{color:#6B7280}
.delta-pill{font-weight:700;padding:2px 8px;border-radius:999px;font-size:11px;margin-left:4px}
.delta-pill.up{background:#DCFCE7;color:#14532D}
.delta-pill.down{background:#FEE2E2;color:#991B1B}
.delta-pill.flat{background:#F3F4F6;color:#4B5563}
.stack-bar{display:flex;height:22px;border-radius:6px;overflow:hidden}
.stopped-line{font-size:10px;color:#991B1B;margin-top:6px;line-height:1.4}
.stopped-line strong{font-weight:600}
.stopped-pill{display:inline-block;background:#FEE2E2;color:#991B1B;padding:1px 7px;border-radius:999px;margin-right:4px;margin-top:2px;font-weight:500}
.breakdown{margin-top:8px;font-size:11.5px;line-height:1.65;display:grid;gap:4px}
.bd-line{display:grid;grid-template-columns:10px 1fr;gap:7px;align-items:baseline}
.bd-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-top:4px}
.bd-text{color:#1F2937}
.bd-mod{font-weight:700;color:#111827}
.bd-cnt-big{font-weight:700;color:#111827;font-variant-numeric:tabular-nums;margin-left:2px}
.bd-em-dash{color:#D1D5DB;margin:0 2px}
.bd-sep{color:#D1D5DB;margin:0 5px}
.user-name{color:#1F2937;font-weight:500}
.user-name.drop{color:#991B1B;font-weight:700}
.user-cnt{color:#111827;font-weight:700;font-variant-numeric:tabular-nums;margin-left:2px}
.user-badge{font-size:9.5px;padding:1px 5px;border-radius:999px;font-weight:700;margin-left:3px;vertical-align:1px}
.user-badge.up{background:#DCFCE7;color:#15803D}
.user-badge.down{background:#FEE2E2;color:#991B1B}
.user-badge.new{background:#DBEAFE;color:#1D4ED8}
.mod-badge{font-size:10px;padding:1px 6px;border-radius:999px;font-weight:700;margin-left:5px;vertical-align:1px}
.mod-badge.up{background:#DCFCE7;color:#15803D}
.mod-badge.down{background:#FEE2E2;color:#991B1B}
.mod-badge.new{background:#DBEAFE;color:#1D4ED8}
.bd-unassigned{color:#9CA3AF;font-style:italic}
.mod-seg{display:flex;border-right:2px solid #fff;min-width:0;overflow:hidden}
.mod-seg:last-child{border-right:none}
.user-cell{text-align:center;line-height:28px;color:#fff;font-size:10px;font-weight:600;border-right:1px solid rgba(255,255,255,0.4);min-width:0;overflow:hidden;white-space:nowrap;padding:0 4px;text-overflow:clip}
.user-cell:last-child{border-right:none}
.highlights{margin-top:16px;padding-top:14px;border-top:0.5px solid #ECECE6}
.highlights-title{font-size:11px;font-weight:600;color:#6B6B68;letter-spacing:1px;margin-bottom:10px}
.highlights-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.highlight-card{border-radius:10px;padding:10px 12px}
.highlight-card.good{background:#DCFCE7}
.highlight-card.warn{background:#FEF2F2}
.h-label{font-size:10px;font-weight:700;letter-spacing:0.5px}
.highlight-card.good .h-label{color:#15803D}
.highlight-card.warn .h-label{color:#991B1B}
.h-name{font-size:14px;font-weight:700;margin-top:4px}
.highlight-card.good .h-name{color:#14532D}
.highlight-card.warn .h-name{color:#7F1D1D}
.h-sub{font-size:11px}
.highlight-card.good .h-sub{color:#15803D}
.highlight-card.warn .h-sub{color:#991B1B}
.caption-strip{margin-top:14px;padding:12px 14px;border-radius:0 8px 8px 0}
.caption-strip.healthy{background:#DCFCE7;border-left:3px solid #16A34A;color:#14532D}
.caption-strip.risk{background:#FEF3C7;border-left:3px solid #F59E0B;color:#78350F}
.caption-strip.declining{background:#FEE2E2;border-left:3px solid #DC2626;color:#7F1D1D}
.caption-strip .ct{font-size:13px;line-height:1.5}
.caption-editor{margin-top:16px;padding:12px 14px;border:1px dashed #B5B5AE;border-radius:10px;background:#FAFAF7}
.caption-editor-label{font-size:11px;font-weight:600;color:#4B5563;margin-bottom:6px;letter-spacing:0.4px}
.caption-textarea{width:100%;border:none;background:transparent;resize:vertical;min-height:60px;font-family:inherit;font-size:13px;line-height:1.6;outline:none;color:#1F2937}
.snap-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.snap-btn-action{flex:1;min-width:140px;padding:12px 8px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.snap-btn-primary{background:#2563EB;color:#fff}
.snap-btn-primary:hover{background:#1D4ED8}
.snap-btn-secondary{background:#fff;color:#1F2937;border:1px solid #E5E7EB}
.snap-btn-secondary:hover{background:#F9FAFB}
.snap-btn-action svg{width:16px;height:16px}
.snap-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity 0.2s;z-index:2000}
.snap-toast.show{opacity:1}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div style="color:#718096;font-size:13px">Connecting to Redash...</div>
</div>
<div class="header">
  <div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:22px">&#128202;</span>
      <div>
        <h1>Trainer DrillDown &mdash; Live Dashboard</h1>
        <div class="header-sub">Auto-syncing via Vercel &middot; Query #1468 &middot; Account &rarr; Project &rarr; Module &rarr; Event &rarr; User &middot; &#128248; Snap per account</div>
      </div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:20px">
    <div class="sync-bar">
      <div class="sync-dot" id="sync-dot"></div>
      <span class="sync-label">Next sync in</span>
      <span class="countdown" id="countdown">5</span>
      <span class="sync-label">s</span>
    </div>
    <div class="last-sync" id="last-sync">Never synced</div>
    <div class="gstats" id="gstats"></div>
  </div>
</div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<div class="snap-modal-bg" id="snapModal">
  <div class="snap-modal">
    <div class="snap-modal-head">
      <h2>&#128248; Snap preview &middot; Weekly Activity</h2>
      <button class="snap-close-btn" onclick="closeSnapModal()">&times;</button>
    </div>
    <div style="display:flex;align-items:center;flex-wrap:wrap">
      <label class="detail-toggle"><input type="checkbox" id="fullDetailToggle" onchange="toggleFullDetail()" /> Show all projects in full detail</label>
      <span id="sizeHint" class="size-hint" style="display:none"></span>
    </div>

<script>
const REDASH_URL  = "https://redashv3.getpowerplay.in";
const API_KEY     = "yxqnSo7sT97kxbSPTFKDI0OvjRnMGroE1NGyySTc";
const QUERY_ID    = "1468";
const PARAMS      = {"p_renewal_start": "2026-04-01", "p_renewal_end": "2030-04-30"};
const REFRESH_SEC = 5;
function detectCols(columns) {
  const names = columns.map(c => c.name.toLowerCase());
  const find = (...opts) => {
    for (const o of opts) {
      const i = names.findIndex(n => n === o || n.includes(o));
      if (i >= 0) return columns[i].name;
    }
    return null;
  };
  return {
    trainer    : find('trainer_email','trainer','trainer_name'),
    org        : find('org_name','organisation_name','organization_name','account_name','org'),
    project    : find('project_name','project'),
    module     : find('module_name','module'),
    event      : find('event_name','event','event_type'),
    user       : find('user_name','username','user'),
    mobile     : find('mobile_number','mobile','phone','phone_number'),
    renewal    : find('renewal_date','renewal'),
    last_disp  : find('last_disposition_date','last_disposition','last_disp'),
    disposition: find('disposition','notes'),
    wk0        : find('wk_0','wk0','week_0'),
    wk1        : find('wk_1','wk1','week_1'),
    wk2        : find('wk_2','wk2','week_2'),
    wk3        : find('wk_3','wk3','week_3'),
    active_w0  : find('acct_active_w0','active_w0'),
    cold_pool  : find('acct_cold_pool','cold_pool'),
    new_drops  : find('acct_new_drops_w0','new_drops_w0'),
    connected  : find('acct_connected_w0','connected_w0'),
    coverage   : find('acct_coverage_pct','coverage_pct')
  };
}
const TRAINER_NAMES = {'digvijay':'Digvijay','farid':'S Farid','sfarid':'S Farid','s farid':'S Farid','divya':'Divya'};
function trainerDisplay(email) {
  if (!email) return email;
  const low = email.toLowerCase();
  const prefix = low.split('@')[0];
  for (const [k,v] of Object.entries(TRAINER_NAMES)) {
    if (prefix.includes(k) || low.includes(k)) return v;
  }
  return email.split('@')[0];
}
function processRows(rows, cols) {
  const trainers = {};
  rows.forEach(row => {
    const trainer  = trainerDisplay(row[cols.trainer] || '');
    const org      = row[cols.org]     || 'Unknown';
    const project  = row[cols.project] || 'Unknown';
    const module   = row[cols.module]  || 'Unknown';
    const event    = row[cols.event]   || '';
    const user     = row[cols.user]    || '';
    const mobile   = row[cols.mobile]  || '';
    const renewal  = row[cols.renewal] || '';
    const lastDisp = row[cols.last_disp] || '';
    const dispo    = row[cols.disposition] || '';
    const wk0 = parseInt(row[cols.wk0] || 0);
    const wk1 = parseInt(row[cols.wk1] || 0);
    const wk2 = parseInt(row[cols.wk2] || 0);
    const wk3 = parseInt(row[cols.wk3] || 0);
    const activeW0  = cols.active_w0  ? parseInt(row[cols.active_w0]  || 0) : 0;
    const coldPool  = cols.cold_pool  ? parseInt(row[cols.cold_pool]  || 0) : 0;
    const newDrops  = cols.new_drops  ? parseInt(row[cols.new_drops]  || 0) : 0;
    const connected = cols.connected  ? parseInt(row[cols.connected]  || 0) : 0;
    const coverage  = cols.coverage && row[cols.coverage] != null ? Number(row[cols.coverage]) : null;
    if (!trainers[trainer]) trainers[trainer] = {};
    const tMap = trainers[trainer];
    if (!tMap[org]) tMap[org] = { renewal, projects: {}, activeW0, coldPool, newDrops, connected, coverage };
    const orgObj = tMap[org];
    if (!orgObj.projects[project]) orgObj.projects[project] = { modules: {} };
    const projObj = orgObj.projects[project];
    if (!projObj.modules[module]) projObj.modules[module] = { events: [] };
    const modObj = projObj.modules[module];
    modObj.events.push({ event, user, mobile, wk0, wk1, wk2, wk3, lastDisp, dispo });
  });
  const result = {};
  Object.entries(trainers).forEach(([tName, tMap]) => {
    const accounts = [];
    Object.entries(tMap).forEach(([orgName, orgData], ai) => {
      const projects = [];
      let accWk0=0, accWk1=0, accWk2=0, accWk3=0;
      Object.entries(orgData.projects).forEach(([projName, projData]) => {
        const modules = [];
        let pWk0=0, pWk1=0, pWk2=0, pWk3=0;
        Object.entries(projData.modules).forEach(([modName, modData]) => {
          let mWk0=0, mWk1=0, mWk2=0, mWk3=0;
          const events = modData.events.map(e => {
            mWk0+=e.wk0; mWk1+=e.wk1; mWk2+=e.wk2; mWk3+=e.wk3;
            return e;
          });
          const mDiff = mWk0 - mWk1;
          const mPct  = mWk1 > 0 ? ((mDiff/mWk1)*100).toFixed(1)+'%' : '';
          pWk0+=mWk0; pWk1+=mWk1; pWk2+=mWk2; pWk3+=mWk3;
          modules.push({ name:modName, wk0:mWk0, wk1:mWk1, wk2:mWk2, wk3:mWk3, diff:mDiff, pct:mPct, events });
        });
        const pDiff = pWk0 - pWk1;
        const pPct  = pWk1 > 0 ? ((pDiff/pWk1)*100).toFixed(1)+'%' : '';
        const isDrop = pWk0 < pWk1;
        accWk0+=pWk0; accWk1+=pWk1; accWk2+=pWk2; accWk3+=pWk3;
        projects.push({ name:projName, wk0:pWk0, wk1:pWk1, wk2:pWk2, wk3:pWk3, diff:pDiff, pct:pPct, isDrop, modules });
      });
      const diff = accWk0 - accWk1;
      const pct  = accWk1 > 0 ? (diff/accWk1)*100 : 0;
      const pctStr = accWk1 > 0 ? pct.toFixed(1)+'%' : '';
      let priority;
      if (accWk0 === 0 && accWk1 > 0) priority = 'CRITICAL';
      else if (pct <= -75)             priority = 'HIGH';
      else if (pct <= -25)             priority = 'MEDIUM';
      else if (pct < 0)                priority = 'LOW';
      else if (accWk0 === 0)           priority = 'INACTIVE';
      else                             priority = 'STABLE';
      const effP = (priority === 'STABLE' && accWk0 === 0) ? 'STABLE_DROP' : priority;
      accounts.push({
        num: ai+1, name:orgName, renewal:orgData.renewal, trainer: tName,
        wk0:accWk0, wk1:accWk1, wk2:accWk2, wk3:accWk3,
        diff, pct:pctStr, priority: effP, projects,
        activeW0: orgData.activeW0,
        coldPool: orgData.coldPool,
        newDrops: orgData.newDrops,
        connected: orgData.connected,
        coverage: orgData.coverage
      });
    });
    result[tName] = { accounts };
  });
  return result;
}
const PRIO_ORDER = ['CRITICAL','HIGH','MEDIUM','LOW','STABLE_DROP','STABLE','INACTIVE'];
function pb(p){ return '<span class="pb '+p+'">'+p.replace('_',' ')+'</span>'; }
function coveragePill(pct){
  if (pct == null || isNaN(pct)) return '<span style="color:#4a5568">—</span>';
  const p = Math.round(Number(pct));
  if (p < 30)  return '<span class="pb" style="background:#2d0f0f;color:#fc5353;border:1px solid #fc5353">'+p+'%</span>';
  if (p < 60)  return '<span class="pb" style="background:#2d1a0a;color:#ed8936;border:1px solid #ed8936">'+p+'%</span>';
  return '<span class="pb" style="background:#0d2d18;color:#48bb78;border:1px solid #48bb78">'+p+'%</span>';
}
function trend(w0,w1,w2,w3){
  const v=[w3,w2,w1,w0], mx=Math.max.apply(null,v.concat([1]));
  const c=['#3a4a5a','#4a5a6a','#8899aa',w0===0?'#fc5353':(w0>=w1?'#48bb78':'#ed8936')];
  return '<div class="trend">'+v.map(function(n,i){return '<div class="tbar" style="height:'+Math.max(2,Math.round(n/mx*18))+'px;background:'+c[i]+'"></div>';}).join('')+'</div>';
}
function nTD(v, zr){
  if(v===null||v===undefined) return '<td class="nr neu">—</td>';
  return '<td class="nr '+(zr&&v===0?'zred':'')+'">'+v+'</td>';
}
function dTD(v){
  if(!v&&v!==0) return '<td class="nr neu">—</td>';
  return '<td class="nr '+(v<0?'neg':v>0?'pos':'neu')+'">'+(v>0?'+':'')+v+'</td>';
}
function pTD(v){
  if(!v) return '<td class="nr neu sm">—</td>';
  return '<td class="nr '+(v.charAt(0)==='-'?'neg':'pos')+' sm">'+v+'</td>';
}
const ACCOUNT_REGISTRY = {};

        (acc.renewal?'<span style="font-size:10px;color:#4a5568;margin-left:5px">'+acc.renewal+'</span>':'')+'</td>'+

let countdown = REFRESH_SEC;
let currentTab = null;
let initialized = false;
async function fetchAndRender() {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot loading';
  try {
    const paramStr = Object.entries(PARAMS).map(function(e){return e[0]+'='+encodeURIComponent(e[1]);}).join('&');
    const url = '/api/redash?'+paramStr;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP '+res.status+': '+res.statusText);
    const json = await res.json();
    const qr = json.query_result || json;
    const data = qr.data || qr;
    const columns = data.columns || [];
    const rows    = data.rows    || [];
    if (!columns.length) throw new Error('No columns returned from Redash');
    const cols = detectCols(columns);
    const trainers = processRows(rows, cols);
    if (!initialized) {
      buildUI(trainers);
      initialized = true;
      document.getElementById('overlay').style.display = 'none';
    } else {
      updateUI(trainers);
    }
    dot.className = 'sync-dot';
    document.getElementById('last-sync').textContent = 'Last synced: ' + new Date().toLocaleTimeString();
  } catch (err) {
    dot.className = 'sync-dot error';
    if (!initialized) showError(err);
    console.error('Redash fetch error:', err);
  }
  countdown = REFRESH_SEC;
}
function showError(err) {
  document.getElementById('overlay').innerHTML =
    '<div class="err-box">'+
      '<h3>Cannot connect to Redash</h3>'+
      '<p>'+err.message+'</p>'+
      '<p style="margin-top:10px">This usually means <strong>CORS is blocked</strong>.</p>'+
    '</div>';
}
function buildUI(trainers) {
  const tabs = document.getElementById('tabs');
  const app  = document.getElementById('app');
  tabs.innerHTML = ''; app.innerHTML = '';
  currentTab = null;
  for (const k in ACCOUNT_REGISTRY) delete ACCOUNT_REGISTRY[k];
  Object.entries(trainers).forEach(function(entry, i) {
    const tName = entry[0], tData = entry[1];
    const tid = tName.replace(/[^a-z0-9]/gi,'_');
    const crit = tData.accounts.filter(function(a){return a.priority==='CRITICAL';}).length;
    const high = tData.accounts.filter(function(a){return a.priority==='HIGH';}).length;
    const sd   = tData.accounts.filter(function(a){return a.priority==='STABLE_DROP';}).length;
    const urg  = crit>0?'<span style="color:#fc5353;font-weight:700"> '+crit+'</span>':high>0?'<span style="color:#ed8936"> '+high+'</span>':'';
    const sdBadge = sd>0?'<span style="color:#ff6b6b;font-size:10px"> '+sd+'</span>':'';
    const tab = document.createElement('div');
    tab.className = 'tab' + (i===0?' active':'');
    tab.dataset.tid = tid;
    tab.innerHTML = tName+' <span class="cnt">'+tData.accounts.length+'</span>'+urg+sdBadge;
    tab.addEventListener('click', function(){ switchTab(tid); });
    tabs.appendChild(tab);
    const panel = document.createElement('div');
    panel.className = 'panel' + (i===0?' active':'');
    panel.id = 'panel-' + tid;
    panel.innerHTML = renderPanel(tName, tData, tid);
    app.appendChild(panel);
    if (i===0) currentTab = tid;
  });
  updateGlobalStats(trainers);
}
function updateUI(trainers) {
  const prevTab = currentTab;
  buildUI(trainers);
  if (prevTab) {
    const el = document.querySelector('[data-tid="'+prevTab+'"]');
    if (el) { switchTab(prevTab); }
  }
}
function updateGlobalStats(trainers) {
  const gc={};
  Object.values(trainers).forEach(function(t){t.accounts.forEach(function(a){gc[a.priority]=(gc[a.priority]||0)+1;});});
  const total = Object.values(gc).reduce(function(s,v){return s+v;},0);
  document.getElementById('gstats').innerHTML =
    '<div class="gs"><div class="v" style="color:#fc5353">'+(gc.CRITICAL||0)+'</div><div class="l">Critical</div></div>'+
    '<div class="gs"><div class="v" style="color:#ed8936">'+(gc.HIGH||0)+'</div><div class="l">High</div></div>'+
    '<div class="gs"><div class="v" style="color:#ff6b6b">'+(gc.STABLE_DROP||0)+'</div><div class="l">Stable Drop</div></div>'+
    '<div class="gs"><div class="v" style="color:#48bb78">'+(gc.STABLE||0)+'</div><div class="l">Stable</div></div>'+
    '<div class="gs"><div class="v" style="color:#a0aec0">'+total+'</div><div class="l">Total</div></div>';
}
function switchTab(tid) {
  currentTab = tid;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tid===tid);});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-'+tid);});
}
function toggleAcc(aId,e) {
  e.stopPropagation();
  const btn=document.getElementById('btn-'+aId);
  if(!btn||btn.textContent==='.') return;
  const open=btn.textContent==='+'; btn.textContent=open?'-':'+';
  document.querySelectorAll('[data-acc="'+aId+'"]').forEach(function(r){
    r.classList.toggle('vis',open);
    if(!open){const pb=r.querySelector('.proj-tog');if(pb&&pb.textContent!=='.')pb.textContent='+';}
  });
  if(!open){
    document.querySelectorAll('[data-acc="'+aId+'"]').forEach(function(r){
      const pid=r.id&&r.id.replace('proj-','');
      if(pid){
        document.querySelectorAll('[data-proj="'+pid+'"]').forEach(function(m){
          m.classList.remove('vis');
          const mb=m.querySelector('.mod-tog');if(mb&&mb.textContent!=='.')mb.textContent='+';
          const mid=m.id&&m.id.replace('mod-','');
          if(mid) document.querySelectorAll('[data-mod="'+mid+'"]').forEach(function(ev){ev.classList.remove('vis');});
        });
      }
    });
  }
}

}

document.addEventListener('click',function(e){
  if(!e.target.classList.contains('pf-btn')) return;
  const tid=e.target.dataset.t, prio=e.target.dataset.p;
  const panel=document.getElementById('panel-'+tid);
  panel.querySelectorAll('.pf-btn').forEach(function(b){b.classList.remove('active');});
  e.target.classList.add('active');
  panel.querySelectorAll('.acc-tog').forEach(function(b){if(b.textContent!=='.')b.textContent='+';});
  panel.querySelectorAll('.row-project,.row-module,.row-event').forEach(function(r){r.classList.remove('vis');});
  panel.querySelectorAll('.row-account').forEach(function(r){r.classList.toggle('hidden',prio!=='ALL'&&r.dataset.p!==prio);});
  panel.querySelectorAll('.row-section').forEach(function(s){s.style.display=prio==='ALL'||s.dataset.sect===prio?'':'none';});
});
document.addEventListener('input',function(e){
  if(!e.target.classList.contains('acc-search')) return;
  const tid=e.target.dataset.t, q=e.target.value.toLowerCase();
  document.getElementById('panel-'+tid).querySelectorAll('.row-account').forEach(function(r){r.classList.toggle('hidden',!!q&&r.dataset.name.indexOf(q)===-1);});
});
setInterval(function() {
  countdown--;
  document.getElementById('countdown').textContent = Math.max(0, countdown);
  if (countdown <= 0) fetchAndRender();
}, 1000);
function openSnap(aId) {
  const acc = ACCOUNT_REGISTRY[aId];
  if (!acc) { showSnapToast('Account not found'); return; }
  showSnapToast('Snap for: '+acc.name);
}
function closeSnapModal() {
  document.getElementById('snapModal').classList.remove('show');
}
function toggleFullDetail(){}
function copyCaption(){
  const txt = document.getElementById('captionText').value;
  navigator.clipboard.writeText(txt).then(function(){showSnapToast('Copied');});
}
function downloadSnapPNG(){ showSnapToast('PNG export — wire in snap module'); }
function downloadSnapPDF(){ showSnapToast('PDF export — wire in snap module'); }
function showSnapToast(msg) {
  const t = document.getElementById('snapToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');}, 1800);
}
document.getElementById('snapModal').addEventListener('click', function(e) {
  if (e.target.id === 'snapModal') closeSnapModal();
});
fetchAndRender();
</script>
