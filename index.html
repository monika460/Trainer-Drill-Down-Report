<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer DrillDown — Live Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;font-size:13px}

/* ── Header ── */
.header{background:linear-gradient(135deg,#1a1f2e,#16213e);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2d3748;position:sticky;top:0;z-index:300;flex-wrap:wrap;gap:10px}
.header h1{font-size:17px;font-weight:700;color:#fff}
.header-sub{font-size:11px;color:#718096;margin-top:2px}
.sync-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#48bb78;animation:pulse 1.5s infinite;flex-shrink:0}
.sync-dot.error{background:#fc5353;animation:none}
.sync-dot.loading{background:#ecc94b;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-label{font-size:11px;color:#718096}
.countdown{font-size:13px;color:#4299e1;font-weight:700;min-width:18px;text-align:right}
.last-sync{font-size:10px;color:#4a5568}
.gstats{display:flex;gap:14px;flex-wrap:wrap}
.gs{text-align:center}.gs .v{font-size:16px;font-weight:700}.gs .l{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.4px}

/* ── Tabs ── */
.tabs{display:flex;background:#1a1f2e;border-bottom:2px solid #2d3748;padding:0 24px;position:sticky;top:57px;z-index:200;overflow-x:auto}
.tab{padding:11px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#718096;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:#e2e8f0}.tab.active{color:#fff;border-bottom-color:#4299e1}
.tab .cnt{background:#2d3748;border-radius:10px;padding:1px 7px;font-size:11px;color:#a0aec0}
.tab.active .cnt{background:#4299e1;color:#fff}

/* ── Controls ── */
.controls{padding:10px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #1a2033;background:#12161f;position:sticky;top:103px;z-index:190}
.pf-btn{padding:4px 11px;border-radius:20px;border:1px solid #2d3748;background:transparent;color:#a0aec0;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pf-btn:hover{color:#fff;border-color:#4a5568}
.pf-btn.active[data-p="ALL"]{background:#4299e1;border-color:#4299e1;color:#fff}
.pf-btn.active[data-p="CRITICAL"]{background:#fc5353;border-color:#fc5353;color:#fff}
.pf-btn.active[data-p="HIGH"]{background:#ed8936;border-color:#ed8936;color:#fff}
.pf-btn.active[data-p="MEDIUM"]{background:#ecc94b;border-color:#ecc94b;color:#1a1a1a}
.pf-btn.active[data-p="LOW"]{background:#4299e1;border-color:#4299e1;color:#fff}
.pf-btn.active[data-p="STABLE_DROP"]{background:#ff6b6b;border-color:#ff6b6b;color:#fff}
.pf-btn.active[data-p="STABLE"]{background:#48bb78;border-color:#48bb78;color:#1a1a1a}
.pf-btn.active[data-p="INACTIVE"]{background:#718096;border-color:#718096;color:#fff}
.search-wrap{margin-left:auto;position:relative}
.search-wrap::before{content:"🔍";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.search-wrap input{background:#1a1f2e;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:5px 10px 5px 28px;font-size:12px;width:200px;outline:none}
.search-wrap input:focus{border-color:#4299e1}

/* ── Summary cards ── */
.sumcards{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px 24px;background:#12161f;border-bottom:1px solid #1a2033}
@media(max-width:900px){.sumcards{grid-template-columns:repeat(4,1fr)}}
.sc{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:8px 12px;text-align:center}
.sc .sv{font-size:20px;font-weight:700}.sc .sl{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.sc.crit{border-color:#fc5353;background:#1e0c0c}.sc.crit .sv{color:#fc5353}
.sc.high{border-color:#ed8936;background:#1e1208}.sc.high .sv{color:#ed8936}
.sc.med{border-color:#ecc94b;background:#1c1900}.sc.med .sv{color:#ecc94b}
.sc.low{border-color:#4299e1;background:#0a1420}.sc.low .sv{color:#4299e1}
.sc.stbdrop{border-color:#ff6b6b;background:#1e0a0a}.sc.stbdrop .sv{color:#ff6b6b}
.sc.stb{border-color:#48bb78;background:#0a1e12}.sc.stb .sv{color:#48bb78}
.sc.inact .sv{color:#718096}

/* ── Tree table ── */
.tree-wrap{overflow-x:auto}
.tree-table{width:100%;border-collapse:collapse;min-width:900px}
.tree-table th{padding:8px 10px;text-align:left;color:#4a5568;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1a2033;background:#10141c;white-space:nowrap}
.tree-table th.r{text-align:right}

/* section rows */
.row-section td{background:#0d1218;color:#3a5070;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;padding:6px 12px;border-bottom:1px solid #1a2033}
.row-section.sd td{background:#1e0c0c;color:#ff6b6b;border-left:3px solid #ff6b6b}

/* account rows */
.row-account{border-bottom:1px solid #1e2535;cursor:pointer;transition:background .1s}
.row-account:hover{background:#1a2030}
.row-account td{padding:8px 10px;vertical-align:middle}
.row-account.hidden{display:none}
.tog{border:none;border-radius:3px;color:#a0aec0;cursor:pointer;font-size:10px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.acc-tog{width:18px;height:18px;background:#252d3d;margin-right:5px}.acc-tog:hover{background:#4299e1;color:#fff}
.acc-name{font-weight:600;color:#e2e8f0}
.acc-sub{font-size:10px;color:#4a5568;margin-left:5px}

/* project rows */
.row-project{display:none;border-bottom:1px solid #161d2a;cursor:pointer;transition:background .1s}
.row-project:hover{background:#161d28}.row-project.vis{display:table-row}
.row-project td{padding:6px 10px 6px 32px;vertical-align:middle;background:#0f1420}
.row-project.sdp td{background:#1a0c0c}.row-project.sdp:hover td{background:#200e0e}
.proj-tog{width:16px;height:16px;background:#1e2535;margin-right:4px}.proj-tog:hover{background:#2d6a9f;color:#fff}
.proj-name{color:#c0cfe0;font-size:12px}
.bdrop{background:#2d0f0f;color:#fc5353;border:1px solid #fc535355;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:600}
.bstable{background:#0d2018;color:#48bb78;border:1px solid #48bb7855;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px}
.bstabledrop{background:#2d0f0f;color:#ff6b6b;border:1px solid #ff6b6b55;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:700}

/* module rows */
.row-module{display:none;border-bottom:1px solid #131822}.row-module.vis{display:table-row}
.row-module td{padding:5px 10px 5px 56px;vertical-align:middle;background:#0b1018}
.mod-tog{width:14px;height:14px;background:#1a2030;margin-right:4px}.mod-tog:hover{background:#1a3a5a;color:#fff}
.mod-name{color:#7a9ab0;font-size:11px}

/* event/user rows */
.row-event{display:none;border-bottom:1px solid #10151f}.row-event.vis{display:table-row}
.row-event td{padding:5px 10px 5px 78px;vertical-align:middle;background:#080c14}
.evt-name{color:#5a7090;font-size:11px;font-family:monospace}
.ubox{margin-top:3px;display:inline-flex;align-items:center;gap:6px;background:#0f1828;border:1px solid #1e3050;border-radius:5px;padding:3px 8px;flex-wrap:wrap}
.uname{color:#7eb8e0;font-size:12px;font-weight:600}
.uphone{color:#4a9edd;font-size:12px;font-weight:700;letter-spacing:.4px}

/* priority badge */
.pb{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.pb.CRITICAL{background:#2d0f0f;color:#fc5353;border:1px solid #fc5353}
.pb.HIGH{background:#2d1a0a;color:#ed8936;border:1px solid #ed8936}
.pb.MEDIUM{background:#2d2800;color:#ecc94b;border:1px solid #ecc94b}
.pb.LOW{background:#0a1a2d;color:#4299e1;border:1px solid #4299e1}
.pb.STABLE{background:#0d2d18;color:#48bb78;border:1px solid #48bb78}
.pb.STABLE_DROP{background:#2d0f0f;color:#ff6b6b;border:1px solid #ff6b6b}
.pb.INACTIVE{background:#1a1a1a;color:#718096;border:1px solid #718096}

/* numbers */
.nr{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.neg{color:#fc5353}.pos{color:#48bb78}.neu{color:#4a5568}.zred{color:#fc535355}
.sm{font-size:11px}

/* trend bars */
.trend{display:flex;align-items:flex-end;gap:2px;height:18px;min-width:40px}
.tbar{flex:1;border-radius:1px 1px 0 0;min-height:2px;min-width:5px}

/* loading overlay */
.overlay{position:fixed;inset:0;background:#0f1117ee;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.spinner{width:40px;height:40px;border:3px solid #2d3748;border-top-color:#4299e1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:#1e0c0c;border:1px solid #fc5353;border-radius:10px;padding:24px 32px;max-width:500px;text-align:center}
.err-box h3{color:#fc5353;margin-bottom:10px;font-size:15px}
.err-box p{color:#a0aec0;font-size:12px;line-height:1.7}
.panel{display:none}.panel.active{display:block}
.last-disp{font-size:10px;color:#4a6080;white-space:nowrap}
.dispo{font-size:10px;color:#556070;font-style:italic;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Email feature ── */
.send-btn{background:transparent;border:1px solid #2d4a6a;border-radius:5px;color:#4a8ab0;cursor:pointer;font-size:11px;padding:2px 6px;margin-left:6px;transition:all .15s;vertical-align:middle}
.send-btn:hover{background:#1a3a5a;color:#7eb8e0;border-color:#4a8ab0}
.tmpl-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;background:#1a2535;border:1px solid #2d3f55;border-radius:8px;color:#a0aec0;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.tmpl-btn:hover{background:#1e2e45;color:#e2e8f0;border-color:#4299e1}

/* Modal overlay */
.modal-bg{position:fixed;inset:0;background:#000c;z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#1a1f2e;border:1px solid #2d3748;border-radius:12px;width:620px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px #000a}
#send-modal .modal{width:940px}
.modal-head{padding:18px 22px 14px;border-bottom:1px solid #2d3748;display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:15px;font-weight:600;color:#e2e8f0}
.modal-close{background:transparent;border:none;color:#718096;font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px}
.modal-close:hover{color:#e2e8f0;background:#2d3748}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid #2d3748;display:flex;gap:10px;justify-content:flex-end}

/* Template tabs */
.tmpl-tabs{display:flex;gap:4px;margin-bottom:16px}
.ttab{padding:6px 14px;border-radius:6px;border:1px solid #2d3748;background:transparent;color:#718096;font-size:12px;cursor:pointer;transition:all .15s}
.ttab:hover{color:#e2e8f0;background:#252d3d}
.ttab.active{background:#0a2040;border-color:#4299e1;color:#4299e1}
.ttab.active.drop{background:#2d0f0f;border-color:#fc5353;color:#fc5353}
.ttab.active.inactive{background:#1a1a1a;border-color:#718096;color:#a0aec0}

/* Form fields */
.frow{margin-bottom:14px}
.frow label{display:block;font-size:11px;color:#718096;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.frow input,.frow textarea{width:100%;background:#0f1420;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:8px 10px;font-size:12px;outline:none;resize:vertical}
.frow input:focus,.frow textarea:focus{border-color:#4299e1}
.frow textarea{min-height:120px;font-family:inherit;line-height:1.6}
.ph-hint{font-size:10px;color:#4a5568;margin-top:4px}

/* Send preview */
.preview-field{background:#0f1420;border:1px solid #2d3748;border-radius:6px;padding:10px 12px;margin-bottom:10px}
.preview-label{font-size:10px;color:#4a5568;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.preview-val{font-size:12px;color:#e2e8f0;white-space:pre-wrap;line-height:1.6}
.preview-val.subject{color:#7eb8e0;font-weight:600}

.btn-primary{padding:8px 18px;background:#4299e1;border:none;border-radius:7px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary:hover{background:#3182ce}
.btn-secondary{padding:8px 18px;background:transparent;border:1px solid #2d3748;border-radius:7px;color:#a0aec0;font-size:13px;cursor:pointer;transition:all .2s}
.btn-secondary:hover{color:#e2e8f0;border-color:#4a5568}
.email-input-row{display:flex;gap:8px;margin-bottom:14px}
.email-input-row input{flex:1;background:#0f1420;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:7px 10px;font-size:12px;outline:none}
.email-input-row input:focus{border-color:#4299e1}
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div style="color:#718096;font-size:13px">Connecting to Redash...</div>
</div>

<!-- Header -->
<div class="header">
  <div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:22px">📊</span>
      <div>
        <h1>Trainer DrillDown Dashboard</h1>
        <div class="header-sub">Redash Query #1454 · Account → Project → Module → Event → User</div>
      </div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="last-sync" id="last-sync">Not yet synced</div>
    <div class="sync-bar">
      <div class="sync-dot" id="sync-dot"></div>
      <span class="sync-label" id="sync-label">Ready</span>
    </div>
    <button class="tmpl-btn" onclick="openTemplateModal()">✉ Email Templates</button>
    <button id="sync-btn" onclick="manualSync()" style="display:flex;align-items:center;gap:7px;padding:7px 16px;background:#4299e1;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s">
      🔄 Sync Now
    </button>
    <div class="gstats" id="gstats"></div>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div id="app"></div>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────
const PARAMS = { p_renewal_start: '2026-04-01', p_renewal_end: '2030-04-30' };

// ─────────────────────────────────────────────────────────────
// COLUMN DETECTION (flexible — works even if Redash renames cols)
// ─────────────────────────────────────────────────────────────
function detectCols(columns) {
  const names = columns.map(c => c.name.toLowerCase());
  const find = (...opts) => {
    for (const o of opts) {
      const i = names.findIndex(n => n === o || n.includes(o));
      if (i >= 0) return columns[i].name;
    }
    return null;
  };
  return {
    trainer    : find('trainer_email','trainer','trainer_name'),
    org        : find('org_name','organisation_name','organization_name','account_name','org'),
    project    : find('project_name','project'),
    module     : find('module_name','module'),
    event      : find('event_name','event','event_type'),
    user       : find('user_name','username','user'),
    mobile     : find('mobile_number','mobile','phone','phone_number'),
    renewal    : find('renewal_date','renewal'),
    last_disp  : find('last_disposition_date','last_disposition','last_disp'),
    disposition: find('disposition','notes'),
    ob_notes   : find('ob_notes','onboarding_notes','ob_note','ob_summary'),
    wk0        : find('wk_0','wk0','week_0'),
    wk1        : find('wk_1','wk1','week_1'),
    wk2        : find('wk_2','wk2','week_2'),
    wk3        : find('wk_3','wk3','week_3'),
  };
}

// ─────────────────────────────────────────────────────────────
// TRAINER NAME MAPPING
// ─────────────────────────────────────────────────────────────
const TRAINER_MAP = {
  'digvijay': 'Digvijay',
  'farid'   : 'S Farid',
  'sfarid'  : 'S Farid',
  's farid' : 'S Farid',
  'divya'   : 'Divya',
};
function trainerDisplay(email) {
  if (!email) return 'Unknown';
  const low = email.toLowerCase();
  for (const [k, v] of Object.entries(TRAINER_MAP)) {
    if (low.includes(k)) return v;
  }
  return email.split('@')[0];
}

// ─────────────────────────────────────────────────────────────
// PRIORITY LOGIC
// ─────────────────────────────────────────────────────────────
const PRIO_ORDER = ['CRITICAL','HIGH','MEDIUM','LOW','STABLE_DROP','STABLE','INACTIVE'];

function calcPriority(wk0, wk1) {
  if (wk0 === 0 && wk1 > 0)  return 'CRITICAL';
  const pct = wk1 > 0 ? ((wk0 - wk1) / wk1) * 100 : 0;
  if (pct <= -75)             return 'HIGH';
  if (pct <= -25)             return 'MEDIUM';
  if (pct < 0)                return 'LOW';
  if (wk0 === 0)              return 'INACTIVE';
  return 'STABLE';
}

// ─────────────────────────────────────────────────────────────
// PROCESS RAW ROWS → TRAINER HIERARCHY
// ─────────────────────────────────────────────────────────────
function processRows(rows, cols) {
  const trainerMap = {};

  for (const row of rows) {
    const trainer = trainerDisplay(row[cols.trainer] || '');
    const org     = row[cols.org]     || 'Unknown';
    const project = row[cols.project] || 'Unknown';
    const module  = row[cols.module]  || 'Unknown';

    if (!trainerMap[trainer]) trainerMap[trainer] = {};
    if (!trainerMap[trainer][org]) trainerMap[trainer][org] = { renewal: row[cols.renewal] || '', projects: {} };
    const orgObj = trainerMap[trainer][org];

    if (!orgObj.projects[project]) orgObj.projects[project] = { modules: {} };
    if (!orgObj.projects[project].modules[module]) orgObj.projects[project].modules[module] = { events: [] };

    orgObj.projects[project].modules[module].events.push({
      event   : row[cols.event]       || '',
      user    : row[cols.user]        || '',
      mobile  : row[cols.mobile]      || '',
      lastDisp: row[cols.last_disp]   || '',
      dispo   : row[cols.disposition] || '',
      obNotes : cols.ob_notes ? (row[cols.ob_notes] || '') : '',
      wk0: +row[cols.wk0] || 0,
      wk1: +row[cols.wk1] || 0,
      wk2: +row[cols.wk2] || 0,
      wk3: +row[cols.wk3] || 0,
    });
  }

  // Aggregate sums upward: event → module → project → account
  const result = {};
  let tIdx = 0;

  for (const [tName, orgMap] of Object.entries(trainerMap)) {
    const accounts = [];
    let aIdx = 0;

    for (const [orgName, orgData] of Object.entries(orgMap)) {
      let aWk0=0, aWk1=0, aWk2=0, aWk3=0;
      const projects = [];

      for (const [projName, projData] of Object.entries(orgData.projects)) {
        let pWk0=0, pWk1=0, pWk2=0, pWk3=0;
        const modules = [];

        for (const [modName, modData] of Object.entries(projData.modules)) {
          let mWk0=0, mWk1=0, mWk2=0, mWk3=0;
          for (const e of modData.events) { mWk0+=e.wk0; mWk1+=e.wk1; mWk2+=e.wk2; mWk3+=e.wk3; }
          pWk0+=mWk0; pWk1+=mWk1; pWk2+=mWk2; pWk3+=mWk3;
          modules.push({
            name: modName, wk0:mWk0, wk1:mWk1, wk2:mWk2, wk3:mWk3,
            diff: mWk0-mWk1,
            pct: mWk1>0 ? ((mWk0-mWk1)/mWk1*100).toFixed(1)+'%' : '',
            events: modData.events
          });
        }

        aWk0+=pWk0; aWk1+=pWk1; aWk2+=pWk2; aWk3+=pWk3;
        projects.push({
          name: projName, wk0:pWk0, wk1:pWk1, wk2:pWk2, wk3:pWk3,
          diff: pWk0-pWk1,
          pct: pWk1>0 ? ((pWk0-pWk1)/pWk1*100).toFixed(1)+'%' : '',
          isDrop: pWk0 < pWk1, modules
        });
      }

      const basePrio = calcPriority(aWk0, aWk1);
      const priority = (basePrio === 'STABLE' && aWk0 === 0) ? 'STABLE_DROP' : basePrio;
      const diff = aWk0 - aWk1;
      const pctStr = aWk1 > 0 ? (diff/aWk1*100).toFixed(1)+'%' : '';

      // Aggregate last disposition, OB notes, and module summary across all events
      let bestDispDate = '', bestDispo = '', accountObNotes = '';
      const modSummary = {};
      for (const proj of projects) {
        for (const mod of proj.modules) {
          if (!modSummary[mod.name]) modSummary[mod.name] = { wk0: 0, wk1: 0 };
          modSummary[mod.name].wk0 += mod.wk0;
          modSummary[mod.name].wk1 += mod.wk1;
          for (const evt of (mod.events || [])) {
            if (!accountObNotes && evt.obNotes) accountObNotes = evt.obNotes;
            const ld = (evt.lastDisp || '').slice(0, 10);
            if (ld && ld > bestDispDate) { bestDispDate = ld; bestDispo = evt.dispo || ''; }
          }
        }
      }

      accounts.push({
        num: ++aIdx, name: orgName, renewal: orgData.renewal,
        wk0:aWk0, wk1:aWk1, wk2:aWk2, wk3:aWk3,
        diff, pct: pctStr, priority, projects,
        lastDispDate: bestDispDate,
        lastDispo: bestDispo,
        obNotes: accountObNotes,
        modSummary
      });
    }

    result[tName] = { accounts };
  }

  return result;
}

function pb(p){ return `<span class="pb ${p}">${p.replace('_',' ')}</span>`; }

function trend(w0,w1,w2,w3){
  const v=[w3,w2,w1,w0], mx=Math.max(...v,1);
  const col = ['#3a4a5a','#4a5a6a','#8899aa', w0===0?'#fc5353':(w0>=w1?'#48bb78':'#ed8936')];
  return `<div class="trend">${v.map((n,i)=>`<div class="tbar" style="height:${Math.max(2,Math.round(n/mx*18))}px;background:${col[i]}"></div>`).join('')}</div>`;
}

const nTD = (v,zr=false) => `<td class="nr ${zr&&v===0?'zred':''}">${v??'—'}</td>`;
const dTD = v => (!v&&v!==0) ? `<td class="nr neu">—</td>` : `<td class="nr ${v<0?'neg':v>0?'pos':'neu'}">${v>0?'+':''}${v}</td>`;
const pTD = v => !v ? `<td class="nr neu sm">—</td>` : `<td class="nr ${v.startsWith('-')?'neg':'pos'} sm">${v}</td>`;

      <th>Priority</th><th>Last Dispos.</th><th>Note</th>

  const sorted = [...accs].sort((a,b) => PRIO_ORDER.indexOf(a.priority) - PRIO_ORDER.indexOf(b.priority));

    html += `<tr class="row-account" data-p="${acc.priority}" data-name="${acc.name.toLowerCase()}" data-aid="${aId}" onclick="toggleAcc('${aId}',event)">

        <td></td><td></td><td></td>

          <td><button class="tog mod-tog" id="btn-${mId}">${mod.events.length?'+':'·'}</button></td>
          <td></td>
          <td><span class="mod-name">📦 ${mod.name}</span></td>
          ${nTD(mod.wk0,true)}${nTD(mod.wk1)}${nTD(mod.wk2)}${nTD(mod.wk3)}
          ${dTD(mod.diff)}${pTD(mod.pct)}
          <td></td><td></td><td></td><td></td>
        </tr>`;

        for (const evt of mod.events) {
          html += `<tr class="row-event" data-mod="${mId}">

              </div>

            ${dTD(evt.wk0-evt.wk1)}

            <td class="dispo" title="${(evt.dispo||'').replace(/"/g,"'")}">${evt.dispo||'—'}</td>
          </tr>`;
        }
      }
    }
  }

  html += `</tbody></table></div>`;
  return html;
}

// ─────────────────────────────────────────────────────────────
// FETCH + RENDER
// ─────────────────────────────────────────────────────────────
let currentTab = null;
let initialized = false;

async function fetchAndRender() {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot loading';
  document.getElementById('sync-label').textContent = 'Syncing...';

  try {
    const qs = new URLSearchParams(PARAMS).toString();
    const res = await fetch(`/api/redash?${qs}`);
    const rawText = await res.text();

    if (!res.ok) throw new Error(`HTTP ${res.status} — Raw: ${rawText.slice(0,300)}`);

    let json;
    try { json = JSON.parse(rawText); }
    catch(e) { throw new Error('Proxy returned non-JSON: ' + rawText.slice(0,300)); }

    if (json.error) throw new Error('Proxy error: ' + json.error + (json.hint ? ' | ' + json.hint : ''));

    // Try all known Redash response shapes
    const qr   = json.query_result || json;
    const data  = qr.data || qr;
    const cols  = data.columns || [];
    const rows  = data.rows   || [];

    if (!cols.length) {
      // Show raw for debugging
      const preview = JSON.stringify(json, null, 2).slice(0, 600);
      throw new Error('No columns in response. Raw preview:\n' + preview);
    }

    const detectedCols = detectCols(cols);
    const trainers = processRows(rows, detectedCols);

    if (!initialized) {
      buildUI(trainers);
      initialized = true;
      document.getElementById('overlay').style.display = 'none';
    } else {
      updateUI(trainers);
    }

    dot.className = 'sync-dot';
    document.getElementById('sync-label').textContent = 'Live';
    document.getElementById('last-sync').textContent = 'Last synced: ' + new Date().toLocaleTimeString();

  } catch (err) {
    dot.className = 'sync-dot error';
    document.getElementById('sync-label').textContent = 'Error';
    if (!initialized) showError(err);
    console.error('[DrillDown] Fetch error:', err);
  }

}

function showError(err) {
  document.getElementById('overlay').innerHTML = `
    <div class="err-box">
      <h3>⚠ Cannot connect to Redash</h3>
      <pre style="background:#0a0a0a;border:1px solid #3a1515;border-radius:6px;padding:10px;font-size:10px;color:#fc9090;text-align:left;max-height:200px;overflow:auto;margin:10px 0;white-space:pre-wrap;word-break:break-all">${err.message}</pre>
      <p style="font-size:11px;color:#718096">Screenshot this error and share with your developer to diagnose.<br>
      Also visit <code style="color:#4299e1">/api/debug</code> on your Vercel URL for full diagnostics.</p>
    </div>`;
}

// ─────────────────────────────────────────────────────────────
// UI: BUILD + UPDATE
// ─────────────────────────────────────────────────────────────
function buildUI(trainers) {
  const tabsEl = document.getElementById('tabs');
  const appEl  = document.getElementById('app');
  tabsEl.innerHTML = ''; appEl.innerHTML = '';
  currentTab = null;
  window.accRegistry = {}; // reset registry on each rebuild

  Object.entries(trainers).forEach(([tName, tData], i) => {
    const tid  = tName.replace(/[^a-z0-9]/gi,'_');
    const crit = tData.accounts.filter(a => a.priority==='CRITICAL').length;
    const high = tData.accounts.filter(a => a.priority==='HIGH').length;
    const sd   = tData.accounts.filter(a => a.priority==='STABLE_DROP').length;
    const urg  = crit>0 ? `<span style="color:#fc5353;font-weight:700"> ${crit}🔴</span>`
               : high>0 ? `<span style="color:#ed8936"> ${high}🟠</span>` : '';
    const sdB  = sd>0 ? `<span style="color:#ff6b6b;font-size:10px"> ${sd}⚠</span>` : '';

    const tab = document.createElement('div');
    tab.className = 'tab' + (i===0 ? ' active' : '');
    tab.dataset.tid = tid;
    tab.innerHTML = `${tName} <span class="cnt">${tData.accounts.length}</span>${urg}${sdB}`;
    tab.addEventListener('click', () => switchTab(tid));
    tabsEl.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'panel' + (i===0 ? ' active' : '');
    panel.id = 'panel-' + tid;
    panel.innerHTML = renderPanel(tName, tData, tid);
    appEl.appendChild(panel);

    if (i===0) currentTab = tid;
  });

  updateGlobalStats(trainers);
}

function updateUI(trainers) {
  const prev = currentTab;
  buildUI(trainers);
  if (prev && document.querySelector(`[data-tid="${prev}"]`)) switchTab(prev);
}

function updateGlobalStats(trainers) {
  const gc = {};
  Object.values(trainers).forEach(t => t.accounts.forEach(a => gc[a.priority] = (gc[a.priority]||0)+1));
  const total = Object.values(gc).reduce((s,v)=>s+v,0);
  document.getElementById('gstats').innerHTML = `
    <div class="gs"><div class="v" style="color:#fc5353">${gc.CRITICAL||0}</div><div class="l">Critical</div></div>
    <div class="gs"><div class="v" style="color:#ed8936">${gc.HIGH||0}</div><div class="l">High</div></div>
    <div class="gs"><div class="v" style="color:#ff6b6b">${gc.STABLE_DROP||0}</div><div class="l">Stable Drop</div></div>
    <div class="gs"><div class="v" style="color:#48bb78">${gc.STABLE||0}</div><div class="l">Stable</div></div>
    <div class="gs"><div class="v" style="color:#a0aec0">${total}</div><div class="l">Total</div></div>`;
}

function switchTab(tid) {
  currentTab = tid;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tid===tid));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id==='panel-'+tid));
}

// ─────────────────────────────────────────────────────────────
function toggleAcc(aId, e) {
  e.stopPropagation();
  const btn = document.getElementById('btn-'+aId);
  if (!btn || btn.textContent==='·') return;
  const open = btn.textContent==='+';
  btn.textContent = open ? '−' : '+';
  document.querySelectorAll(`[data-acc="${aId}"]`).forEach(r => {
    r.classList.toggle('vis', open);
    if (!open) {
      const pb = r.querySelector('.proj-tog');
      if (pb && pb.textContent!=='·') pb.textContent = '+';
      const pid = r.id?.replace('proj-','');
      if (pid) {
        document.querySelectorAll(`[data-proj="${pid}"]`).forEach(m => {
          m.classList.remove('vis');
          const mb = m.querySelector('.mod-tog');
          if (mb && mb.textContent!=='·') mb.textContent = '+';
          const mid = m.id?.replace('mod-','');
          if (mid) document.querySelectorAll(`[data-mod="${mid}"]`).forEach(ev => ev.classList.remove('vis'));
        });
      }
    }
  });
}

function toggleProj(pId, e) {
  e.stopPropagation();
  const btn = document.getElementById('btn-'+pId);
  if (!btn || btn.textContent==='·') return;
  const open = btn.textContent==='+';
  btn.textContent = open ? '−' : '+';
  document.querySelectorAll(`[data-proj="${pId}"]`).forEach(r => {
    r.classList.toggle('vis', open);
    if (!open) {
      const mb = r.querySelector('.mod-tog');
      if (mb && mb.textContent!=='·') mb.textContent = '+';
      const mid = r.id?.replace('mod-','');
      if (mid) document.querySelectorAll(`[data-mod="${mid}"]`).forEach(ev => ev.classList.remove('vis'));
    }
  });
}

function toggleMod(mId, e) {
  e.stopPropagation();
  const btn = document.getElementById('btn-'+mId);
  if (!btn || btn.textContent==='·') return;
  const open = btn.textContent==='+';
  btn.textContent = open ? '−' : '+';
  document.querySelectorAll(`[data-mod="${mId}"]`).forEach(r => r.classList.toggle('vis', open));
}

// ─────────────────────────────────────────────────────────────
// FILTER + SEARCH (event delegation)
// ─────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  if (!e.target.classList.contains('pf-btn')) return;
  const tid  = e.target.dataset.t;
  const prio = e.target.dataset.p;
  const panel = document.getElementById('panel-'+tid);
  panel.querySelectorAll('.pf-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  // Collapse all
  panel.querySelectorAll('.acc-tog').forEach(b => { if(b.textContent!=='·') b.textContent='+'; });
  panel.querySelectorAll('.row-project,.row-module,.row-event').forEach(r => r.classList.remove('vis'));
  // Show/hide accounts and section headers
  panel.querySelectorAll('.row-account').forEach(r => r.classList.toggle('hidden', prio!=='ALL' && r.dataset.p!==prio));
  panel.querySelectorAll('.row-section').forEach(s => s.style.display = (prio==='ALL' || s.dataset.sect===prio) ? '' : 'none');
});

document.addEventListener('input', e => {
  if (!e.target.classList.contains('acc-search')) return;
  const tid = e.target.dataset.t;
  const q   = e.target.value.toLowerCase();
  document.getElementById('panel-'+tid).querySelectorAll('.row-account').forEach(r => {
    r.classList.toggle('hidden', !!q && !r.dataset.name.includes(q));
  });
});

// ─────────────────────────────────────────────────────────────
// MANUAL SYNC
// ─────────────────────────────────────────────────────────────
function manualSync() {
  const btn = document.getElementById('sync-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Syncing...';
  btn.style.background = '#2d6aa0';
  fetchAndRender().finally(() => {
    btn.disabled = false;
    btn.innerHTML = '🔄 Sync Now';
    btn.style.background = '#4299e1';
  });
}

I'm not asking for a commitment. I'm asking for 30 minutes before you decide.

In that call, {{trainer}} will:
  — Walk through exactly what your team has built in Powerplay so far
  — Be honest about what worked and what didn't
  — Show you what's still possible with the time remaining

Two options:
  1. Book 30 minutes with {{trainer}} — reply and we'll send a slot within the hour
  2. If you've already decided not to renew — tell us and we'll make the transition clean

Last note ({{last_disposition}}): "{{disposition}}"

{{trainer}}
Customer Success — Powerplay`
  }
};

let emailTemplates = JSON.parse(localStorage.getItem('pp_email_templates_v2') || 'null') || JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
let emailMap     = JSON.parse(localStorage.getItem('pp_email_map')      || '{}');
let obNotesMap   = JSON.parse(localStorage.getItem('pp_ob_notes_map')   || '{}');
let kamNotesMap  = JSON.parse(localStorage.getItem('pp_kam_notes_map')  || '{}');
let snapDataMap  = JSON.parse(localStorage.getItem('pp_snap_data_map')  || '{}');
let currentTmplTab = 'active';
let pendingAcc     = null;

// Global account registry — populated during render, reset on each rebuild
window.accRegistry = {};

// ── Module summary for email body ─────────────────────────────
function buildModulesSummary(acc) {
  const entries = Object.entries(acc.modSummary || {});
  if (!entries.length) return '  (Module data not available)';
  return entries.map(([name, d]) => {
    const icon = d.wk0 === 0 ? '🔴' : d.wk0 >= d.wk1 ? '✅' : '🟡';
    const detail = d.wk0 === 0
      ? 'No activity this week'
      : d.wk0 > d.wk1  ? `${d.wk0} events (+${d.wk0 - d.wk1} vs last week)`
      : d.wk0 === d.wk1 ? `${d.wk0} events (stable)`
      : `${d.wk0} events (↓ from ${d.wk1} last week)`;
    const pad = Math.max(1, 26 - name.length);
    return `  ${icon} ${name}${' '.repeat(pad)}: ${detail}`;
  }).join('\n');
}

// ── Fill all placeholders ─────────────────────────────────────
function fillTemplate(text, acc, trainer, obNotes) {
  const ob = obNotes || acc.obNotes || '[Paste OB notes here — what the owner said they wanted to fix]';
  return text
    .replace(/\{\{account\}\}/g,         acc.name || '')
    .replace(/\{\{trainer\}\}/g,         trainer || '')
    .replace(/\{\{wk0\}\}/g,             acc.wk0 ?? 0)
    .replace(/\{\{wk1\}\}/g,             acc.wk1 ?? 0)
    .replace(/\{\{wk2\}\}/g,             acc.wk2 ?? 0)
    .replace(/\{\{wk3\}\}/g,             acc.wk3 ?? 0)
    .replace(/\{\{diff\}\}/g,            (acc.diff > 0 ? '+' : '') + (acc.diff ?? 0))
    .replace(/\{\{pct\}\}/g,             acc.pct || '—')
    .replace(/\{\{renewal\}\}/g,         acc.renewal || 'N/A')
    .replace(/\{\{priority\}\}/g,        (acc.priority || '').replace('_', ' '))
    .replace(/\{\{projects\}\}/g,        acc.projects?.length ?? 0)
    .replace(/\{\{disposition\}\}/g,     acc.lastDispo || '—')
    .replace(/\{\{last_disposition\}\}/g, acc.lastDispDate || '—')
    .replace(/\{\{modules_status\}\}/g,  buildModulesSummary(acc))
    .replace(/\{\{ob_notes\}\}/g,        ob);
}

// ── Pick template based on priority + 4-week data ────────────
function pickTemplate(priority, acc) {
  // All 4 weeks zero → long inactive
  if (acc && acc.wk0 === 0 && acc.wk1 === 0 && acc.wk2 === 0 && acc.wk3 === 0) return 'long_inactive';
  if (['CRITICAL', 'STABLE_DROP'].includes(priority)) return 'recent_inactive';
  if (priority === 'INACTIVE') return 'recent_inactive';
  if (['HIGH', 'MEDIUM', 'LOW'].includes(priority)) return 'drop';
  return 'active';
}

// ─────────────────────────────────────────────────────────────
// SMART EMAIL GENERATOR — reads all 5 data sources
// Goals by status:
//   active       → maintain activity, expand modules, realize value, no churn
//   drop         → drive adoption, kill parallel processes, recover usage
//   recent_inact → identify blocker (A/B/C), restart the team fast
//   long_inact   → honest 30-min conversation before renewal decision
// ─────────────────────────────────────────────────────────────
function generateSmartEmail(acc, trainer, inputs) {
  const ob   = (inputs.obNotes  || acc.obNotes || '').trim();
  const kam  = (inputs.kamNotes || '').trim();
  const snap = (inputs.snapData || '').trim();
  const tKey = pickTemplate(acc.priority, acc);
  const D    = '─'.repeat(36);
  const L    = [];

  const subjects = {
    long_inactive:   `${acc.name} — before your renewal on ${acc.renewal||'N/A'}, a quick conversation`,
    recent_inactive: `${acc.name} — activity stopped this week. One question.`,
    drop:            `Activity has dipped for ${acc.name} — a few specific things to flag`,
    active:          `What ${acc.name} set out to fix — and where it stands today`
  };
  const subject = subjects[tKey] || subjects.active;

  L.push('Hi,'); L.push('');

  // OB anchor — owner's own words as the hook
  if (ob && tKey !== 'recent_inactive') {
    L.push('When you started on Powerplay, the goal was:');
    L.push(`"${ob}"`); L.push('');
  }

  // Activity data table
  L.push(D);
  if (tKey === 'long_inactive') {
    L.push(`  3 weeks ago (Wk 3) : ${acc.wk3 ?? 0}`);
    L.push(`  2 weeks ago (Wk 2) : ${acc.wk2 ?? 0}`);
    L.push(`  Last week  (Wk 1)  : ${acc.wk1 ?? 0}`);
    L.push(`  This week  (Wk 0)  : ${acc.wk0 ?? 0}`);
  } else {
    const dropNote = (tKey === 'drop' && acc.pct) ? `  ← ${(acc.diff>0?'+':'')+acc.diff} (${acc.pct}) vs last week` : '';
    L.push(`  This week (Wk 0)   : ${acc.wk0 ?? 0}${dropNote}`);
    L.push(`  Last week  (Wk 1)  : ${acc.wk1 ?? 0}`);
    L.push(`  2 weeks ago (Wk 2) : ${acc.wk2 ?? 0}`);
    L.push(`  3 weeks ago (Wk 3) : ${acc.wk3 ?? 0}`);
  }
  L.push('');

  // Module breakdown from dashboard data
  const modEntries = Object.entries(acc.modSummary || {});
  if (modEntries.length && tKey !== 'long_inactive') {
    L.push('Module activity this week:');
    modEntries.forEach(([name, d]) => {
      const icon   = d.wk0 === 0 ? '🔴' : d.wk0 >= d.wk1 ? '✅' : '🟡';
      const detail = d.wk0 === 0
        ? (d.wk1 > 0 ? `No activity this week (was ${d.wk1} last week)` : 'No activity')
        : d.wk0 > d.wk1 ? `${d.wk0} events (+${d.wk0-d.wk1} vs last week)`
        : d.wk0 === d.wk1 ? `${d.wk0} events (stable)`
        : `${d.wk0} events (↓ from ${d.wk1} last week)`;
      const pad = Math.max(1, 22 - name.length);
      L.push(`  ${icon} ${name}${' '.repeat(pad)}: ${detail}`);
    });
    L.push('');
  }
  L.push(D); L.push('');

  // Trainer disposition (auto from Redash)
  const dispLine = acc.lastDispo
    ? `Last note${acc.lastDispDate ? ` (${acc.lastDispDate})` : ''}: "${acc.lastDispo}"`
    : '';

  // Weekly snap highlights — project/user-level detail
  if (snap) {
    L.push('From this week\'s snap:');
    snap.split('\n').forEach(line => line.trim() && L.push(`  ${line.trim()}`));
    L.push('');
  }

  // Status-specific narrative
  if (tKey === 'long_inactive') {
    L.push(ob
      ? `You came in with a clear goal. We haven't fully got there — and we want to understand why before you make any renewal decision.`
      : `Your account has been inactive for several weeks. Before your renewal, we want to be direct.`);
    L.push('');
    L.push(`I'm not asking for a commitment. I'm asking for 30 minutes before you decide.`);
    L.push('');
    L.push(`In that call, ${trainer} will:`);
    L.push(`  — Show exactly what your team has built in Powerplay so far`);
    L.push(`  — Be honest about what worked and what didn't`);
    L.push(`  — Show what's still possible in the time remaining`);
    L.push('');
    if (dispLine) { L.push(dispLine); L.push(''); }
    if (kam)      { L.push(`KAM note: ${kam}`); L.push(''); }
    L.push('Two options:');
    L.push(`  1. Book 30 minutes with ${trainer} — reply and we'll send a slot within the hour`);
    L.push(`  2. If you've already decided not to renew — tell us and we'll make the transition clean`);

  } else if (tKey === 'recent_inactive') {
    L.push(`When activity stops, it's usually one of these three:`);
    L.push('');
    L.push(`  A. Team is busy on site — we reschedule training sessions around your timelines`);
    L.push(`  B. Something in the workflow isn't working — one call is usually all it takes to fix it`);
    L.push(`  C. Team needs a refresher — we'll run a short session this week`);
    L.push('');
    if (dispLine) { L.push(dispLine); L.push(''); }
    if (kam)      { L.push(`KAM note: ${kam}`); L.push(''); }
    if (ob) {
      L.push(`Your original goal was: "${ob}"`);
      L.push(`That's still achievable — but only if the team is back on the platform.`);
      L.push('');
    }
    L.push(`Just reply with A, B, or C — and ${trainer} will set it up within 24 hours.`);

  } else if (tKey === 'drop') {
    const stopped = modEntries.filter(([,d]) => d.wk0 === 0 && d.wk1 > 0);
    const growing = modEntries.filter(([,d]) => d.wk0 > d.wk1);
    if (stopped.length) {
      L.push(`Modules that stopped this week:`);
      stopped.forEach(([n,d]) => L.push(`  — ${n} (was ${d.wk1} last week, 0 this week)`));
      L.push('');
    }
    if (growing.length) {
      L.push(`Still growing:`);
      growing.forEach(([n,d]) => L.push(`  — ${n}: ${d.wk1} → ${d.wk0} this week`));
      L.push('');
    }
    if (ob) { L.push(`Your original goal was: "${ob}"`); L.push(''); }
    const stoppedNames = stopped.map(([n]) => n);
    L.push(stoppedNames.length
      ? `When ${stoppedNames.join(' and ')} ${stoppedNames.length > 1 ? 'drop' : 'drops'} like this, it usually means the team has gone back to a parallel process — Excel, WhatsApp, manual sheets. That's the gap we need to close.`
      : `A dip like this usually means the team has reverted to a parallel process for some modules. That's what we need to address.`);
    L.push('');
    if (dispLine) { L.push(dispLine); L.push(''); }
    if (kam)      { L.push(`KAM note: ${kam}`); L.push(''); }
    L.push(`${trainer} can spend 20 minutes with your team lead this week — specifically on the modules that have dropped. No big session. Just that.`);
    L.push(''); L.push(`Would this week work? Just reply and we'll set it up.`);

  } else {
    // ACTIVE — value realization, expand, no churn
    const zeroMods   = modEntries.filter(([,d]) => d.wk0 === 0 && d.wk1 === 0);
    const activeMods = modEntries.filter(([,d]) => d.wk0 > 0);
    L.push(`${acc.wk0} activities across ${acc.projects?.length||0} project(s) this week — your team is building consistent habits on the platform.`);
    L.push('');
    if (activeMods.length) { L.push(`Running well: ${activeMods.map(([n])=>n).join(', ')}`); L.push(''); }
    if (zeroMods.length) {
      L.push(`Not yet active: ${zeroMods.map(([n])=>n).join(', ')}`);
      L.push(`These modules are included in your subscription — activating even one more could eliminate a parallel process entirely.`);
      L.push('');
    }
    if (ob) {
      L.push(`Progress against your original goal:`);
      L.push(`"${ob}"`);
      activeMods.forEach(([n]) => L.push(`  ✅ ${n}: Active and running`));
      zeroMods.forEach(([n])   => L.push(`  🔄 ${n}: Not yet started — potential next phase`));
      L.push('');
    }
    if (dispLine) { L.push(dispLine); L.push(''); }
    if (kam)      { L.push(`Note from ${trainer}: ${kam}`); L.push(''); }
    L.push(`The next step is making sure every active module delivers measurable value — and that no parallel process remains running alongside Powerplay. The data your team is building grows in value every week.`);
    L.push(''); L.push(`Can we do 20 minutes this week to walk through the live reports and plan the next phase?`);
  }

  L.push('');
  L.push(`Renewal: ${acc.renewal || 'N/A'}`);
  L.push(''); L.push(trainer); L.push('Customer Success — Powerplay');

  return { subject, body: L.join('\n'), tKey };
}

// ─────────────────────────────────────────────────────────────
// SEND EMAIL MODAL — two-panel: data sources | generated email
// ─────────────────────────────────────────────────────────────
function openSendModal(aId) {
  const entry = window.accRegistry[aId];
  if (!entry) return;
  pendingAcc = entry;

  const { acc, trainer } = entry;
  const tKey  = pickTemplate(acc.priority, acc);
  const tColors = { long_inactive:'#718096', recent_inactive:'#fc5353', drop:'#ed8936', active:'#48bb78' };
  const tLabels = { long_inactive:'⚫ Long Inactive', recent_inactive:'🔴 Recently Inactive', drop:'🟠 Drop', active:'✅ Active / Stable' };
  const col   = tColors[tKey] || '#4299e1';
  const lbl   = tLabels[tKey] || tKey;

  const savedEmail = emailMap[acc.name]    || '';
  const savedOb    = obNotesMap[acc.name]  || acc.obNotes || '';
  const savedKam   = kamNotesMap[acc.name] || '';
  const savedSnap  = snapDataMap[acc.name] || '';

  document.getElementById('send-modal-title').textContent = '✉  ' + acc.name;

  const modRows = Object.entries(acc.modSummary || {}).map(([n,d]) => {
    const ic = d.wk0===0?'🔴':d.wk0>=d.wk1?'✅':'🟡';
    return `<div style="font-size:11px;color:#718096;margin-top:2px">${ic} ${n}: <b style="color:#a0aec0">${d.wk0}</b> this wk</div>`;
  }).join('');

  const esc = s => (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  document.getElementById('send-modal-body').innerHTML = `
    <div style="display:grid;grid-template-columns:290px 1fr;margin:0 -22px -20px;min-height:500px">

      <div style="border-right:1px solid #2d3748;padding:14px;overflow-y:auto;max-height:calc(90vh - 130px);display:flex;flex-direction:column;gap:12px">

        <div style="background:#10141c;border:1px solid #1e2535;border-radius:8px;padding:10px 12px">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#3a5070;margin-bottom:7px">📊 Dashboard Data</div>
          <div style="font-size:12px;color:#a0aec0;line-height:1.9">
            <div>Status: <span style="color:${col};font-weight:600">${lbl}</span></div>
            <div>Wk0: <b style="color:#e2e8f0">${acc.wk0}</b> · Wk1: ${acc.wk1} · Wk2: ${acc.wk2} · Wk3: ${acc.wk3}</div>
            <div>Δ: <span style="color:${acc.diff<0?'#fc5353':'#48bb78'}">${(acc.diff>0?'+':'')+acc.diff} (${acc.pct||'—'})</span> · ${acc.projects?.length||0} projects</div>
            <div>Renewal: <b style="color:#7eb8e0">${acc.renewal||'N/A'}</b></div>
            ${modRows}
            ${acc.lastDispDate?`<div style="margin-top:5px;font-size:11px;color:#4a6080">Last call: ${acc.lastDispDate}</div>`:''}
            ${acc.lastDispo?`<div style="font-size:11px;color:#4a6080;font-style:italic" title="${esc(acc.lastDispo)}">"${acc.lastDispo.slice(0,80)}${acc.lastDispo.length>80?'...':''}"</div>`:''}
          </div>
        </div>

        <div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#3a5070;margin-bottom:5px">📋 OB Notes — Owner's Goal</div>
          <textarea id="inp-ob" rows="3" oninput="_refreshSmartEmail()"
            placeholder="What did the owner say they wanted to fix? Paste OB form summary here."
            style="width:100%;background:#0f1420;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:11.5px;outline:none;resize:vertical;min-height:70px;line-height:1.55;font-family:inherit"
          >${esc(savedOb)}</textarea>
          <div style="font-size:10px;color:#4a5568;margin-top:3px">Saved per account. Fills into email automatically.</div>
        </div>

        <div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#3a5070;margin-bottom:5px">💬 KAM Notes</div>
          <textarea id="inp-kam" rows="2" oninput="_refreshSmartEmail()"
            placeholder="Key account observations, team context, escalations"
            style="width:100%;background:#0f1420;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:11.5px;outline:none;resize:vertical;min-height:56px;line-height:1.55;font-family:inherit"
          >${esc(savedKam)}</textarea>
        </div>

        <div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#3a5070;margin-bottom:5px">📸 Weekly Snap Highlights</div>
          <textarea id="inp-snap" rows="3" oninput="_refreshSmartEmail()"
            placeholder="Paste key lines from this week's snap — e.g. 'Godrej Industries silent (was 6)' / 'STT Jaipur material stopped'"
            style="width:100%;background:#0f1420;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:11.5px;outline:none;resize:vertical;min-height:70px;line-height:1.55;font-family:inherit"
          >${esc(savedSnap)}</textarea>
        </div>

        <div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#3a5070;margin-bottom:5px">📧 Send to</div>
          <input id="send-to" type="email" placeholder="owner@company.com" value="${esc(savedEmail)}"
            style="width:100%;background:#0f1420;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:7px 9px;font-size:12px;outline:none">
        </div>

      </div>

      <div style="padding:14px 16px;overflow-y:auto;max-height:calc(90vh - 130px);display:flex;flex-direction:column;gap:10px">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#3a5070">Generated Email — auto-updates as you fill data</div>
        <div style="background:#0f1420;border:1px solid #2d3748;border-radius:6px;padding:10px 13px">
          <div style="font-size:10px;color:#3a5070;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">Subject</div>
          <div id="prev-subj" style="font-size:13px;color:#7eb8e0;font-weight:600;line-height:1.4"></div>
        </div>
        <div style="background:#0f1420;border:1px solid #2d3748;border-radius:6px;padding:10px 13px;flex:1">
          <div style="font-size:10px;color:#3a5070;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Body</div>
          <div id="prev-body" style="font-size:12px;color:#a0aec0;line-height:1.75;white-space:pre-wrap;font-family:inherit"></div>
        </div>
      </div>

    </div>`;

  _refreshSmartEmail();
  document.getElementById('send-modal').classList.add('open');
}

function _refreshSmartEmail() {
  if (!pendingAcc) return;
  const { acc, trainer } = pendingAcc;
  const inputs = {
    obNotes:  document.getElementById('inp-ob')?.value   || '',
    kamNotes: document.getElementById('inp-kam')?.value  || '',
    snapData: document.getElementById('inp-snap')?.value || ''
  };
  const { subject, body } = generateSmartEmail(acc, trainer, inputs);
  const se = document.getElementById('prev-subj');
  const be = document.getElementById('prev-body');
  if (se) se.textContent = subject;
  if (be) be.textContent = body;
}

function doSendEmail() {
  const to      = (document.getElementById('send-to')?.value  || '').trim();
  const subject = document.getElementById('prev-subj')?.textContent || '';
  const body    = document.getElementById('prev-body')?.textContent || '';
  const ob      = document.getElementById('inp-ob')?.value   || '';
  const kam     = document.getElementById('inp-kam')?.value  || '';
  const snap    = document.getElementById('inp-snap')?.value || '';

  if (!to)               { alert('Please enter a recipient email address.'); return; }
  if (!to.includes('@')) { alert('Please enter a valid email address.'); return; }

  if (pendingAcc) {
    const n = pendingAcc.acc.name;
    emailMap[n] = to;
    if (ob)   obNotesMap[n]  = ob;
    if (kam)  kamNotesMap[n] = kam;
    if (snap) snapDataMap[n] = snap;
    localStorage.setItem('pp_email_map',      JSON.stringify(emailMap));
    localStorage.setItem('pp_ob_notes_map',   JSON.stringify(obNotesMap));
    localStorage.setItem('pp_kam_notes_map',  JSON.stringify(kamNotesMap));
    localStorage.setItem('pp_snap_data_map',  JSON.stringify(snapDataMap));
  }

  window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  closeSendModal();
}

function closeSendModal() {
  document.getElementById('send-modal').classList.remove('open');
  pendingAcc = null;
}
</script>

      <button class="modal-close" onclick="closeTemplateModal()">✕</button>
    </div>
    <div class="modal-body" id="tmpl-modal-body"></div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="resetTmpl()">Reset to Default</button>
      <button class="btn-primary" id="tmpl-save-btn" onclick="saveTmplCurrent()">Save Template</button>
    </div>
  </div>
</div>

<!-- ── Send Email Modal ── -->
<div class="modal-bg" id="send-modal" onclick="if(event.target===this)closeSendModal()">
  <div class="modal">
    <div class="modal-head">
      <h2 id="send-modal-title">✉ Send Email</h2>
      <button class="modal-close" onclick="closeSendModal()">✕</button>
    </div>
    <div class="modal-body" id="send-modal-body"></div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="closeSendModal()">Cancel</button>
      <button class="btn-primary" onclick="doSendEmail()">📤 Open in Mail App</button>
    </div>
  </div>
</div>

</body>
</html>
