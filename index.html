function openSnapModal(aId) {
  const entry = window.accRegistry[aId];
  if (!entry) return;
  snapAcc = entry.acc;
  snapTrainer = entry.trainer;
  document.getElementById('snap-modal-title').textContent = '📸 Snap — ' + snapAcc.name;
  document.getElementById('snap-modal-body').innerHTML = buildSnapCard(snapAcc, snapTrainer);
  document.getElementById('snap-modal').classList.add('open');
}

// ── Lazy-load external script ────────────────────────────────
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) { res(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

// ── Download snap as PNG image ────────────────────────────────
async function downloadSnapImage() {
  const card = document.getElementById('snap-card');
  if (!card || !snapAcc) return;
  const btn = document.getElementById('snap-img-btn');
  if (btn) btn.textContent = '⏳ Generating...';
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    const canvas = await html2canvas(card, { scale:3, backgroundColor:'#ffffff', useCORS:true, logging:false });
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    const _d=new Date(),_ds=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');
    a.download = `snap_${snapAcc.name.replace(/[^a-z0-9]/gi,'_')}_${_ds}.png`;
    a.click();
  } finally {
    if (btn) btn.textContent = '📷 Image';
  }
}

// ── Download snap as PDF — pure vector (no html2canvas) ────────
// Uses jsPDF native drawing so the PDF is vector-based:
//   • tiny file size (≈5–15 kB)
//   • one-click direct download (no print dialog)
//   • clean WhatsApp thumbnail (red PDF icon, not blurry screenshot)
async function downloadSnapPDF() {
  if (!snapAcc) return;
  const btn = document.getElementById('snap-pdf-btn');
  if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const { jsPDF } = window.jspdf;

    const acc     = snapAcc;
    const trainer = snapTrainer;
    const { snapProjects, silentProjects, stoppedModules, biggestDrops, topMover, watchOut } = computeSnapData(acc);
    const pctChange = acc.wk1 > 0 ? Math.round((acc.wk0 - acc.wk1) / acc.wk1 * 100) : null;
    const weekStr   = getWeekEndingStr();

    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const PW = 210, PH = 297, M = 13, CW = PW - M * 2;
    let y = M;

    // ── Primitive helpers ──────────────────────────────────────
    function hr(hex) {
      const h = hex.replace('#','');
      return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    function fr(x,yy,w,h,hex) { const [r,g,b]=hr(hex); pdf.setFillColor(r,g,b); pdf.rect(x,yy,w,h,'F'); }
    function sr(x,yy,w,h,hex,lw=0.15) { const [r,g,b]=hr(hex); pdf.setDrawColor(r,g,b); pdf.setLineWidth(lw); pdf.rect(x,yy,w,h,'S'); }
    function tx(str,x,yy,{sz=9,bold=false,col='#111827',align='left',mw=0}={}) {
      const [r,g,b]=hr(col); pdf.setFontSize(sz); pdf.setFont('helvetica',bold?'bold':'normal'); pdf.setTextColor(r,g,b);
      const s=String(str||'');
      if(mw>0){ const lines=pdf.splitTextToSize(s,mw); pdf.text(lines[0]+(lines.length>1?'…':''),x,yy,{align}); }
      else { pdf.text(s,x,yy,{align}); }
    }
    function chk(need) { if(y+need>PH-M){ pdf.addPage(); y=M; } }

    // ══ HEADER ════════════════════════════════════════════════
    fr(M, y, CW, 24, '#1a2e4a');
    tx(acc.name, M+5, y+9,  {sz:13,bold:true,col:'#ffffff',mw:CW*0.62});
    tx('Powerplay Weekly Snap  ·  '+(trainer||''), M+5, y+16, {sz:7.5,col:'#93c5fd',mw:CW*0.62});
    tx('W0', PW-M-5, y+8, {sz:7,col:'#94a3b8',align:'right'});
    tx(String(acc.wk0), PW-M-5, y+15, {sz:18,bold:true,col:'#ffffff',align:'right'});
    if(pctChange!==null){
      tx((pctChange>=0?'↑':'↓')+Math.abs(pctChange)+'%  vs W1:'+acc.wk1, PW-M-5, y+21, {sz:8,col:pctChange>=0?'#86efac':'#fca5a5',align:'right'});
    }
    y += 27;

    // Week line
    if(weekStr){ tx('Week ending: '+weekStr, M, y+4, {sz:8,col:'#6b7280'}); y+=7; }

    // ══ NEEDS ATTENTION ═══════════════════════════════════════
    const hasAtt = silentProjects.length>0 || stoppedModules.length>0 || biggestDrops.length>0;
    chk(14); y+=2;
    if(hasAtt){
      fr(M, y, 2.5, 12, '#ef4444');
      fr(M+2.5, y, CW-2.5, 12, '#fff7ed');
      tx('⚠  NEEDS ATTENTION', M+5, y+4.5, {sz:7.5,bold:true,col:'#b45309'});
      const parts=[];
      if(silentProjects.length) parts.push('Silent: '+silentProjects.map(p=>p.name).slice(0,4).join(', '));
      if(stoppedModules.length) parts.push('Stopped: '+stoppedModules.slice(0,3).map(m=>m.module+' on '+m.project).join(' · '));
      if(biggestDrops.length)   parts.push('Drops: '+biggestDrops.slice(0,2).map(d=>d.user+' ↓'+d.drop).join(' · '));
      tx(parts.join('   |   '), M+5, y+9.5, {sz:7.5,col:'#78350f',mw:CW-8});
      y+=15;
    } else {
      fr(M, y, CW, 9, '#f0fdf4'); sr(M, y, CW, 9, '#bbf7d0');
      tx('✅  ALL CLEAR — No significant drops this week', M+CW/2, y+5.5, {sz:8.5,bold:true,col:'#15803d',align:'center'});
      y+=12;
    }

    // ══ MODULE LEGEND ═════════════════════════════════════════
    chk(8); let lx=M; y+=2;
    for(const [k,v] of Object.entries(MOD_COLORS)){
      fr(lx, y+1, 3, 3, v);
      tx(k, lx+4.5, y+4.5, {sz:7.5,col:'#374151'});
      lx += 4.5 + k.length*1.75 + 3;
    }
    y+=8;

    // ══ PROJECTS ══════════════════════════════════════════════
    const activeProjects = snapProjects
      .filter(p=>p.wk0>0||p.wk1>0)
      .sort((a,b)=>{
        if(a.wk0===0&&b.wk0>0) return 1;
        if(b.wk0===0&&a.wk0>0) return -1;
        return b.wk0-a.wk0;
      });

    for(const proj of activeProjects){
      chk(20);
      const pNum = proj.wk1>0 ? Math.round((proj.wk0-proj.wk1)/proj.wk1*100) : null;
      const pStr = pNum!==null ? (pNum>=0?'↑ '+pNum+'%':'↓ '+Math.abs(pNum)+'%') : (proj.wk0>0?'new':'—');
      const pCol = pNum===null?'#6b7280':pNum>=0?'#16a34a':'#dc2626';
      const isSilent = proj.wk0===0&&proj.wk1>0;

      // Project header
      fr(M, y, CW, 8, isSilent?'#fff5f5':'#f9fafb');
      sr(M, y, CW, 8, isSilent?'#fca5a5':'#e5e7eb');
      tx((isSilent?'⚠  ':'')+proj.name, M+3, y+5.5, {sz:9.5,bold:true,col:isSilent?'#dc2626':'#111827',mw:CW*0.58});
      tx(proj.wk1+' → '+proj.wk0+'   '+pStr, PW-M-3, y+5.5, {sz:8.5,col:pCol,align:'right'});
      y+=9;

      // Module activity bar
      const barMods = proj.modules.filter(m=>m.wk0>0).sort((a,b)=>b.wk0-a.wk0);
      const totalBar = barMods.reduce((s,m)=>s+m.wk0,0);
      const BH=5;
      if(barMods.length>0){
        let bx=M;
        for(const bm of barMods){
          const bw=(bm.wk0/totalBar)*CW;
          fr(bx, y, bw, BH, modColor(bm.name));
          if(bw>8) tx(String(bm.wk0), bx+bw/2, y+3.5, {sz:6.5,bold:true,col:'#ffffff',align:'center'});
          bx+=bw;
        }
      } else if(isSilent){
        fr(M, y, CW, BH, '#fee2e2');
        tx('0', M+CW/2, y+3.5, {sz:7.5,bold:true,col:'#dc2626',align:'center'});
      } else {
        fr(M, y, CW, BH, '#f3f4f6');
      }
      y+=BH+2;

      // Module rows
      const sortedMods=[...proj.modules].sort((a,b)=>{
        if(a.isStopped&&!b.isStopped) return 1;
        if(!a.isStopped&&b.isStopped) return -1;
        return b.wk0-a.wk0;
      });
      const stoppedChips=[];
      for(const mod of sortedMods){
        if(mod.wk0===0&&mod.wk1===0) continue;
        if(mod.isStopped){
          const who=mod.users.filter(u=>u.wk1>0).map(u=>u.user+' '+u.wk1).join(', ');
          stoppedChips.push(mod.name+(who?' (was '+who+')':''));
          continue;
        }
        chk(6);
        fr(M+2, y+1.5, 2.5, 2.5, modColor(mod.name));
        tx(mod.name+'  '+mod.wk0, M+6, y+4.5, {sz:8.5,col:'#111827'});
        if(mod.wk1>0){
          const mp=Math.round((mod.wk0-mod.wk1)/mod.wk1*100);
          tx((mp>=0?'↑':'↓')+Math.abs(mp)+'%', M+52, y+4.5, {sz:7.5,col:mp>=0?'#15803d':'#dc2626'});
        }
        const visU=mod.users.filter(u=>u.wk0>0||u.wk1>0).slice(0,3);
        if(visU.length){
          const uStr='— '+visU.map(u=>(u.user||'unassigned')+' '+u.wk0).join('  ');
          tx(uStr, M+68, y+4.5, {sz:7.5,col:'#6b7280',mw:CW-68});
        }
        y+=5.5;
      }
      if(stoppedChips.length){
        chk(6);
        tx('⚠  Stopped this week: '+stoppedChips.join(' · '), M+3, y+4, {sz:7.5,col:'#92400e',mw:CW-5});
        y+=6;
      }
      y+=4;
    }

    // ══ HIGHLIGHTS ════════════════════════════════════════════
    if(topMover||watchOut){
      chk(24); y+=2;
      tx('✨  THIS WEEK\'S HIGHLIGHTS', M, y+4, {sz:7.5,bold:true,col:'#6b7280'});
      y+=8;
      const hw=(CW-4)/2;
      if(topMover){
        fr(M, y, hw, 18, '#f0fdf4'); sr(M, y, hw, 18, '#bbf7d0');
        tx('🏆  TOP MOVER', M+4, y+5.5, {sz:7,bold:true,col:'#15803d'});
        tx(topMover.user, M+4, y+11, {sz:9,bold:true,col:'#111827',mw:hw-6});
        tx(topMover.project+' · '+topMover.module+' ↑'+topMover.pct+'%', M+4, y+16, {sz:7.5,col:'#374151',mw:hw-6});
      }
      if(watchOut){
        const wx=M+hw+4;
        fr(wx, y, hw, 18, '#fff5f5'); sr(wx, y, hw, 18, '#fca5a5');
        tx('⚠  WATCH OUT', wx+4, y+5.5, {sz:7,bold:true,col:'#dc2626'});
        tx(watchOut.project, wx+4, y+11, {sz:9,bold:true,col:'#111827',mw:hw-6});
        tx(watchOut.issue, wx+4, y+16, {sz:7.5,col:'#374151',mw:hw-6});
      }
      y+=20;
    }

    // ══ FOOTER ════════════════════════════════════════════════
    const fy=Math.min(y+4, PH-10);
    fr(M, fy, CW, 0.2, '#e5e7eb');
    tx('Generated by Powerplay Trainer Dashboard  ·  '+new Date().toLocaleDateString('en-IN'), M, fy+5, {sz:7,col:'#9ca3af'});

    const _today = new Date();
    const _dateStr = _today.getFullYear()+'-'+String(_today.getMonth()+1).padStart(2,'0')+'-'+String(_today.getDate()).padStart(2,'0');
    pdf.save('snap_'+acc.name.replace(/[^a-z0-9]/gi,'_')+'_'+_dateStr+'.pdf');
  } finally {
    if (btn) { btn.textContent = '📄 PDF'; btn.disabled = false; }
  }
}

  snapAcc = null;

// ── Drop W0 inline expansion — opens BELOW the account row ────
let _dropExpand = null; // { row: HTMLElement, aId, type }

function showDropPopup(aId, type, evt) {
  evt.stopPropagation();

  // Toggle: clicking the same button again closes the panel
  if (_dropExpand && _dropExpand.aId === aId && _dropExpand.type === type) {
    closeDropPopup();
    return;
  }

  closeDropPopup();

  const entry = window.accRegistry[aId];
  if (!entry) return;

  const isX = type === 'x';
  const users = isX ? (entry.acc.droppedXList || []) : (entry.acc.coldPoolList || []);

  const titleStr = isX
    ? '↓ Newly dropped this week (active W1 → silent W0)'
    : '❄ Full cold pool (active any W1/W2/W3, silent W0)';
  const countStr = `${users.length} user${users.length!==1?'s':''} ${isX?'newly dropped':'in cold pool'}`;

  // Find the account row in the DOM
  const tr = document.querySelector(`tr.row-account[data-aid="${aId}"]`);
  if (!tr) return;

  // Build user grid (multi-column for large lists)
  const userRowsHtml = users.length
    ? users.map(u=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:5px 0;border-bottom:1px solid #1a2535">
        <span style="color:#c8d8e8;font-size:12px">👤 ${u.user||'—'}</span>
        <span style="color:#4a9edd;font-family:monospace;font-size:12px;white-space:nowrap">${u.mobile||''}</span>
      </div>`).join('')
    : `<div style="color:#718096;font-style:italic;font-size:12px;padding:8px 0">No users in this list</div>`;

  const newTr = document.createElement('tr');
  newTr.id = 'drop-expand-row';
  newTr.style.cssText = 'border-bottom:2px solid ' + (isX?'#ed8936':'#4a9edd');
  newTr.innerHTML = `<td colspan="20" style="padding:0;background:#0d1220">
    <div style="padding:12px 24px 14px;background:#111827;border-top:2px solid ${isX?'#ed8936':'#4a9edd'};border-bottom:1px solid #1e2535">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-size:10px;color:${isX?'#ed8936':'#4a9edd'};text-transform:uppercase;letter-spacing:.6px;font-weight:700">${titleStr}</span>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:10px;color:#4a5568">${countStr}</span>
          <button onclick="closeDropPopup()" style="background:#1e2535;border:1px solid #2d3748;border-radius:5px;color:#a0aec0;cursor:pointer;font-size:11px;padding:3px 10px;transition:all .15s" onmouseover="this.style.background='#2d3748'" onmouseout="this.style.background='#1e2535'">✕ Close</button>
        </div>
      </div>
      <div style="columns:${users.length>10?2:1};column-gap:32px">${userRowsHtml}</div>
    </div>
  </td>`;

  tr.after(newTr);
  _dropExpand = { row: newTr, aId, type };

  // Scroll smoothly to show the expansion
  newTr.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDropPopup() {
  if (_dropExpand) {
    _dropExpand.row.remove();
    _dropExpand = null;
  }
}
</script>
