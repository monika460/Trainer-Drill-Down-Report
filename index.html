<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trainer DrillDown — Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;font-size:13px}

/* ── Header ── */
.header{background:linear-gradient(135deg,#1a1f2e,#16213e);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2d3748;position:sticky;top:0;z-index:300}
.header h1{font-size:17px;font-weight:700;color:#fff}
.header-sub{font-size:11px;color:#718096;margin-top:2px}
.sync-bar{display:flex;align-items:center;gap:14px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#48bb78;animation:pulse 1.5s infinite}
.sync-dot.error{background:#fc5353;animation:none}
.sync-dot.loading{background:#ecc94b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-label{font-size:11px;color:#718096}
.countdown{font-size:11px;color:#4299e1;font-weight:600;width:20px;text-align:right}
.last-sync{font-size:10px;color:#4a5568}
.gstats{display:flex;gap:16px}
.gs{text-align:center}.gs .v{font-size:18px;font-weight:700}.gs .l{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.4px}

/* ── Tabs ── */
.tabs{display:flex;background:#1a1f2e;border-bottom:2px solid #2d3748;padding:0 24px;position:sticky;top:57px;z-index:200;overflow-x:auto}
.tab{padding:11px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#718096;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:#e2e8f0}.tab.active{color:#fff;border-bottom-color:#4299e1}
.tab .cnt{background:#2d3748;border-radius:10px;padding:1px 7px;font-size:11px;color:#a0aec0}
.tab.active .cnt{background:#4299e1;color:#fff}

/* ── Controls ── */
.controls{padding:10px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #1a2033;background:#12161f;position:sticky;top:103px;z-index:190}
.pf-btn{padding:4px 11px;border-radius:20px;border:1px solid #2d3748;background:transparent;color:#a0aec0;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pf-btn:hover{color:#fff;border-color:#4a5568}
.pf-btn.active[data-p="ALL"]{background:#4299e1;border-color:#4299e1;color:#fff}
.pf-btn.active[data-p="CRITICAL"]{background:#fc5353;border-color:#fc5353;color:#fff}
.pf-btn.active[data-p="HIGH"]{background:#ed8936;border-color:#ed8936;color:#fff}
.pf-btn.active[data-p="MEDIUM"]{background:#ecc94b;border-color:#ecc94b;color:#1a1a1a}
.pf-btn.active[data-p="LOW"]{background:#4299e1;border-color:#4299e1;color:#fff}
.pf-btn.active[data-p="STABLE_DROP"]{background:#ff6b6b;border-color:#ff6b6b;color:#fff}
.pf-btn.active[data-p="STABLE"]{background:#48bb78;border-color:#48bb78;color:#1a1a1a}
.pf-btn.active[data-p="INACTIVE"]{background:#718096;border-color:#718096;color:#fff}
.search-wrap{margin-left:auto;position:relative}
.search-wrap::before{content:"🔍";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.search-wrap input{background:#1a1f2e;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:5px 10px 5px 28px;font-size:12px;width:200px;outline:none}
.search-wrap input:focus{border-color:#4299e1}

/* ── Summary cards ── */
.sumcards{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px 24px;background:#12161f;border-bottom:1px solid #1a2033}
.sc{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:8px 12px;text-align:center}
.sc .sv{font-size:20px;font-weight:700}.sc .sl{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.sc.crit{border-color:#fc5353;background:#1e0c0c}.sc.crit .sv{color:#fc5353}
.sc.high{border-color:#ed8936;background:#1e1208}.sc.high .sv{color:#ed8936}
.sc.med{border-color:#ecc94b;background:#1c1900}.sc.med .sv{color:#ecc94b}
.sc.low{border-color:#4299e1;background:#0a1420}.sc.low .sv{color:#4299e1}
.sc.stbdrop{border-color:#ff6b6b;background:#1e0a0a}.sc.stbdrop .sv{color:#ff6b6b}
.sc.stb{border-color:#48bb78;background:#0a1e12}.sc.stb .sv{color:#48bb78}
.sc.inact .sv{color:#718096}

/* ── Tree table ── */
.tree-wrap{overflow-x:auto}
.tree-table{width:100%;border-collapse:collapse;min-width:900px}
.tree-table th{padding:8px 10px;text-align:left;color:#4a5568;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1a2033;background:#10141c;white-space:nowrap}
.tree-table th.r{text-align:right}

/* section */
.row-section td{background:#0d1218;color:#3a5070;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;padding:6px 12px;border-bottom:1px solid #1a2033}
.row-section.sd td{background:#1e0c0c;color:#ff6b6b;border-left:3px solid #ff6b6b}

/* account */
.row-account{border-bottom:1px solid #1e2535;cursor:pointer;transition:background .1s}
.row-account:hover{background:#1a2030}
.row-account td{padding:8px 10px;vertical-align:middle}
.row-account.hidden{display:none}
.tog{border:none;border-radius:3px;color:#a0aec0;cursor:pointer;font-size:10px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.acc-tog{width:18px;height:18px;background:#252d3d;margin-right:5px}.acc-tog:hover{background:#4299e1;color:#fff}
.acc-name{font-weight:600;color:#e2e8f0}
.acc-sub{font-size:10px;color:#4a5568;margin-left:5px}

/* Snap button in dashboard */
.snap-row-btn{background:#4299e1;color:#fff;border:none;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background .15s}
.snap-row-btn:hover{background:#2b6cb0}
/* Email button in dashboard */
.email-row-btn{background:#38a169;color:#fff;border:none;padding:4px 8px;border-radius:5px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;transition:background .15s;margin-left:4px}
.email-row-btn:hover{background:#276749}
/* Email Modal */
.email-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;overflow-y:auto;padding:20px}
.email-modal-bg.show{display:flex;align-items:flex-start;justify-content:center}
.email-modal{background:#1a2035;border:1px solid #2d3748;border-radius:12px;width:100%;max-width:720px;padding:24px;position:relative;margin:auto}
.email-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.email-modal-head h2{color:#e2e8f0;font-size:16px;font-weight:700;margin:0}
.email-body-box{background:#0d1117;border:1px solid #2d3748;border-radius:8px;padding:20px;color:#c9d1d9;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:'Segoe UI',sans-serif;max-height:65vh;overflow-y:auto}
.email-body-box b{color:#f0f6fc;font-weight:700}
.email-actions{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
.email-subject-row{display:flex;align-items:center;gap:10px;background:#0d1117;border:1px solid #2d3748;border-radius:6px;padding:8px 14px;margin-bottom:10px}
.email-subject-label{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;font-weight:700}
.email-subject-text{font-size:12px;color:#e2e8f0;font-weight:600;flex:1}
.email-copy-subj-btn{background:#2d3748;color:#a0aec0;border:none;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;white-space:nowrap}
.email-copy-subj-btn:hover{background:#4a5568;color:#fff}
.email-copy-btn{background:#4299e1;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.email-copy-btn:hover{background:#2b6cb0}
.email-status-pill{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;margin-bottom:14px}
.pill-inactive{background:#2d1f0e;color:#ed8936;border:1px solid #ed893655}
.pill-active{background:#0d2018;color:#48bb78;border:1px solid #48bb7855}
.pill-drop{background:#2d0f0f;color:#fc5353;border:1px solid #fc535355}
.pill-stable{background:#0d1a2e;color:#63b3ed;border:1px solid #63b3ed55}

/* project */
.row-project{display:none;border-bottom:1px solid #161d2a;cursor:pointer;transition:background .1s}
.row-project:hover{background:#161d28}.row-project.vis{display:table-row}
.row-project td{padding:6px 10px 6px 32px;vertical-align:middle;background:#0f1420}
.row-project.sdp td{background:#1a0c0c}.row-project.sdp:hover td{background:#200e0e}
.proj-tog{width:16px;height:16px;background:#1e2535;margin-right:4px}.proj-tog:hover{background:#2d6a9f;color:#fff}
.proj-name{color:#c0cfe0;font-size:12px}
.bdrop{background:#2d0f0f;color:#fc5353;border:1px solid #fc535355;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:600}
.bstable{background:#0d2018;color:#48bb78;border:1px solid #48bb7855;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px}
.bstabledrop{background:#2d0f0f;color:#ff6b6b;border:1px solid #ff6b6b;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:700}

/* module */
.row-module{display:none;border-bottom:1px solid #131822}.row-module.vis{display:table-row}
.row-module td{padding:5px 10px 5px 56px;vertical-align:middle;background:#0b1018}
.mod-tog{width:14px;height:14px;background:#1a2030;margin-right:4px}.mod-tog:hover{background:#1a3a5a;color:#fff}
.mod-name{color:#7a9ab0;font-size:11px}

/* event/user */
.row-event{display:none;border-bottom:1px solid #10151f}.row-event.vis{display:table-row}
.row-event td{padding:5px 10px 5px 78px;vertical-align:middle;background:#080c14}
.evt-name{color:#5a7090;font-size:11px;font-family:monospace}
.ubox{margin-top:3px;display:inline-flex;align-items:center;gap:8px;background:#0f1828;border:1px solid #1e3050;border-radius:5px;padding:3px 8px}
.uname{color:#7eb8e0;font-size:12px;font-weight:600}
.uphone{color:#4a9edd;font-size:12px;font-weight:700;letter-spacing:.4px}

/* priority badge */
.pb{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.pb.CRITICAL{background:#2d0f0f;color:#fc5353;border:1px solid #fc5353}
.pb.HIGH{background:#2d1a0a;color:#ed8936;border:1px solid #ed8936}
.pb.MEDIUM{background:#2d2800;color:#ecc94b;border:1px solid #ecc94b}
.pb.LOW{background:#0a1a2d;color:#4299e1;border:1px solid #4299e1}
.pb.STABLE{background:#0d2d18;color:#48bb78;border:1px solid #48bb78}
.pb.STABLE_DROP{background:#2d0f0f;color:#ff6b6b;border:1px solid #ff6b6b}
.pb.INACTIVE{background:#1a1a1a;color:#718096;border:1px solid #718096}

/* numbers */
.nr{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.neg{color:#fc5353}.pos{color:#48bb78}.neu{color:#4a5568}.zred{color:#fc535355}
.sm{font-size:11px}

/* trend */
.trend{display:flex;align-items:flex-end;gap:2px;height:18px;min-width:40px}
.tbar{flex:1;border-radius:1px 1px 0 0;min-height:2px;min-width:5px}

/* loading overlay */
.overlay{position:fixed;inset:0;background:#0f1117ee;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.spinner{width:40px;height:40px;border:3px solid #2d3748;border-top-color:#4299e1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:#1e0c0c;border:1px solid #fc5353;border-radius:10px;padding:20px 28px;max-width:480px;text-align:center}
.err-box h3{color:#fc5353;margin-bottom:8px}
.err-box p{color:#a0aec0;font-size:12px;line-height:1.6}
.panel{display:none}.panel.active{display:block}
.last-disp{font-size:10px;color:#4a6080;white-space:nowrap}
.dispo{font-size:10px;color:#556070;font-style:italic;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ════════ SNAP GENERATOR MODAL STYLES ════════ */
.snap-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:flex-start;justify-content:center;z-index:1000;padding:30px 20px;overflow-y:auto}
.snap-modal-bg.show{display:flex}
.snap-modal{background:#fff;color:#1F2937;border-radius:16px;padding:24px;max-width:680px;width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.snap-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.snap-modal-head h2{font-size:17px;font-weight:600;color:#1F2937}
.snap-close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:#6B7280;line-height:1}

.snap-card{background:#fff;border-radius:16px;padding:22px;max-width:580px;margin:0 auto;border:0.5px solid #E5E7EB}
.snap-header{text-align:center;padding-bottom:14px;border-bottom:0.5px solid #ECECE6}
.snap-brand{font-size:11px;color:#2563EB;letter-spacing:1.5px;font-weight:600}
.snap-acct{font-size:18px;font-weight:600;margin-top:6px;color:#1F2937}
.snap-meta{font-size:12px;color:#6B6B68;margin-top:2px}

.hero-vs{padding:18px 0 16px}
.hero-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.hero-side{text-align:center}
.hero-side-label{font-size:11px;letter-spacing:0.5px;font-weight:500}
.hero-side-num{font-size:44px;font-weight:700;line-height:1.1}
.yest-label{color:#6B7280}.yest-num{color:#6B7280}
.today-label{color:#16A34A;font-weight:600}.today-num{color:#16A34A}
.today-label.down{color:#DC2626}.today-num.down{color:#DC2626}
.hero-arrow{font-size:32px;color:#16A34A}
.hero-arrow.down{color:#DC2626}
.hero-strip{margin-top:12px;padding:8px;border-radius:8px;text-align:center;font-size:13px;font-weight:600}
.hero-strip.up{background:#DCFCE7;color:#14532D}
.hero-strip.down{background:#FEE2E2;color:#7F1D1D}
.hero-strip.flat{background:#F3F4F6;color:#374151}

.watchlist{margin:14px 0 4px;padding:12px 14px;border-radius:10px;border-left:3px solid #F59E0B;background:#FEF3C7}
.watchlist.danger{border-left-color:#DC2626;background:#FEE2E2}
.watchlist.clear{border-left-color:#16A34A;background:#DCFCE7}
.wl-title{font-size:11px;font-weight:700;color:#7C2D12;letter-spacing:0.6px;margin-bottom:6px}
.watchlist.danger .wl-title{color:#7F1D1D}
.watchlist.clear .wl-title{color:#14532D}
.wl-item{font-size:12px;line-height:1.6;color:#1F2937}
.wl-item+.wl-item{margin-top:2px}
.wl-item b{font-weight:700}
.wl-item .lbl{font-weight:700;color:#7C2D12;margin-right:4px}
.watchlist.danger .wl-item .lbl{color:#7F1D1D}

.collapsed-summary{font-size:11.5px;color:#4B5563;margin-top:6px;line-height:1.5}
.collapsed-summary b{color:#1F2937;font-weight:600}
.collapsed-summary .cs-mod{color:#4B5563}

.detail-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#4B5563;cursor:pointer;padding:6px 10px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:999px;margin-bottom:14px;user-select:none}
.detail-toggle input{margin:0;cursor:pointer}
.size-hint{display:inline-block;margin-left:10px;font-size:11px;color:#92400E;background:#FEF3C7;padding:4px 10px;border-radius:999px}
.size-hint.ok{color:#14532D;background:#DCFCE7}

.legend-wrap{padding-top:14px;border-top:0.5px solid #ECECE6}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:14px;font-size:11px;color:#1F2937}
.legend-box{display:inline-block;width:12px;height:9px;border-radius:3px;vertical-align:middle;margin-right:5px}

.project-row{margin-bottom:14px;padding-bottom:12px;border-bottom:0.5px dashed #ECECE6}
.project-row:last-child{border-bottom:none;padding-bottom:0}
.project-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.project-name{font-size:13px;font-weight:600;color:#1F2937}
.project-name.warn{color:#991B1B}
.project-delta{font-size:12px}
.delta-from{color:#6B7280}
.delta-pill{font-weight:700;padding:2px 8px;border-radius:999px;font-size:11px;margin-left:4px}
.delta-pill.up{background:#DCFCE7;color:#14532D}
.delta-pill.down{background:#FEE2E2;color:#991B1B}
.delta-pill.flat{background:#F3F4F6;color:#4B5563}

.stack-bar{display:flex;height:22px;border-radius:6px;overflow:hidden}
.stopped-line{font-size:10px;color:#991B1B;margin-top:6px;line-height:1.4}
.stopped-line strong{font-weight:600}
.stopped-pill{display:inline-block;background:#FEE2E2;color:#991B1B;padding:1px 7px;border-radius:999px;margin-right:4px;margin-top:2px;font-weight:500}
.breakdown{margin-top:8px;font-size:11.5px;line-height:1.65;display:grid;gap:4px}
.bd-line{display:grid;grid-template-columns:10px 1fr;gap:7px;align-items:baseline}
.bd-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-top:4px}
.bd-text{color:#1F2937}
.bd-mod{font-weight:700;color:#111827}
.bd-cnt-big{font-weight:700;color:#111827;font-variant-numeric:tabular-nums;margin-left:2px}
.bd-em-dash{color:#D1D5DB;margin:0 2px}
.bd-sep{color:#D1D5DB;margin:0 5px}
.user-name{color:#1F2937;font-weight:500}
.user-name.drop{color:#991B1B;font-weight:700}
.user-cnt{color:#111827;font-weight:700;font-variant-numeric:tabular-nums;margin-left:2px}
.user-badge{font-size:9.5px;padding:1px 5px;border-radius:999px;font-weight:700;margin-left:3px;vertical-align:1px}
.user-badge.up{background:#DCFCE7;color:#15803D}
.user-badge.down{background:#FEE2E2;color:#991B1B}
.user-badge.new{background:#DBEAFE;color:#1D4ED8}
.mod-badge{font-size:10px;padding:1px 6px;border-radius:999px;font-weight:700;margin-left:5px;vertical-align:1px}
.mod-badge.up{background:#DCFCE7;color:#15803D}
.mod-badge.down{background:#FEE2E2;color:#991B1B}
.mod-badge.new{background:#DBEAFE;color:#1D4ED8}
.bd-unassigned{color:#9CA3AF;font-style:italic}
.mod-seg{display:flex;border-right:2px solid #fff;min-width:0;overflow:hidden}
.mod-seg:last-child{border-right:none}
.user-cell{text-align:center;line-height:28px;color:#fff;font-size:10px;font-weight:600;border-right:1px solid rgba(255,255,255,0.4);min-width:0;overflow:hidden;white-space:nowrap;padding:0 4px;text-overflow:clip}
.user-cell:last-child{border-right:none}

.highlights{margin-top:16px;padding-top:14px;border-top:0.5px solid #ECECE6}
.highlights-title{font-size:11px;font-weight:600;color:#6B6B68;letter-spacing:1px;margin-bottom:10px}
.highlights-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.highlight-card{border-radius:10px;padding:10px 12px}
.highlight-card.good{background:#DCFCE7}
.highlight-card.warn{background:#FEF2F2}
.h-label{font-size:10px;font-weight:700;letter-spacing:0.5px}
.highlight-card.good .h-label{color:#15803D}
.highlight-card.warn .h-label{color:#991B1B}
.h-name{font-size:14px;font-weight:700;margin-top:4px}
.highlight-card.good .h-name{color:#14532D}
.highlight-card.warn .h-name{color:#7F1D1D}
.h-sub{font-size:11px}
.highlight-card.good .h-sub{color:#15803D}
.highlight-card.warn .h-sub{color:#991B1B}

.caption-strip{margin-top:14px;padding:12px 14px;border-radius:0 8px 8px 0}
.caption-strip.healthy{background:#DCFCE7;border-left:3px solid #16A34A;color:#14532D}
.caption-strip.risk{background:#FEF3C7;border-left:3px solid #F59E0B;color:#78350F}
.caption-strip.declining{background:#FEE2E2;border-left:3px solid #DC2626;color:#7F1D1D}

<!-- Loading overlay -->

<!-- Header -->

<div class="header-sub">Manual sync · Query #1468 · Account → Project → Module → Event → User · 📸 Snap per account</div>

<!-- Email Generator Modal -->

<script>
// ── Config ────────────────────────────────────────────────────
const REDASH_URL  = "https://redashv3.getpowerplay.in";
const API_KEY     = "yxqnSo7sT97kxbSPTFKDI0OvjRnMGroE1NGyySTc";
const QUERY_ID    = "1468";
const PARAMS      = {"p_renewal_start": "2026-04-01", "p_renewal_end": "2030-04-30"};
const REFRESH_SEC = 5;

// Column name detection
function detectCols(columns) {
  const names = columns.map(c => c.name.toLowerCase());
  const find = (...opts) => {
    for (const o of opts) {
      const i = names.findIndex(n => n === o || n.includes(o));
      if (i >= 0) return columns[i].name;
    }
    return null;
  };
  return {
    trainer    : find('trainer_email','trainer','trainer_name'),
    org        : find('org_name','organisation_name','organization_name','account_name','org'),
    project    : find('project_name','project'),
    module     : find('module_name','module'),
    event      : find('event_name','event','event_type'),
    user       : find('user_name','username','user'),
    mobile     : find('mobile_number','mobile','phone','phone_number'),
    renewal    : find('renewal_date','renewal'),
    last_disp  : find('last_disposition_date','last_disposition','last_disp'),
    disposition: find('disposition','notes'),
    wk0        : find('wk_0','wk0','week_0'),
    wk1        : find('wk_1','wk1','week_1'),
    wk2        : find('wk_2','wk2','week_2'),
wk3        : find('wk_3','wk3','week_3'),
    active_w0  : find('acct_active_w0','active_w0'),
    cold_pool  : find('acct_cold_pool','cold_pool'),
    new_drops  : find('acct_new_drops_w0','new_drops_w0'),
    connected  : find('acct_connected_w0','connected_w0'),
    coverage   : find('acct_coverage_pct','coverage_pct'),
    cold_users  : find('acct_cold_user_names','cold_user_names'),
    ob_notes    : find('ob_notes','notes'),
    mat_plan    : find('mat_ic_sub_value','mat_ic'),
    tsk_plan    : find('tsk_ic_sub_value','tsk_ic'),
    att_plan    : find('att_ic_sub_value','att_ic'),
    exp_plan    : find('exp_ic_sub_value','exp_ic'),
    others_plan : find('others_ic_sub_value','others_ic'),
    poc_name    : find('poc_name','owner_name'),
  };
}

const TRAINER_NAMES = {'digvijay':'Digvijay','farid':'S Farid','sfarid':'S Farid','s farid':'S Farid','divya':'Divya','ipsita':'Ipsita Tripathy','tripathy':'Ipsita Tripathy'};
function trainerDisplay(email) {
  if (!email) return email;
  const low = email.toLowerCase();
  const prefix = low.split('@')[0];
  for (const [k,v] of Object.entries(TRAINER_NAMES)) {
    if (prefix.includes(k) || low.includes(k)) return v;
  }
  return email.split('@')[0];
}

function processRows(rows, cols) {
  const trainers = {};
  rows.forEach(row => {
    const trainer  = trainerDisplay(row[cols.trainer] || '');
    const org      = row[cols.org]     || 'Unknown';
    const project  = row[cols.project] || 'Unknown';
    const module   = row[cols.module]  || 'Unknown';
    const event    = row[cols.event]   || '';
    const user     = row[cols.user]    || '';
    const mobile   = row[cols.mobile]  || '';
    const renewal  = row[cols.renewal] || '';
    const lastDisp = row[cols.last_disp] || '';
    const dispo    = row[cols.disposition] || '';
    const wk0 = parseInt(row[cols.wk0] || 0);
    const wk1 = parseInt(row[cols.wk1] || 0);
    const wk2 = parseInt(row[cols.wk2] || 0);
    const wk3 = parseInt(row[cols.wk3] || 0);
    if (!trainers[trainer]) trainers[trainer] = {};
    const tMap = trainers[trainer];
    if (!tMap[org]) tMap[org] = { renewal, projects: {},
    activeW0: parseInt(row[cols.active_w0]||0), coldPool: parseInt(row[cols.cold_pool]||0),
    newDrops: parseInt(row[cols.new_drops]||0), connected: parseInt(row[cols.connected]||0),
    coverage: row[cols.coverage]!=null ? Number(row[cols.coverage]) : null,
    coldUsers: (cols.cold_users && Array.isArray(row[cols.cold_users])) ? row[cols.cold_users] : [],
    obNotes:   cols.ob_notes    ? (row[cols.ob_notes]   ||'') : '',
    matPlan:   cols.mat_plan    ? (row[cols.mat_plan]   ||'') : '',
    tskPlan:   cols.tsk_plan    ? (row[cols.tsk_plan]   ||'') : '',
    attPlan:   cols.att_plan    ? (row[cols.att_plan]   ||'') : '',
    expPlan:   cols.exp_plan    ? (row[cols.exp_plan]   ||'') : '',
    othersPlan:cols.others_plan ? (row[cols.others_plan]||'') : '',
    pocName:   cols.poc_name    ? (row[cols.poc_name]   ||'') : '',
    };                                            
    const orgObj = tMap[org];
    if (!orgObj.projects[project]) orgObj.projects[project] = { modules: {} };
    const projObj = orgObj.projects[project];
    if (!projObj.modules[module]) projObj.modules[module] = { events: [] };
    const modObj = projObj.modules[module];
    modObj.events.push({ event, user, mobile, wk0, wk1, wk2, wk3, lastDisp, dispo });
  });

  const result = {};
  Object.entries(trainers).forEach(([tName, tMap]) => {
    const accounts = [];
    Object.entries(tMap).forEach(([orgName, orgData], ai) => {
      const projects = [];
      let accWk0=0, accWk1=0, accWk2=0, accWk3=0;
      Object.entries(orgData.projects).forEach(([projName, projData]) => {
        const modules = [];
        let pWk0=0, pWk1=0, pWk2=0, pWk3=0;
        Object.entries(projData.modules).forEach(([modName, modData]) => {
          let mWk0=0, mWk1=0, mWk2=0, mWk3=0;
          const events = modData.events.map(e => {
            mWk0+=e.wk0; mWk1+=e.wk1; mWk2+=e.wk2; mWk3+=e.wk3;
            return e;
          });
          const mDiff = mWk0 - mWk1;
          const mPct  = mWk1 > 0 ? ((mDiff/mWk1)*100).toFixed(1)+'%' : '';
          pWk0+=mWk0; pWk1+=mWk1; pWk2+=mWk2; pWk3+=mWk3;
          modules.push({ name:modName, wk0:mWk0, wk1:mWk1, wk2:mWk2, wk3:mWk3, diff:mDiff, pct:mPct, events });
        });
        const pDiff = pWk0 - pWk1;
        const pPct  = pWk1 > 0 ? ((pDiff/pWk1)*100).toFixed(1)+'%' : '';
        const isDrop = pWk0 < pWk1;
        accWk0+=pWk0; accWk1+=pWk1; accWk2+=pWk2; accWk3+=pWk3;
        projects.push({ name:projName, wk0:pWk0, wk1:pWk1, wk2:pWk2, wk3:pWk3, diff:pDiff, pct:pPct, isDrop, modules });
      });
      const diff = accWk0 - accWk1;
      const pct  = accWk1 > 0 ? (diff/accWk1)*100 : 0;
      const pctStr = accWk1 > 0 ? pct.toFixed(1)+'%' : '';
      let priority;
      if (accWk0 === 0 && accWk1 > 0) priority = 'CRITICAL';
      else if (pct <= -75)             priority = 'HIGH';
      else if (pct <= -25)             priority = 'MEDIUM';
      else if (pct < 0)                priority = 'LOW';
      else if (accWk0 === 0)           priority = 'INACTIVE';
      else                             priority = 'STABLE';
      const effP = (priority === 'STABLE' && accWk0 === 0) ? 'STABLE_DROP' : priority;
      accounts.push({
        num: ai+1, name:orgName, renewal:orgData.renewal, trainer: tName,
        wk0:accWk0, wk1:accWk1, wk2:accWk2, wk3:accWk3,
  diff, pct:pctStr, priority: effP, projects,
        activeW0:orgData.activeW0, coldPool:orgData.coldPool, newDrops:orgData.newDrops, connected:orgData.connected, coverage:orgData.coverage, coldUsers:orgData.coldUsers||[],
        ob_notes:orgData.obNotes||'', mat_plan:orgData.matPlan||'', tsk_plan:orgData.tskPlan||'',
        att_plan:orgData.attPlan||'', exp_plan:orgData.expPlan||'', others_plan:orgData.othersPlan||'', poc_name:orgData.pocName||''
      });   
    });
    result[tName] = { accounts };
  });
  return result;
}

const PRIO_ORDER = ['CRITICAL','HIGH','MEDIUM','LOW','STABLE_DROP','STABLE','INACTIVE'];
function pb(p){ return `<span class="pb ${p}">${p.replace('_',' ')}</span>`; }
function coveragePill(pct){
  if(pct==null||isNaN(pct)) return '<span style="color:#4a5568">-</span>';
  var p=Math.round(Number(pct));
  if(p<30) return '<span class="pb" style="background:#2d0f0f;color:#fc5353;border:1px solid #fc5353">'+p+'%</span>';
  if(p<60) return '<span class="pb" style="background:#2d1a0a;color:#ed8936;border:1px solid #ed8936">'+p+'%</span>';
  return '<span class="pb" style="background:#0d2d18;color:#48bb78;border:1px solid #48bb78">'+p+'%</span>';
}
function trend(w0,w1,w2,w3){
  const v=[w3,w2,w1,w0], mx=Math.max(...v,1);
  const c=['#3a4a5a','#4a5a6a','#8899aa',w0===0?'#fc5353':(w0>=w1?'#48bb78':'#ed8936')];
  return `<div class="trend">${v.map((n,i)=>`<div class="tbar" style="height:${Math.max(2,Math.round(n/mx*18))}px;background:${c[i]}"></div>`).join('')}</div>`;
}
function nTD(v, zr=false){
  if(v===null||v===undefined) return `<td class="nr neu">—</td>`;
  return `<td class="nr ${zr&&v===0?'zred':''}">${v}</td>`;
}
function dTD(v){
  if(!v&&v!==0) return `<td class="nr neu">—</td>`;
  return `<td class="nr ${v<0?'neg':v>0?'pos':'neu'}">${v>0?'+':''}${v}</td>`;
}
function pTD(v){
  if(!v) return `<td class="nr neu sm">—</td>`;
  return `<td class="nr ${v.startsWith('-')?'neg':'pos'} sm">${v}</td>`;
}

// Global lookup so the snap button can find its account
const ACCOUNT_REGISTRY = {};

function renderPanel(tName, tData, tid){
  const accs = tData.accounts;
  const cnt={};
  PRIO_ORDER.forEach(p=>cnt[p]=0);
  accs.forEach(a=>cnt[a.priority]=(cnt[a.priority]||0)+1);

  let html = `<div class="sumcards">
    <div class="sc crit"><div class="sv">${cnt.CRITICAL||0}</div><div class="sl">🔴 Critical</div></div>
    <div class="sc high"><div class="sv">${cnt.HIGH||0}</div><div class="sl">🟠 High</div></div>
    <div class="sc med"><div class="sv">${cnt.MEDIUM||0}</div><div class="sl">🟡 Medium</div></div>
    <div class="sc low"><div class="sv">${cnt.LOW||0}</div><div class="sl">🔵 Low</div></div>
    <div class="sc stbdrop"><div class="sv">${cnt.STABLE_DROP||0}</div><div class="sl">🔴 Stable Drop</div></div>
    <div class="sc stb"><div class="sv">${cnt.STABLE||0}</div><div class="sl">✅ Stable</div></div>
    <div class="sc inact"><div class="sv">${cnt.INACTIVE||0}</div><div class="sl">⚫ Inactive</div></div>
  </div>
  <div class="controls" id="ctrl-${tid}">
    <button class="pf-btn active" data-t="${tid}" data-p="ALL">All (${accs.length})</button>
    <button class="pf-btn" data-t="${tid}" data-p="CRITICAL">🔴 Critical</button>
    <button class="pf-btn" data-t="${tid}" data-p="HIGH">🟠 High</button>
    <button class="pf-btn" data-t="${tid}" data-p="MEDIUM">🟡 Medium</button>
    <button class="pf-btn" data-t="${tid}" data-p="LOW">🔵 Low</button>
    <button class="pf-btn" data-t="${tid}" data-p="STABLE_DROP">🔴 Stable Drop</button>
    <button class="pf-btn" data-t="${tid}" data-p="STABLE">✅ Stable</button>
    <button class="pf-btn" data-t="${tid}" data-p="INACTIVE">⚫ Inactive</button>
    <div class="search-wrap"><input type="text" placeholder="Search account…" data-t="${tid}" class="acc-search"></div>
  </div>
  <div class="tree-wrap"><table class="tree-table">
    <thead><tr>
      <th style="width:22px"></th><th>#</th>
      <th>Account / Project / Module / Event</th>
      <th class="r">Wk 0</th><th class="r">Wk 1</th><th class="r">Wk 2</th><th class="r">Wk 3</th>
      <th class="r">Diff</th><th class="r">%</th><th>Trend</th>
<th>Priority</th><th class="r" style="color:#9FB8E0">Active W0</th><th class="r"
style="color:#F0997B">Drop W0</th><th class="r" style="color:#5DCAA5">Conn. W0</th>
<th class="r" style="color:#FAC775">Cov. W0</th><th>Snap</th><th>Last Dispos.</th>
<th>Note</th>      
    </tr></thead><tbody id="tbody-${tid}">`;

  const SECT = {
    CRITICAL:'🔴 CRITICAL — Immediate Action Required',
    HIGH:'🟠 HIGH — Act This Week',
    MEDIUM:'🟡 MEDIUM — Monitor Closely',
    LOW:'🔵 LOW DROP — Watch',
    STABLE_DROP:'🔴 STABLE — Zero Activity This Week',
    STABLE:'✅ STABLE — Active This Week',
    INACTIVE:'⚫ INACTIVE ACCOUNTS'
  };

  const sorted = [...accs].sort((a,b)=>PRIO_ORDER.indexOf(a.priority)-PRIO_ORDER.indexOf(b.priority));
  let lastSect = null;

  sorted.forEach((acc, ai) => {
    const aId = `${tid}-a${ai}`;
    ACCOUNT_REGISTRY[aId] = acc;
    const ep = acc.priority;
    if (ep !== lastSect) {
      html += `<tr class="row-section${ep==='STABLE_DROP'?' sd':''}" data-sect="${ep}"><td colspan="18">${SECT[ep]||ep}</td></tr>`;
      lastSect = ep;
    }
    const hasProj = acc.projects.length > 0;
    html += `<tr class="row-account" data-p="${ep}" data-name="${acc.name.toLowerCase()}" data-aid="${aId}" onclick="toggleAcc('${aId}',event)">
      <td><button class="tog acc-tog" id="btn-${aId}">${hasProj?'+':'·'}</button></td>
      <td style="color:#4a5568;font-size:11px">${acc.num}</td>
      <td><span class="acc-name">${acc.name}</span><span class="acc-sub">${acc.projects.length}p</span>
        ${acc.renewal?`<span style="font-size:10px;color:#4a5568;margin-left:5px">🗓 ${acc.renewal}</span>`:''}</td>
      ${nTD(acc.wk0,true)}${nTD(acc.wk1)}${nTD(acc.wk2)}${nTD(acc.wk3)}
      ${dTD(acc.diff)}${pTD(acc.pct)}
      <td>${trend(acc.wk0,acc.wk1,acc.wk2,acc.wk3)}</td>
      <td>${pb(ep)}</td>
      <td class="nr">${acc.activeW0??'—'}</td>
<td class="nr" style="color:#ed8936;font-weight:500;cursor:pointer" onclick="event.stopPropagation();toggleDropUsers('${aId}')" title="Click to show drop user call queue">${acc.newDrops??0}/${acc.coldPool??0}</td>      
      <td class="nr">${acc.connected??'—'}</td>
      <td>${coveragePill(acc.coverage)}</td>
      <td><button class="snap-row-btn" onclick="event.stopPropagation();openSnap('${aId}')">📸 Snap</button><button class="email-row-btn" onclick="event.stopPropagation();openEmail('${aId}')" title="Generate progress email">📧</button></td>
      <td></td><td></td>
    </tr>`;

if (acc.coldUsers && acc.coldUsers.length > 0) {
      var pills = acc.coldUsers.map(function(u){
        // If it's a raw user ID (USRxxx format), display it more readably
        var display = /^USR[a-zA-Z0-9]{6,}$/.test(u) ? ('User ' + u.substring(3, 9).toUpperCase()) : u;
        return '<div style="font-size:11px;background:#2A1810;color:#F0997B;padding:5px 10px;border-radius:4px;border-left:3px solid #ed8936">' + display + '</div>';
      }).join('');
      html += '<tr class="row-drop-users" id="drop-'+aId+'" style="display:none"><td colspan="18" style="background:#0a0e16;padding:8px 12px 10px 80px;border-bottom:1px solid #1a2033"><div style="font-size:9px;color:#7C8AA3;letter-spacing:0.4px;margin-bottom:8px;text-transform:uppercase">Drop users (W0) — call queue</div><div style="display:flex;flex-direction:column;gap:6px;max-width:420px">'+pills+'</div></td></tr>';
    }
    acc.projects.forEach((proj, pi) => {  
      const pId = `${aId}-p${pi}`;
      const isSD = !proj.isDrop && proj.wk0 === 0;
      const sym  = proj.isDrop ? `<span style="color:#fc5353;margin-right:3px">⚠</span>` : isSD ? `<span style="color:#ff6b6b;margin-right:3px">⚠</span>` : `<span style="color:#48bb78;margin-right:3px">▲</span>`;
      const bdg  = proj.isDrop ? `<span class="bdrop">DROP</span>` : isSD ? `<span class="bstabledrop">STABLE DROP</span>` : `<span class="bstable">STABLE</span>`;
      const hasMod = proj.modules.length > 0;

          ${nTD(mod.wk0,true)}${nTD(mod.wk1)}${nTD(mod.wk2)}${nTD(mod.wk3)}
          ${dTD(mod.diff)}${pTD(mod.pct)}
          <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
        </tr>`;
        mod.events.forEach(evt => {
          html += `<tr class="row-event" data-mod="${mId}">
            <td></td><td></td>
            <td>
              <div class="evt-name">⚡ ${evt.event}</div>
              <div class="ubox">
                <span>👤</span><span class="uname">${evt.user||'—'}</span>
                ${evt.mobile?`<span style="color:#2d3f50">|</span><span>📞</span><span class="uphone">${evt.mobile}</span>`:''}
              </div>
            </td>
            ${nTD(evt.wk0,true)}${nTD(evt.wk1)}${nTD(evt.wk2)}${nTD(evt.wk3)}
            ${dTD(evt.wk0-evt.wk1)}
            <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
            <td class="last-disp">${(evt.lastDisp||'—').slice(0,10)}</td>
            <td class="dispo" title="${(evt.dispo||'').replace(/"/g,"'")}">${evt.dispo||'—'}</td>
          </tr>`;
        });
      });
    });
  });

  html += `</tbody></table></div>`;
  return html;
}

let countdown = REFRESH_SEC;
let currentTab = null;
let initialized = false;

async function fetchAndRender() {
  const dot = document.getElementById('sync-dot');
  const btn = document.getElementById('sync-btn');
  dot.className = 'sync-dot loading';
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Syncing...'; btn.style.opacity = '0.7'; btn.style.cursor = 'wait'; }
  try {  
    const paramStr = Object.entries(PARAMS).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
    const url = `/api/redash?${paramStr}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    const json = await res.json();
    const qr = json.query_result || json;
    const data = qr.data || qr;
    const columns = data.columns || [];
    const rows    = data.rows    || [];
    if (!columns.length) throw new Error('No columns returned from Redash');
    const cols = detectCols(columns);
    const trainers = processRows(rows, cols);
    if (!initialized) {
      buildUI(trainers);
      initialized = true;
      document.getElementById('overlay').style.display = 'none';
    } else {
      updateUI(trainers);
    }
    dot.className = 'sync-dot';
    document.getElementById('last-sync').textContent = 'Last synced: ' + new Date().toLocaleTimeString();
  } catch (err) {
    dot.className = 'sync-dot error';
    if (!initialized) showError(err);
    console.error('Redash fetch error:', err);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '🔄 Sync now'; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }
  }
  countdown = REFRESH_SEC;
}
function showError(err) {
  document.getElementById('overlay').innerHTML = `
    <div class="err-box">
      <h3>⚠ Cannot connect to Redash</h3>
      <p>${err.message}</p>
      <p style="margin-top:10px">This usually means <strong>CORS is blocked</strong>.<br>
      Ask your Redash admin to allow cross-origin requests, or open this file via a local web server:<br>
      <code style="background:#0f1117;padding:4px 8px;border-radius:4px;margin-top:6px;display:inline-block">
        python3 -m http.server 8080

}

function buildUI(trainers) {
  const tabs = document.getElementById('tabs');
  const app  = document.getElementById('app');
  tabs.innerHTML = ''; app.innerHTML = '';
  currentTab = null;
  // clear registry on rebuild
  for (const k in ACCOUNT_REGISTRY) delete ACCOUNT_REGISTRY[k];

  Object.entries(trainers).forEach(([tName, tData], i) => {
    const tid = tName.replace(/[^a-z0-9]/gi,'_');
    const crit = tData.accounts.filter(a=>a.priority==='CRITICAL').length;
    const high = tData.accounts.filter(a=>a.priority==='HIGH').length;
    const sd   = tData.accounts.filter(a=>a.priority==='STABLE_DROP').length;
    const urg  = crit>0?`<span style="color:#fc5353;font-weight:700"> ${crit}🔴</span>`:
                 high>0?`<span style="color:#ed8936"> ${high}🟠</span>`:'';
    const sdBadge = sd>0?`<span style="color:#ff6b6b;font-size:10px"> ${sd}⚠</span>`:'';
    const tab = document.createElement('div');
    tab.className = 'tab' + (i===0?' active':'');
    tab.dataset.tid = tid;
    tab.innerHTML = `${tName} <span class="cnt">${tData.accounts.length}</span>${urg}${sdBadge}`;
    tab.addEventListener('click', () => switchTab(tid));
    tabs.appendChild(tab);
    const panel = document.createElement('div');
    panel.className = 'panel' + (i===0?' active':'');
    panel.id = 'panel-' + tid;
    panel.innerHTML = renderPanel(tName, tData, tid);
    app.appendChild(panel);
    if (i===0) currentTab = tid;
  });
  updateGlobalStats(trainers);
}

const FALLBACK_PALETTE = ['#2563EB','#F97316','#16A34A','#9333EA','#0891B2','#EC4899','#F59E0B','#10B981','#6366F1','#84CC16','#DC2626','#7C3AED'];

function getModuleColor(name, map) {
  if (map[name]) return map[name];
  const key = (name||'').toLowerCase().trim();
  if (MODULE_COLORS[key]) { map[name] = MODULE_COLORS[key]; return MODULE_COLORS[key]; }
  const used = Object.values(map);
  for (const c of FALLBACK_PALETTE) { if (!used.includes(c)) { map[name] = c; return c; } }
  map[name] = FALLBACK_PALETTE[Object.keys(map).length % FALLBACK_PALETTE.length];
  return map[name];
}

// Convert a dashboard account → snap-ready account
function dashboardToSnap(acc) {
  const totalThis = acc.wk0;
  const totalLast = acc.wk1;
  // Per-project: aggregate users from events
  const projects = acc.projects.map(p => {
    const modulesActive = [];
    const modulesStopped = [];
    p.modules.forEach(m => {
      // aggregate users from events
      const usersMap = {};
      m.events.forEach(e => {
        const raw = (e.user||'').toString().trim();
        if (!raw || raw.toLowerCase()==='unknown' || raw.toLowerCase()==='null') return;
        if (!usersMap[raw]) usersMap[raw] = { name: raw, thisWk: 0, lastWk: 0 };
        usersMap[raw].thisWk += (e.wk0||0);
        usersMap[raw].lastWk += (e.wk1||0);
      });
      if (m.wk0 > 0) {
        const users = Object.values(usersMap).filter(u=>u.thisWk>0).sort((a,b)=>b.thisWk-a.thisWk);
        modulesActive.push({ name: m.name, today: m.wk0, yest: m.wk1, users });
      } else if (m.wk1 > 0) {
        const lastWkUsers = Object.values(usersMap).filter(u=>u.lastWk>0).sort((a,b)=>b.lastWk-a.lastWk);
        modulesStopped.push({ name: m.name, lastWk: m.wk1, lastWkUsers });
      }
    });
    modulesActive.sort((a,b)=>b.today-a.today);
    modulesStopped.sort((a,b)=>b.lastWk-a.lastWk);
    const pct = p.wk1 === 0 ? (p.wk0 > 0 ? 100 : 0) : Math.round(((p.wk0 - p.wk1) / p.wk1) * 100);
    const warn = p.wk0 === 0 || pct < -30;
    const topModule = modulesActive[0];
    const topUser = topModule && topModule.users && topModule.users[0] ? topModule.users[0] : null;
    const absChange = Math.abs(p.wk0 - p.wk1);
    const significant = p.wk0 === 0 || Math.abs(pct) >= 10 || absChange >= 20 || modulesStopped.length > 0;
    return {
      name: p.name, today: p.wk0, yest: p.wk1,
      modules: modulesActive, stoppedModules: modulesStopped,
      warn, pct,
      topModuleName: topModule?.name, topUserName: topUser?.name, topUserCount: topUser?.thisWk,
      significant
    };
  })
  .filter(p => p.today > 0 || p.yest > 0)
  .sort((a,b)=>{
    if (a.today===0 && b.today===0) return b.yest - a.yest;
    if (a.today===0) return 1;
    if (b.today===0) return -1;
    return b.today - a.today;
  });

  // Account-level user aggregation for top mover
  const allUsersMap = {};
  acc.projects.forEach(p => p.modules.forEach(m => m.events.forEach(e => {
    const raw = (e.user||'').toString().trim();
    if (!raw || raw.toLowerCase()==='unknown' || raw.toLowerCase()==='null') return;
    if (!allUsersMap[raw]) allUsersMap[raw] = { name: raw, thisWk: 0, lastWk: 0, topProject: p.name, topModule: m.name };
    allUsersMap[raw].thisWk += (e.wk0||0);
    allUsersMap[raw].lastWk += (e.wk1||0);
  })));
  const usersArr = Object.values(allUsersMap);
  let topMover = null, bestDelta = -Infinity;
  usersArr.forEach(u => {
    const d = u.thisWk - u.lastWk;
    if (u.thisWk > 0 && d > bestDelta) {
      bestDelta = d;
      const pct = u.lastWk === 0 ? 100 : Math.round(((u.thisWk - u.lastWk) / u.lastWk) * 100);
      topMover = { name: u.name, project: u.topProject, module: u.topModule, pct: Math.max(pct, 0) };
    }
  });

  // Watch out
  let watchOut = null;
  for (const p of projects) {
    for (const s of (p.stoppedModules||[])) {
      if (!watchOut) { watchOut = { project: p.name, issue: `${s.name} stopped` }; break; }
    }
    if (watchOut) break;
  }
  if (!watchOut) {
    let worstPct = 0;
    for (const p of projects) {
      if (p.yest > 0) {
        const pPct = (p.today - p.yest) / p.yest;
        if (pPct < worstPct && pPct < -0.3) {
          worstPct = pPct;
          watchOut = { project: p.name, issue: `Down ${Math.abs(Math.round(pPct*100))}% week-on-week` };
        }
      }
    }
  }

  const silentProjects = projects.filter(p => p.today===0 && p.yest>0).map(p => ({ name: p.name, lastWk: p.yest }));
  const stoppedModulesFlat = [];
  projects.forEach(p => (p.stoppedModules||[]).forEach(s => {
    stoppedModulesFlat.push({ project: p.name, module: s.name, lastWk: s.lastWk, lastWkUsers: s.lastWkUsers });
  }));
  stoppedModulesFlat.sort((a,b)=>b.lastWk - a.lastWk);

  const allUserDrops = [];
  projects.forEach(p => (p.modules||[]).forEach(m => (m.users||[]).forEach(u => {
    const d = u.thisWk - u.lastWk;
    if (d <= -5 && u.lastWk > 0) allUserDrops.push({ name: u.name, project: p.name, module: m.name, delta: d, thisWk: u.thisWk, lastWk: u.lastWk });
  })));
  allUserDrops.sort((a,b)=>a.delta - b.delta);
  const topDrops = allUserDrops.slice(0,4);

  return {
    name: acc.name, trainer: acc.trainer, renewal: acc.renewal,
    totalUsers: usersArr.length,
    activeUsersToday: usersArr.filter(u=>u.thisWk>0).length,
    totalToday: totalThis, totalYest: totalLast,
    projects, topMover, watchOut, moduleColors: {},
    silentProjects, stoppedModulesFlat, topDrops
  };
}

function pctChange(today, yest) {
  if (yest === 0) return today > 0 ? 100 : 0;
  return Math.round(((today - yest) / yest) * 100);

function classifyHealth(a) {

  if (pct < -30) return 'risk';
  return 'healthy';
}

function buildWatchList(a) {
  const hasSilent = a.silentProjects && a.silentProjects.length > 0;
  const hasStopped = a.stoppedModulesFlat && a.stoppedModulesFlat.length > 0;
  const hasDrops = a.topDrops && a.topDrops.length > 0;
  const isClear = !hasSilent && !hasStopped && !hasDrops;
  if (isClear) {
    return `<div class="watchlist clear"><div class="wl-title">✅ ALL CLEAR THIS WEEK</div><div class="wl-item">No silent projects, no stopped modules, no significant drops. Team firing on all cylinders.</div></div>`;
  }
  const danger = hasSilent || a.stoppedModulesFlat.length >= 5;
  const items = [];
  if (hasSilent) {
    const txt = a.silentProjects.slice(0,3).map(p=>`<b>${p.name}</b> (was ${p.lastWk})`).join(', ');
    const more = a.silentProjects.length>3?` +${a.silentProjects.length-3} more`:'';
    items.push(`<div class="wl-item"><span class="lbl">Silent projects:</span>${txt}${more}</div>`);
  }
  if (hasStopped) {
    const txt = a.stoppedModulesFlat.slice(0,3).map(s=>{
      const by = s.lastWkUsers && s.lastWkUsers[0]?` by <b>${s.lastWkUsers[0].name}</b>`:'';
      return `<b>${s.module}</b> on ${s.project} (was ${s.lastWk}${by})`;
    }).join(' · ');
    const more = a.stoppedModulesFlat.length>3?` +${a.stoppedModulesFlat.length-3} more`:'';
    items.push(`<div class="wl-item"><span class="lbl">Modules stopped:</span>${txt}${more}</div>`);
  }
  if (hasDrops) {
    const txt = a.topDrops.slice(0,3).map(d=>`<b>${d.name}</b> ↓${Math.abs(d.delta)} (${d.module} on ${d.project})`).join(' · ');
    items.push(`<div class="wl-item"><span class="lbl">Biggest drops:</span>${txt}</div>`);
  }
  return `<div class="watchlist ${danger?'danger':''}"><div class="wl-title">⚠ NEEDS ATTENTION</div>${items.join('')}</div>`;
}

function buildCollapsedProject(p) {
  const topInfo = p.topUserName
    ? `<b>${p.topUserName}</b> ${p.topUserCount} leading on <span class="cs-mod">${p.topModuleName}</span>`
    : `${p.modules ? p.modules.length : 0} modules`;
  const stoppedHint = (p.stoppedModules && p.stoppedModules.length>0)
    ? ` · <span style="color:#991B1B">${p.stoppedModules.length} stopped</span>` : '';
  return `<div class="collapsed-summary">${p.modules.length} modules · ${topInfo}${stoppedHint}</div>`;
}

function moduleCellLabel(m, approxWidthPx) {
  if (approxWidthPx < 22) return '';
  return `${m.today}`;
}

function buildStackBar(project, maxToday, accModColors) {
  if (!project.modules || project.modules.length === 0) {
    return `<div style="height:22px;background:#FEE2E2;border-radius:6px;width:8%;display:flex;align-items:center;justify-content:center;color:#991B1B;font-size:11px;font-weight:600;padding:0 6px">0</div>`;
  }
  const projectWidthPct = Math.max((project.today/maxToday)*100, 6);
  const barPx = 536 * (projectWidthPct/100);
  const segments = project.modules.map(m => {
    const modWidthPct = (m.today/project.today)*100;
    const modPx = barPx * (modWidthPct/100);
    const color = getModuleColor(m.name, accModColors);
    const label = moduleCellLabel(m, modPx);
    return `<div class="mod-seg" style="width:${modWidthPct}%;background:${color}"><div class="user-cell">${label}</div></div>`;
  }).join('');
  return `<div class="stack-bar" style="width:${projectWidthPct}%">${segments}</div>`;
}

function buildBreakdown(project, accModColors) {
  if (!project.modules || project.modules.length === 0) return '';
  const lines = project.modules.map(m => {
    const color = getModuleColor(m.name, accModColors);
    const modDelta = m.today - (m.yest||0);
    const modPct = m.yest === 0 ? (m.today>0?100:0) : Math.round((modDelta/m.yest)*100);
    const badgeCls = modDelta>0?'up':modDelta<0?'down':'';
    const modBadge = modDelta !== 0 && m.yest > 0
      ? `<span class="mod-badge ${badgeCls}">${modDelta>0?'↑':'↓'}${Math.abs(modPct)}%</span>`
      : (m.yest === 0 ? `<span class="mod-badge new">new module</span>` : '');
    let usersText = '';
    if (m.users && m.users.length > 0) {
      usersText = m.users.map(u => {
        const d = u.thisWk - u.lastWk;
        let badge = '', nameClass = 'user-name';
        if (u.lastWk === 0 && u.thisWk > 0) badge = `<span class="user-badge new">new</span>`;
        else if (d < 0) { badge = `<span class="user-badge down">↓${Math.abs(d)}</span>`; nameClass = 'user-name drop'; }
        else if (d > 0) badge = `<span class="user-badge up">↑${d}</span>`;
        return `<span class="${nameClass}">${u.name}</span> <span class="user-cnt">${u.thisWk}</span>${badge}`;
      }).join('<span class="bd-sep">·</span>');
    } else {
      usersText = `<span class="bd-unassigned">unassigned</span>`;
    }
    return `<div class="bd-line"><span class="bd-dot" style="background:${color}"></span><span class="bd-text"><span class="bd-mod">${m.name}</span> <span class="bd-cnt-big">${m.today}</span>${modBadge} <span class="bd-em-dash">—</span> ${usersText}</span></div>`;
  }).join('');
  return `<div class="breakdown">${lines}</div>`;
}

function renderSnapCard(a) {
  const health = classifyHealth(a);
  const pct = pctChange(a.totalToday, a.totalYest);
  const isDown = pct < 0;
  const isFlat = pct === 0;
  a.moduleColors = {};
  const maxToday = Math.max(...a.projects.map(p=>p.today), 1);

  const projectsHtml = a.projects.map(p => {
    const pPct = pctChange(p.today, p.yest);
    const pPctClass = pPct>0?'up':pPct<0?'down':'flat';
    const arrow = pPct>0?'↑':pPct<0?'↓':'–';
    const nameClass = p.warn?'project-name warn':'project-name';
    const warnPrefix = p.warn?'⚠ ':'';
    let stoppedHtml = '';
    if (p.stoppedModules && p.stoppedModules.length > 0) {
      const pills = p.stoppedModules.map(s=>{
        let byText = '';
        if (s.lastWkUsers && s.lastWkUsers.length > 0) {
          byText = ' by ' + s.lastWkUsers.map(u=>`<b>${u.name}</b> ${u.lastWk}`).join(', ');
        }
        return `<span class="stopped-pill">${s.name} (was ${s.lastWk}${byText})</span>`;
      }).join('');
      stoppedHtml = `<div class="stopped-line"><strong>⚠ Stopped this week:</strong> ${pills}</div>`;
    }
    const expanded = showFullDetail || p.significant;
    const headerHtml = `<div class="project-head"><div class="${nameClass}">${warnPrefix}${p.name}</div><div class="project-delta"><span class="delta-from">${p.yest} →</span> <strong style="color:${p.warn?'#991B1B':'#1F2937'}">${p.today}</strong><span class="delta-pill ${pPctClass}">${arrow} ${Math.abs(pPct)}%</span></div></div>`;
    if (expanded) {
      return `<div class="project-row">${headerHtml}${buildStackBar(p, maxToday, a.moduleColors)}${buildBreakdown(p, a.moduleColors)}${stoppedHtml}</div>`;
    } else {
      return `<div class="project-row">${headerHtml}${buildStackBar(p, maxToday, a.moduleColors)}${buildCollapsedProject(p)}</div>`;
    }
  }).join('');

  const moduleSet = {};
  a.projects.forEach(p=>{
    (p.modules||[]).forEach(m => { moduleSet[m.name] = (moduleSet[m.name]||0) + m.today; });
    (p.stoppedModules||[]).forEach(m => { if (!moduleSet[m.name]) moduleSet[m.name] = 0; });
  });
  const allModulesSorted = Object.entries(moduleSet).sort((x,y)=>y[1]-x[1]);
  const legendHtml = allModulesSorted.map(([name])=>{
    const c = getModuleColor(name, a.moduleColors);
    return `<span><span class="legend-box" style="background:${c}"></span>${name}</span>`;
  }).join('');

  const captionTier = pickCaptionTier(a, pct, health);
  const pool = captions[captionTier];
  const tpl = pool[Math.floor(Math.random()*pool.length)];
  let caption = tpl
    .replace('{customer_name}', a.name.split(' ')[0])
    .replace('{today}', a.totalToday)
    .replace('{yest}', a.totalYest)
    .replace(/{pct}/g, Math.abs(pct))
    .replace('{top_user}', a.topMover?.name || 'the team')
    .replace('{top_project}', a.topMover?.project || 'site')
    .replace('{watch_project}', a.watchOut?.project || '')
    .replace('{watch_issue}', a.watchOut?.issue || '');
  if (a.silentProjects.length > 0) {
    caption += ` Note: ${a.silentProjects[0].name} went silent (was ${a.silentProjects[0].lastWk}).`;
  } else if (a.topDrops.length > 0) {
    const d = a.topDrops[0];
    caption += ` Note: ${d.name} dropped ${Math.abs(d.delta)} on ${d.module} (${d.project}).`;
  } else if (a.stoppedModulesFlat.length > 0) {
    const s = a.stoppedModulesFlat[0];
    caption += ` Note: ${s.module} on ${s.project} stopped this week.`;
  }
  document.getElementById('captionText').value = caption;

  const highlightsHtml = `<div class="highlights-grid">
    ${a.topMover ? `<div class="highlight-card good"><div class="h-label">🏆 TOP MOVER</div><div class="h-name">${a.topMover.name}</div><div class="h-sub">${a.topMover.project} · ${a.topMover.module} ↑${a.topMover.pct}%</div></div>` : `<div class="highlight-card warn"><div class="h-label">⚠ NO MOVERS</div><div class="h-name">Team silent</div><div class="h-sub">No activity to highlight</div></div>`}
    ${a.watchOut ? `<div class="highlight-card warn"><div class="h-label">⚠ WATCH OUT</div><div class="h-name">${a.watchOut.project}</div><div class="h-sub">${a.watchOut.issue}</div></div>` : `<div class="highlight-card good"><div class="h-label">✅ ALL GOOD</div><div class="h-name">No red flags</div><div class="h-sub">Team firing across projects</div></div>`}
  </div>`;

  const capIcon = health==='healthy'?'💡':health==='risk'?'⚠️':'🚨';

  document.getElementById('snapCardContainer').innerHTML = `
    <div id="snapCard" class="snap-card">
      <div class="snap-header">
        <div class="snap-brand">POWERPLAY · WEEKLY SNAP</div>
        <div class="snap-acct">${a.name}</div>
        <div class="snap-meta">${weekRange()} · ${a.activeUsersToday} users active this week${a.renewal?` · 🗓 Renewal: ${a.renewal}`:''}</div>
      </div>
      <div class="hero-vs">
        <div class="hero-grid">
          <div class="hero-side"><div class="hero-side-label yest-label">LAST WEEK</div><div class="hero-side-num yest-num">${a.totalYest}</div></div>
          <div class="hero-arrow ${isDown?'down':''}">→</div>
          <div class="hero-side"><div class="hero-side-label today-label ${isDown?'down':''}">THIS WEEK</div><div class="hero-side-num today-num ${isDown?'down':''}">${a.totalToday}</div></div>
        </div>
        <div class="hero-strip ${isDown?'down':isFlat?'flat':'up'}">${isDown?'↓':isFlat?'–':'↑'} ${Math.abs(pct)}% activity</div>
      </div>
      ${buildWatchList(a)}
      <div class="legend-wrap">
        <div class="legend">${legendHtml}</div>
        ${projectsHtml}
      </div>
      <div class="highlights">
        <div class="highlights-title">THIS WEEK'S HIGHLIGHTS</div>
        ${highlightsHtml}
      </div>
      <div class="caption-strip ${health}"><div class="ct">${capIcon} ${caption}</div></div>
    </div>`;

  setTimeout(() => {
    const card = document.getElementById('snapCard');
    const hint = document.getElementById('sizeHint');
    if (!card || !hint) return;
    const h = card.scrollHeight;
    let scale = 2.5;
    if (h>1800) scale = 2;
    if (h>3000) scale = 1.6;
    if (h>4500) scale = 1.3;
    if (h>6000) scale = 1.0;
    const outH = h * scale;
    const MAX_PART = 5500;
    if (outH <= MAX_PART) {
      hint.className = 'size-hint ok';
      hint.style.display = 'inline-block';
      hint.textContent = '✓ Will download as 1 image (620 × ' + Math.round(outH) + ' px)';
    } else {
      const parts = Math.ceil(outH/MAX_PART);
      hint.className = 'size-hint';
      hint.style.display = 'inline-block';
      hint.textContent = `ℹ Will split into ${parts} images for WhatsApp`;
    }
  }, 50);
}

async function downloadSnapPNG() {
  const card = document.getElementById('snapCard');
  if (!card) return;
  const safeName = currentSnapAcct.name.replace(/[^a-zA-Z0-9]+/g,'_');
  const dateStamp = new Date().toISOString().split('T')[0];
  const FIXED_WIDTH = 620;
  const orig = { width: card.style.width, maxWidth: card.style.maxWidth, margin: card.style.margin };
  card.style.width = FIXED_WIDTH+'px';
  card.style.maxWidth = FIXED_WIDTH+'px';
  card.style.margin = '0 auto';
  await new Promise(r=>requestAnimationFrame(r));
  await new Promise(r=>setTimeout(r,30));
  const h = card.scrollHeight;
  let scale = 2.5;
  if (h>1800) scale=2; if (h>3000) scale=1.6; if (h>4500) scale=1.3; if (h>6000) scale=1.0;
  showSnapToast('Generating image…');
  const restore = ()=>{ card.style.width=orig.width; card.style.maxWidth=orig.maxWidth; card.style.margin=orig.margin; };
  let canvas;
  try {
    canvas = await html2canvas(card, { backgroundColor:'#ffffff', scale, useCORS:true, width:FIXED_WIDTH, windowWidth:1200, height:h, windowHeight:h+100 });
  } catch (e) { console.error(e); showSnapToast('Render failed'); restore(); return; }
  restore();
  const MAX = 5500;
  if (canvas.height <= MAX) {
    saveCanvas(canvas, `${safeName}_weekly_snap_${dateStamp}.png`);
    showSnapToast('Image downloaded');
    return;
  }
  const parts = Math.ceil(canvas.height/MAX);
  const partH = Math.ceil(canvas.height/parts);
  for (let i=0;i<parts;i++) {
    const startY = i*partH;
    const thisH = Math.min(partH, canvas.height-startY);
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = thisH;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(canvas, 0,startY,canvas.width,thisH, 0,0,canvas.width,thisH);
    saveCanvas(c, `${safeName}_weekly_snap_${dateStamp}_part_${i+1}_of_${parts}.png`);
    await new Promise(r=>setTimeout(r,350));
  }
  showSnapToast(`Image split into ${parts} parts for WhatsApp`);
}

async function downloadSnapPDF() {
  const card = document.getElementById('snapCard');
  if (!card) return;
  if (!window.jspdf) { showSnapToast('PDF library still loading'); return; }
  const safeName = currentSnapAcct.name.replace(/[^a-zA-Z0-9]+/g,'_');
  const dateStamp = new Date().toISOString().split('T')[0];
  const FIXED_WIDTH = 620;
  const orig = { width: card.style.width, maxWidth: card.style.maxWidth, margin: card.style.margin };
  card.style.width = FIXED_WIDTH+'px';
  card.style.maxWidth = FIXED_WIDTH+'px';
  card.style.margin = '0 auto';
  await new Promise(r=>requestAnimationFrame(r));
  await new Promise(r=>setTimeout(r,30));
  const h = card.scrollHeight;
  let scale = 2; if (h>4000) scale=1.5; if (h>7000) scale=1.2;
  showSnapToast('Generating PDF…');
  const restore = ()=>{ card.style.width=orig.width; card.style.maxWidth=orig.maxWidth; card.style.margin=orig.margin; };
  let canvas;
  try {
    canvas = await html2canvas(card, { backgroundColor:'#ffffff', scale, useCORS:true, width:FIXED_WIDTH, windowWidth:1200, height:h, windowHeight:h+100 });
  } catch (e) { console.error(e); showSnapToast('PDF render failed'); restore(); return; }
  restore();
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const pdfW = pdf.internal.pageSize.getWidth();
  const pdfH = pdf.internal.pageSize.getHeight();
  const margin = 8;
  const usableW = pdfW - margin*2;
  const usableH = pdfH - margin*2;
  const mmToPx = canvas.width / usableW;
  const sliceHPx = Math.floor(usableH * mmToPx);
  const totalPages = Math.max(1, Math.ceil(canvas.height/sliceHPx));
  for (let i=0;i<totalPages;i++) {
    if (i>0) pdf.addPage();
    const startY = i*sliceHPx;
    const thisHPx = Math.min(sliceHPx, canvas.height-startY);
    const slice = document.createElement('canvas');
    slice.width = canvas.width; slice.height = thisHPx;
    const ctx = slice.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas, 0,startY,canvas.width,thisHPx, 0,0,canvas.width,thisHPx);
    const imgData = slice.toDataURL('image/jpeg', 0.92);
    const imgH = thisHPx/mmToPx;
    pdf.addImage(imgData,'JPEG',margin,margin,usableW,imgH);
    pdf.setFontSize(8); pdf.setTextColor(150);
    pdf.text(`${currentSnapAcct.name} · Weekly Snap · ${dateStamp} · Page ${i+1} of ${totalPages}`, pdfW/2, pdfH-4, {align:'center'});
  }
  pdf.save(`${safeName}_weekly_snap_${dateStamp}.pdf`);
  showSnapToast(`PDF saved (${totalPages} page${totalPages>1?'s':''})`);
}

function generateEmail(acc) {
  const isInactive = acc.priority === 'INACTIVE';

  // Trainer name — handle both "Ipsita Tripathy" (already formatted) and "ipsitatripathy" (no dot)
  const trainerName = (function() {
    const t = acc.trainer || '';
    if (t.includes(' ')) return t; // already has space — formatted correctly
    return t.split('.').filter(Boolean).map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
  })();

  const orgFirst = acc.name.split(' ')[0];
  const orgShort = acc.name.length > 28 ? acc.name.substring(0,26)+'…' : acc.name;

  const projCount = (acc.projects||[]).length;

  // Module display name map
  const MOD_NAMES = {
    'material':'Material Module','task':'Task Module','attendance':'Attendance Module',
    'expense':'Expense Module','drive':'Drive Module','boq':'BOQ/Cost Module',
    'material payable':'Vendor Payables','material payable payment':'Payment Module',
  };
  function modDisp(n) { return MOD_NAMES[n.toLowerCase()] || (n.charAt(0).toUpperCase()+n.slice(1)); }

  // Gather module activity across all projects, with project context
  const allMods = {};
  (acc.projects||[]).forEach(p => {
    (p.modules||[]).forEach(m => {
      if (!allMods[m.name]) allMods[m.name] = {wk0:0, wk1:0, projs:[]};
      allMods[m.name].wk0 += (m.wk0||0);
      allMods[m.name].wk1 += (m.wk1||0);
      if ((m.wk0||0)>0) allMods[m.name].projs.push(p.name);
    });
  });
  const activeModules=[], dropModules=[], zeroModules=[];
  Object.entries(allMods).forEach(([name,d])=>{
    if(d.wk0>0) activeModules.push({name, wk0:d.wk0, wk1:d.wk1, projs:[...new Set(d.projs)]});
    else if(d.wk1>0) dropModules.push({name, wk0:0, wk1:d.wk1});
    else zeroModules.push({name});
  });

  // OB planned modules from ob_org_details IC fields
  const obPlanned = [];
  if(acc.mat_plan)    obPlanned.push({display:'Material Module',   plan:acc.mat_plan});
  if(acc.tsk_plan)    obPlanned.push({display:'Task Module',       plan:acc.tsk_plan});
  if(acc.att_plan)    obPlanned.push({display:'Attendance Module', plan:acc.att_plan});
  if(acc.exp_plan)    obPlanned.push({display:'Expense/BOQ Module',plan:acc.exp_plan});
  if(acc.others_plan && acc.others_plan.length>1) obPlanned.push({display:acc.others_plan, plan:acc.others_plan});

  // Gap = planned at OB but not yet active; fallback to zero-activity modules
  const activeSet = new Set(activeModules.map(m=>modDisp(m.name)));
  const obGaps    = obPlanned.filter(pm=>!activeSet.has(pm.display));
  const gapModules = obGaps.length>0 ? obGaps : zeroModules.map(m=>({display:modDisp(m.name), plan:''}));

  // Drop project + its worst-dropped module
  const dropProj = (acc.projects||[]).filter(p=>(p.wk0||0)<(p.wk1||0)).sort((a,b)=>((b.wk1||0)-(b.wk0||0))-((a.wk1||0)-(a.wk0||0)))[0];
  const topProj  = (acc.projects||[]).slice().sort((a,b)=>(b.wk0||0)-(a.wk0||0))[0];

  let plain = '', html = '';

  if (isInactive) {
    // ── INACTIVE TEMPLATE ──
    const obReminder = acc.ob_notes && acc.ob_notes.length > 5
      ? acc.ob_notes.substring(0, 300) + (acc.ob_notes.length > 300 ? '…' : '')
      : '• Tracking material issues at the site level\n• Monitoring daily labour and attendance\n• Reducing project delays due to poor documentation';

    plain = `Hi ${orgFirst} Sir & Team,

Hope you're doing well. We noticed that Powerplay hasn't been active since our onboarding session, and we wanted to check in — because we genuinely want to make sure the problems you came to us with actually get solved.

💡 Why You Signed Up — A Quick Reminder

At the time of onboarding, you highlighted these key challenges:
${obReminder}

These problems don't go away on their own. The risk of repeating the same challenges at a larger scale is very real.

📋 What's Already Ready For You
• System is configured and waiting
• ${trainerName} is ready to resume right where we left off
• All ${projCount} project(s) are set up on Powerplay${obPlanned.length>0?'\n• Modules committed at onboarding: '+obPlanned.map(m=>m.display).join(', '):''}

⚡ One Ask — Let's Get Restarted
Can we schedule a 30-minute session this week? The goal is simple — get the site team logging daily updates on Powerplay before more time passes.

Please share a convenient time and we'll take it from there immediately.

Warm regards,
${trainerName} & Monika
Powerplay — Customer Success`;

    html = plain
      .replace(/💡 Why You Signed Up — A Quick Reminder/, '<b>💡 Why You Signed Up — A Quick Reminder</b>')
      .replace(/📋 What's Already Ready For You/, "<b>📋 What's Already Ready For You</b>")
      .replace(/⚡ One Ask — Let's Get Restarted/, "<b>⚡ One Ask — Let's Get Restarted</b>");

  } else {
    // ── ACTIVE TEMPLATE ──
    const projActive = (acc.projects||[]).filter(p=>(p.wk0||0)>0).map(p=>p.name).join(', ') || '—';

    // OB pain point intro — don't quote setup notes verbatim; use as context
    const obRaw = acc.ob_notes || '';
    const isSetupNote = obRaw.toLowerCase().includes('configuration') || obRaw.toLowerCase().includes('finalized') || obRaw.toLowerCase().includes('setup');
    const obIntro = obRaw.length > 5 && !isSetupNote
      ? `At the time of onboarding, the core problem discussed was: ${obRaw.substring(0,200)}${obRaw.length>200?'…':''}`
      : 'At the time of onboarding, the core challenge discussed was real-time visibility into site activities — material consumption, labour, and task progress — all tracked in one place instead of WhatsApp/Excel.';

    // ✅ Narrative paragraph per active module (not bullet list)
    const primaryMod  = activeModules.slice().sort((a,b)=>b.wk0-a.wk0)[0];
    const bonusMods   = activeModules.filter(m=>m!==primaryMod);
    let wellNarrative = '';
    if (primaryMod) {
      const allProjNames = [...new Set(activeModules.flatMap(m=>m.projs))];
      const projStr = allProjNames.length > 0 ? `all ${allProjNames.length} project${allProjNames.length>1?'s':''} — ${allProjNames.join(', ')}` : projActive;
      wellNarrative += `The ${modDisp(primaryMod.name)} is now live and active across ${projStr}. The team has logged ${primaryMod.wk0} entries this week${primaryMod.wk1>0?' ('+primaryMod.wk1+' last week)':''} — this is exactly the visibility we aimed for.`;
      bonusMods.forEach(m => {
        const mProjs = m.projs.join(', ') || projActive;
        wellNarrative += `\n\nThe ${modDisp(m.name)} is also active in ${mProjs} with ${m.wk0} entries this week${m.wk1>0?' ('+m.wk1+' last week)':''}.`;
      });
    } else {
      wellNarrative = `${acc.wk0} actions recorded this week across ${projActive}.`;
    }

    // ❗ Onboarding gap block
    let gapBlock = '';
    if (gapModules.length > 0) {
      const gapLines = gapModules.map(gm => {
        const planCtx = gm.plan && gm.plan.length > 2 ? ` — ${gm.plan}` : '';
        return `• ${gm.display}${planCtx}`;
      }).join('\n');
      gapBlock = `
❗ Not Yet Started — Onboarding Gap
These modules were part of the plan from your onboarding discussion but haven't been set up yet:
${gapLines}

Starting even one of these this week will directly address the original challenges you signed up to solve.
`;
    }

    // ⚠️ Attention block with specific project+module numbers
    let attBlock = '';
    if (dropProj) {
      const dropMods = (dropProj.modules||[]).filter(m=>(m.wk0||0)<(m.wk1||0)).sort((a,b)=>((b.wk1||0)-(b.wk0||0))-((a.wk1||0)-(a.wk0||0)));
      const dm = dropMods[0];
      const dropDesc = dm
        ? `${modDisp(dm.name)} entries dropped from ${dm.wk1} → ${dm.wk0} this week`
        : `activity dropped from ${dropProj.wk1} → ${dropProj.wk0} this week`;
      attBlock = `
⚠️ One Area Needs Attention — ${dropProj.name}
${dropProj.name}: ${dropDesc}. This usually means the team has shifted back to WhatsApp/Excel, or there's a small process gap to close. A quick 15-min call with the site team will fix this.
`;
    } else if (dropModules.length > 0) {
      attBlock = `
⚠️ One Area Needs Attention
These modules went quiet this week:
${dropModules.map(m=>`• ${modDisp(m.name)} — was ${m.wk1} entries last week, now 0`).join('\n')}
A quick 15-min check-in with the team will fix this.
`;
    }

    // 📋 Next steps
    const s1 = gapModules.length > 0
      ? `Share the required data with ${trainerName} to complete ${gapModules[0].display} setup — this week`
      : dropProj
        ? `Quick connect with the ${dropProj.name} site team to understand the drop and restart daily entries`
        : `Expand ${activeModules[0] ? modDisp(activeModules[0].name) : 'active modules'} to all projects`;
    const s2 = dropProj
      ? `Schedule a 15-min call with ${trainerName} to review the ${dropProj.name} drop`
      : `Keep ${activeModules[0] ? modDisp(activeModules[0].name) : 'current modules'} consistent across all ${projCount} project${projCount!==1?'s':''}`;
    const s3 = gapModules.length > 1
      ? `Schedule a walkthrough with ${trainerName} for ${gapModules[1].display} — 15 mins is all it takes`
      : `Schedule a review call with ${trainerName} — we'll take it from there`;

    // Greeting — use poc_name if available, otherwise org name
    const greeting = acc.poc_name && acc.poc_name.length > 2
      ? `Hi ${acc.poc_name} & Team,`
      : `Hi ${orgFirst} Sir & Team,`;

    plain = `${greeting}

Hope everyone is doing well! It's been a few weeks since we went live on Powerplay, and we wanted to share a quick progress update — what's working well and where we can unlock more value together.

✅ What's Going Well
${obIntro}

${wellNarrative}
${gapBlock}${attBlock}
📋 Suggested Next Steps
1. ${s1}
2. ${s2}
3. ${s3}

We're excited about the progress and want to make sure you're getting full value before your next projects go live. Please share a convenient time this week — ${trainerName} will take it from there!

Warm regards,
${trainerName} & Monika
Powerplay — Customer Success`;

    html = plain
      .replace(/✅ What's Going Well/, "<b>✅ What's Going Well</b>")
      .replace(/❗ Not Yet Started — Onboarding Gap/, '<b>❗ Not Yet Started — Onboarding Gap</b>')
      .replace(/⚠️ One Area Needs Attention[^\n]*/, m => '<b>'+m+'</b>')
      .replace(/📋 Suggested Next Steps/, '<b>📋 Suggested Next Steps</b>');
  }

  // Subject line
  const subject = isInactive
    ? `Action Required: Your Powerplay Onboarding — Let's Get Back on Track | ${orgShort}`
    : gapModules.length > 0
      ? `Powerplay Progress Update — ${gapModules.length} Module${gapModules.length>1?'s':''} Yet to Start | ${orgShort}`
      : `Your Powerplay Progress Update | ${orgShort}`;

  return { html, plain, priority: acc.priority, subject };
}
// ── End Email Generator ───────────────────────────────────────

// Initial fetch
fetchAndRender();
</script>
</body>
</html>
